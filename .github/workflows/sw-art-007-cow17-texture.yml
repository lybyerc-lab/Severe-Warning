name: SW-ART-007 Cow 17 Texture

on:
  push:
    branches:
      - agent/sw-art-007-cow17-texture
    paths:
      - tools/meshy/live-requests/cow17-texture-v1.json

permissions:
  contents: read
  actions: read

concurrency:
  group: sw-art-007-cow17-texture
  cancel-in-progress: false

jobs:
  texture-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact task source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prove exact base and bounded changed-file territory
        shell: bash
        run: |
          set -euo pipefail
          base='4329f5ce1f30947cb4160af66b7774f09adb0299'
          test "$(git merge-base "$base" HEAD)" = "$base"
          git diff --name-only "$base"...HEAD | tee sw-art-007-changed-files.txt
          bad="$(grep -Ev '^(tools/meshy/sw-meshy-retexture\.mjs|tools/meshy/live-requests/cow17-texture-v1\.json|scripts/verify-sw-art-007-cow17-texture\.mjs|\.github/workflows/sw-art-007-cow17-texture\.yml)$' sw-art-007-changed-files.txt || true)"
          if [ -n "$bad" ]; then
            echo 'SW-ART-007 changed files outside allowed tooling territory:' >&2
            echo "$bad" >&2
            exit 1
          fi

      - name: Block rerun credit spend
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_RUN_ATTEMPT}" != '1' ]; then
            echo 'SW-ART-007 Retexture must not be rerun; create a new reviewed request commit instead.' >&2
            exit 1
          fi

      - name: Resolve exactly one reviewed texture request
        id: request
        shell: bash
        env:
          MESHY_API_KEY: ${{ secrets.Meshy_API }}
        run: |
          set -euo pipefail
          test -n "$MESHY_API_KEY" || { echo 'GitHub Actions secret Meshy_API is missing or empty.' >&2; exit 1; }
          request_file='tools/meshy/live-requests/cow17-texture-v1.json'
          test -f "$request_file"
          changed="$(git diff-tree --root --no-commit-id --name-only -r "$GITHUB_SHA" -- "$request_file")"
          test "$changed" = "$request_file" || { echo 'Launch commit must change exactly the reviewed SW-ART-007 request file.' >&2; exit 1; }
          REQUEST_FILE="$request_file" node - <<'NODE'
          const fs = require('fs');
          const request = JSON.parse(fs.readFileSync(process.env.REQUEST_FILE, 'utf8'));
          const fail = (message) => { throw new Error(message); };
          if (request.version !== 'SW_MESHY_RETEXTURE_LIVE_REQUEST_V1') fail(`Unexpected version: ${request.version}`);
          if (request.productionAuthority !== 'candidate only') fail('Output must remain candidate only.');
          if (request.geometrySource?.meshyTaskId !== '01a0072a-a5bc-767d-aace-5ec692250b13') fail('Geometry must be exact owner-accepted SW-ART-006 task.');
          if (request.geometrySource?.expectedVertices !== 99575 || request.geometrySource?.expectedTriangles !== 199162) fail('Unexpected accepted geometry baseline.');
          if (request.styleSource?.runId !== 31906670874 || request.styleSource?.artifactId !== 9252535475) fail('Style must be exact SW-ART-005 Gemini artifact.');
          if (request.styleSource?.expectedSha256 !== '58384a916ba6ca0b4ea18c4a434c57bc64e8a8c956a3ab065208ecc066df47fb') fail('Unexpected style-image SHA.');
          if (request.meshy?.aiModel !== 'meshy-6' || request.meshy?.enableOriginalUv !== true || request.meshy?.enablePbr !== true) fail('SW-ART-007 texture contract violated.');
          if (request.meshy?.textureResolution !== '2k' || request.meshy?.removeLighting !== true) fail('SW-ART-007 texture quality contract violated.');
          if (request.costGuard?.authorizedTasks !== 1 || request.costGuard?.maxCredits !== 10) fail('SW-ART-007 cost guard violated.');
          const values = {
            request_file: process.env.REQUEST_FILE,
            request_id: request.id,
            source_run_id: request.styleSource.runId,
            source_artifact_id: request.styleSource.artifactId,
            source_path: request.styleSource.path,
            output_dir: request.output.dir,
          };
          for (const [key, value] of Object.entries(values)) {
            if (String(value).includes('\n')) fail(`Multiline workflow output rejected: ${key}`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `${key}=${value}\n`);
          }
          console.log(`SW-ART-007 request contract PASS: ${request.id}`);
          NODE

      - name: Verify Cow 17 texture tooling before spend
        run: node scripts/verify-sw-art-007-cow17-texture.mjs

      - name: Preserve existing Meshy and authored-asset contracts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-sw-art-003-meshy-pipeline.mjs
          node scripts/verify-sw-art-006-refined-face-meshy.mjs
          node scripts/verify-threejs-asset-pipeline.mjs

      - name: Download exact Gemini-refined texture reference
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.request.outputs.source_artifact_id }}
          path: sw-art-007-source
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.request.outputs.source_run_id }}
          merge-multiple: true

      - name: Prove exact texture reference
        id: source
        shell: bash
        env:
          REQUEST_FILE: ${{ steps.request.outputs.request_file }}
          SOURCE_PATH: ${{ steps.request.outputs.source_path }}
        run: |
          set -euo pipefail
          full_path="sw-art-007-source/$SOURCE_PATH"
          test -s "$full_path"
          ACTUAL_PATH="$full_path" REQUEST_FILE="$REQUEST_FILE" node - <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const request = JSON.parse(fs.readFileSync(process.env.REQUEST_FILE, 'utf8'));
          const bytes = fs.readFileSync(process.env.ACTUAL_PATH);
          const sha = crypto.createHash('sha256').update(bytes).digest('hex');
          if (sha !== request.styleSource.expectedSha256) throw new Error(`Style-image SHA mismatch: ${sha}`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `full_path=${process.env.ACTUAL_PATH}\n`);
          console.log(`Exact Cow 17 texture reference PASS: ${sha}`);
          NODE

      - name: Exercise no-credit Retexture dry run
        shell: bash
        env:
          MESHY_API_KEY: ''
          REQUEST_FILE: ${{ steps.request.outputs.request_file }}
          STYLE_IMAGE: ${{ steps.source.outputs.full_path }}
        run: |
          set -euo pipefail
          node tools/meshy/sw-meshy-retexture.mjs \
            --request "$REQUEST_FILE" \
            --style-image "$STYLE_IMAGE" \
            --output-dir "${{ steps.request.outputs.output_dir }}" \
            --dry-run > sw-art-007-meshy-dry-run.json
          test -s sw-art-007-meshy-dry-run.json

      - name: Texture accepted Cow 17 geometry
        shell: bash
        env:
          MESHY_API_KEY: ${{ secrets.Meshy_API }}
          REQUEST_FILE: ${{ steps.request.outputs.request_file }}
          STYLE_IMAGE: ${{ steps.source.outputs.full_path }}
        run: |
          set -euo pipefail
          node tools/meshy/sw-meshy-retexture.mjs \
            --request "$REQUEST_FILE" \
            --style-image "$STYLE_IMAGE" \
            --output-dir "${{ steps.request.outputs.output_dir }}"
          test -s "${{ steps.request.outputs.output_dir }}/cow17-textured-v1.glb"
          test -s "${{ steps.request.outputs.output_dir }}/cow17-textured-v1-preview.png"
          test -s "${{ steps.request.outputs.output_dir }}/cow17-textured-v1-base-color.png"
          test -s "${{ steps.request.outputs.output_dir }}/cow17-textured-v1-metallic.png"
          test -s "${{ steps.request.outputs.output_dir }}/cow17-textured-v1-roughness.png"
          test -s "${{ steps.request.outputs.output_dir }}/cow17-textured-v1-normal.png"
          test -s "${{ steps.request.outputs.output_dir }}/sw-art-007-glb-inspection.json"
          test -s "${{ steps.request.outputs.output_dir }}/sw-art-007-receipt.json"

      - name: Record exact texture output hashes
        shell: bash
        env:
          STYLE_IMAGE: ${{ steps.source.outputs.full_path }}
        run: |
          set -euo pipefail
          sha256sum \
            "$STYLE_IMAGE" \
            "${{ steps.request.outputs.output_dir }}/cow17-textured-v1.glb" \
            "${{ steps.request.outputs.output_dir }}/cow17-textured-v1-preview.png" \
            "${{ steps.request.outputs.output_dir }}/cow17-textured-v1-base-color.png" \
            "${{ steps.request.outputs.output_dir }}/cow17-textured-v1-metallic.png" \
            "${{ steps.request.outputs.output_dir }}/cow17-textured-v1-roughness.png" \
            "${{ steps.request.outputs.output_dir }}/cow17-textured-v1-normal.png" \
            | tee sw-art-007-sha256.txt

      - name: Upload textured Cow 17 evidence
        uses: actions/upload-artifact@v4
        with:
          name: sw-art-007-${{ steps.request.outputs.request_id }}
          retention-days: 30
          if-no-files-found: error
          path: |
            sw-art-007-static-report.json
            sw-art-007-changed-files.txt
            sw-art-007-meshy-dry-run.json
            sw-art-007-sha256.txt
            ${{ steps.source.outputs.full_path }}
            ${{ steps.request.outputs.output_dir }}/cow17-textured-v1.glb
            ${{ steps.request.outputs.output_dir }}/cow17-textured-v1-preview.png
            ${{ steps.request.outputs.output_dir }}/cow17-textured-v1-base-color.png
            ${{ steps.request.outputs.output_dir }}/cow17-textured-v1-metallic.png
            ${{ steps.request.outputs.output_dir }}/cow17-textured-v1-roughness.png
            ${{ steps.request.outputs.output_dir }}/cow17-textured-v1-normal.png
            ${{ steps.request.outputs.output_dir }}/cow17-textured-v1-emission.png
            ${{ steps.request.outputs.output_dir }}/sw-art-007-task-created.json
            ${{ steps.request.outputs.output_dir }}/sw-art-007-task-final.json
            ${{ steps.request.outputs.output_dir }}/sw-art-007-glb-inspection.json
            ${{ steps.request.outputs.output_dir }}/sw-art-007-receipt.json
            threejs-asset-pipeline-static-report.json
