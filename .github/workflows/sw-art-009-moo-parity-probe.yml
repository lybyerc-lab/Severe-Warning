name: SW-ART-009 Moo Level Parity Probe

on:
  push:
    branches:
      - agent/sw-art-009-cow17-runtime-integration
    paths:
      - tools/art/live-requests/cow17-moo-parity-probe-v1.json

permissions:
  contents: read

concurrency:
  group: sw-art-009-moo-parity-probe
  cancel-in-progress: true

jobs:
  probe:
    name: Compare accepted-base and Cow 17 Moo Level QA
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove probe scope
        shell: bash
        run: |
          set -euo pipefail
          base='de2e62835e79567b4bbfc079a372ce2af4ee0879'
          test "$(git merge-base "$base" HEAD)" = "$base"
          test "${GITHUB_RUN_ATTEMPT}" = '1' || { echo 'Probe reruns are forbidden; create a fresh reviewed request commit.' >&2; exit 1; }
          request='tools/art/live-requests/cow17-moo-parity-probe-v1.json'
          test -s "$request"
          test "$(git diff-tree --root --no-commit-id --name-only -r "$GITHUB_SHA" -- "$request")" = "$request"

      - name: Checkout accepted canonical
        uses: actions/checkout@v4
        with:
          ref: de2e62835e79567b4bbfc079a372ce2af4ee0879
          path: accepted-base
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frozen dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --global pnpm@11.9.0
          pnpm install --frozen-lockfile
          pnpm --dir accepted-base install --frozen-lockfile

      - name: Prepare deterministic local assets
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo timeout 120s apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
            sudo timeout 120s apt-get install --yes --no-install-recommends ffmpeg
          fi
          timeout 180s pnpm run audio:generate
          timeout 60s node scripts/vendor-threejs-hero-slice4-assets.mjs
          (
            cd accepted-base
            timeout 180s pnpm run audio:generate
            timeout 60s node scripts/vendor-threejs-hero-slice4-assets.mjs
          )

      - name: Assemble exact accepted Stage 2B source on both sides
        shell: bash
        run: |
          set -euo pipefail
          initial_scripts=(
            apply-v431-source-patch.mjs
            apply-v440-source-patch.mjs
            apply-v441-source-patch.mjs
            apply-v442-source-patch.mjs
            fix-v450-parser.mjs
            apply-v450-source-patch.mjs
            apply-v450-rampage-music-patch.mjs
            apply-qa-corrections-patch.mjs
            apply-audio-mix-followup-patch.mjs
            apply-ui-polish-followup-patch.mjs
            apply-score-continuity-fix.mjs
            apply-qa4-deterministic-lab-patch.mjs
            apply-qa4-mobile-input-fix.mjs
            apply-qa4-run-lock-fix.mjs
            apply-qa4-pause-forensics.mjs
            apply-pause-overlay-hit-test-fix.mjs
            apply-pause-overlay-hard-hide.mjs
            apply-qa4-popup-assertion-fix.mjs
            apply-qa4-rampage-popup-fix.mjs
            apply-v500-campaign-patch.mjs
            apply-v500-realtime-clock-fix.mjs
            apply-v500-world-tour-patch.mjs
            apply-v500-mobile-layout-fix.mjs
            apply-v500-cow-signature-patch.mjs
            apply-v510-production-slice.mjs
            apply-modernization-phase2-clocks.mjs
            apply-phase2-player-forensics-guard.mjs
            apply-modernization-phase3-input-abilities.mjs
            apply-modernization-phase4-scoring-campaign.mjs
            apply-modernization-phase5-presentation-world.mjs
            apply-modernization-phase6-performance.mjs
            apply-city-fabric-destruction.mjs
            apply-presentation-identity-moo-brew.mjs
            apply-threejs-asset-pipeline.mjs
            apply-threejs-visual-foundation.mjs
            apply-threejs-hero-slice4.mjs
            apply-threejs-hero-slice5.mjs
            apply-threejs-hero-slice6.mjs
            apply-sw-game-002-moo-level.mjs
            apply-sw-ui-001-newspaper-presentation.mjs
            apply-sw-score-001-persistent-scorekeeper.mjs
            apply-sw-rpg-001-moolah-storm-triangle.mjs
            apply-sw-rpg-002-slingshot.mjs
            apply-sw-level-001-storm-site-framework.mjs
            apply-sw-ui-002-landscape-unleash.mjs
            apply-sw-quality-001-owner-playtest-rescue.mjs
          )
          overlay_scripts=(
            apply-sw-quality-002-visual-rescue.mjs
            apply-sw-quality-002-storm-frame-bridge.mjs
            apply-sw-ui-003-run-shell-identity.mjs
            apply-sw-ui-004-gameplay-product-identity.mjs
            apply-sw-world-007-secondary-storm-forms.mjs
            apply-sw-world-007-atmospheric-correction.mjs
            apply-sw-world-007-visibility-lock.mjs
            apply-sw-world-007-secondary-exclusive.mjs
            apply-sw-feel-001-destruction-consequence.mjs
            apply-sw-feel-001-structural-anatomy.mjs
            apply-sw-feel-001-structural-priority.mjs
            apply-sw-ui-005-field-controls.mjs
          )
          assemble_stack() {
            local root="$1"
            local output="$2"
            cp "$root/MechanicsLab/SevereWeather_3D_Lab.html" "$output"
            (
              cd "$root"
              export SEVERE_WEATHER_SOURCE_PATH="$output"
              for script in "${initial_scripts[@]}"; do node "scripts/$script"; done
              for script in "${overlay_scripts[@]}"; do node "scripts/$script"; done
            )
          }
          candidate_source="$RUNNER_TEMP/sw-art-009-moo-candidate.html"
          base_source="$RUNNER_TEMP/sw-art-009-moo-base.html"
          assemble_stack '.' "$candidate_source"
          assemble_stack 'accepted-base' "$base_source"
          echo "SEVERE_WEATHER_SOURCE_PATH=$candidate_source" >> "$GITHUB_ENV"
          echo "SW_ART_009_BASE_SOURCE_PATH=$base_source" >> "$GITHUB_ENV"

      - name: Build both packages
        shell: bash
        run: |
          set -euo pipefail
          (
            cd accepted-base
            SEVERE_WEATHER_SOURCE_PATH="$SW_ART_009_BASE_SOURCE_PATH" pnpm run build
          )
          pnpm run build
          test -s accepted-base/www/index.html
          test -s www/index.html
          test ! -e accepted-base/www/assets/production/characters/cow17-walking-v1.glb
          test -s www/assets/production/characters/cow17-walking-v1.glb

      - name: Install Playwright Chromium
        shell: bash
        run: npx playwright install chromium

      - name: Run exact Moo Level QA against accepted base and candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-artifacts/sw-art-009/moo-parity/base qa-artifacts/sw-art-009/moo-parity/candidate
          python3 -m http.server 4172 --directory accepted-base/www > qa-artifacts/sw-art-009/moo-parity/base-server.log 2>&1 &
          BASE_PID=$!
          python3 -m http.server 4173 --directory www > qa-artifacts/sw-art-009/moo-parity/candidate-server.log 2>&1 &
          CANDIDATE_PID=$!
          cleanup() {
            kill "$BASE_PID" "$CANDIDATE_PID" 2>/dev/null || true
            for name in headless_shell chrome chromium; do pkill -TERM -x "$name" 2>/dev/null || true; done
          }
          trap cleanup EXIT
          for port in 4172 4173; do
            for attempt in $(seq 1 80); do
              if curl --silent --fail "http://127.0.0.1:${port}/" >/dev/null; then break; fi
              sleep 0.25
            done
            curl --silent --fail "http://127.0.0.1:${port}/" >/dev/null
          done

          set +e
          (
            cd accepted-base
            env SEVERE_WEATHER_QA_URL='http://127.0.0.1:4172/' SEVERE_WEATHER_QA_DIR="$GITHUB_WORKSPACE/qa-artifacts/sw-art-009/moo-parity/base" pnpm run qa:sw-game-002
          ) > qa-artifacts/sw-art-009/moo-parity/base-qa.log 2>&1
          BASE_STATUS=$?
          for name in headless_shell chrome chromium; do pkill -TERM -x "$name" 2>/dev/null || true; done
          sleep 1
          env SEVERE_WEATHER_QA_URL='http://127.0.0.1:4173/' SEVERE_WEATHER_QA_DIR='qa-artifacts/sw-art-009/moo-parity/candidate' pnpm run qa:sw-game-002 > qa-artifacts/sw-art-009/moo-parity/candidate-qa.log 2>&1
          CANDIDATE_STATUS=$?
          set -e
          echo "BASE_STATUS=$BASE_STATUS" >> "$GITHUB_ENV"
          echo "CANDIDATE_STATUS=$CANDIDATE_STATUS" >> "$GITHUB_ENV"
          cat qa-artifacts/sw-art-009/moo-parity/base-qa.log
          cat qa-artifacts/sw-art-009/moo-parity/candidate-qa.log

      - name: Capture marker diagnostics and classify parity
        shell: bash
        run: |
          set -euo pipefail
          BASE_STATUS="$BASE_STATUS" CANDIDATE_STATUS="$CANDIDATE_STATUS" node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const sides = [
            { name: 'base', url: 'http://127.0.0.1:4172/' },
            { name: 'candidate', url: 'http://127.0.0.1:4173/' },
          ];
          const diagnostics = {};
          for (const side of sides) {
            const browser = await chromium.launch({ headless: true, args: ['--no-sandbox', '--enable-webgl', '--use-angle=swiftshader', '--enable-unsafe-swiftshader'] });
            const page = await browser.newPage({ viewport: { width: 1280, height: 720 } });
            const pageErrors = [];
            const consoleErrors = [];
            page.on('pageerror', (error) => pageErrors.push(error.message));
            page.on('console', (message) => { if (message.type() === 'error') consoleErrors.push(message.text()); });
            const start = Date.now();
            await page.goto(`${side.url}?mooqa=1`, { waitUntil: 'domcontentloaded', timeout: 60000 });
            let observed = null;
            for (let i = 0; i < 120; i += 1) {
              observed = await page.evaluate(() => ({
                readyState: document.readyState,
                getMooType: typeof globalThis.getMooLevelQaState,
                qaType: typeof globalThis.__SW_MOO_LEVEL_QA__,
                state: typeof globalThis.getMooLevelQaState === 'function' ? globalThis.getMooLevelQaState() : null,
              }));
              if (observed?.state?.marker === 'SW_GAME_002_MOO_LEVEL_V1') break;
              await page.waitForTimeout(250);
            }
            diagnostics[side.name] = {
              markerReached: observed?.state?.marker === 'SW_GAME_002_MOO_LEVEL_V1',
              elapsedMs: Date.now() - start,
              observed,
              pageErrors,
              consoleErrors,
            };
            await browser.close();
          }

          const baseStatus = Number(process.env.BASE_STATUS);
          const candidateStatus = Number(process.env.CANDIDATE_STATUS);
          let verdict;
          if (baseStatus === 0 && candidateStatus === 0) verdict = 'both-pass-attempt-9-was-flaky';
          else if (baseStatus === 0 && candidateStatus !== 0) verdict = 'candidate-regression';
          else if (baseStatus !== 0 && candidateStatus === 0) verdict = 'candidate-not-worse-than-base';
          else {
            const sameMarkerClass = diagnostics.base.markerReached === diagnostics.candidate.markerReached;
            verdict = sameMarkerClass ? 'both-fail-same-marker-class-inherited-or-flaky' : 'both-fail-different-class-investigate';
          }
          const report = { version: 'SW_ART_009_MOO_PARITY_V1', baseStatus, candidateStatus, diagnostics, verdict };
          fs.writeFileSync('qa-artifacts/sw-art-009/moo-parity/parity.json', `${JSON.stringify(report, null, 2)}\n`);
          console.log(JSON.stringify(report, null, 2));
          if (verdict === 'candidate-regression' || verdict === 'both-fail-different-class-investigate') process.exit(1);
          NODE

      - name: Upload Moo parity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sw-art-009-moo-parity-${{ github.run_number }}
          retention-days: 14
          if-no-files-found: error
          path: qa-artifacts/sw-art-009/moo-parity
