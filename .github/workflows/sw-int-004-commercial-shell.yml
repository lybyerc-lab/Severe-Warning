name: SW-INT-004 Commercial Shell

on:
  push:
    branches:
      - agent/sw-int-004-commercial-shell
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sw-int-004-commercial-shell
  cancel-in-progress: true

jobs:
  commercial-shell:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout integration candidate
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate

      - name: Install dependencies and Chromium
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Prepare deterministic local assets
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          pnpm run audio:generate
          node scripts/vendor-threejs-hero-slice4-assets.mjs

      - name: Verify accepted UI sources
        run: |
          set -euo pipefail
          node scripts/verify-sw-ui-003-run-shell-identity.mjs
          node scripts/verify-sw-ui-004-gameplay-product-identity.mjs

      - name: Assemble accepted Stage 2B through QUALITY-001
        shell: bash
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/sw-int-004.html"
          cp MechanicsLab/SevereWeather_3D_Lab.html "$candidate"
          export SEVERE_WEATHER_SOURCE_PATH="$candidate"
          for script in \
            apply-v431-source-patch.mjs \
            apply-v440-source-patch.mjs \
            apply-v441-source-patch.mjs \
            apply-v442-source-patch.mjs \
            fix-v450-parser.mjs \
            apply-v450-source-patch.mjs \
            apply-v450-rampage-music-patch.mjs \
            apply-qa-corrections-patch.mjs \
            apply-audio-mix-followup-patch.mjs \
            apply-ui-polish-followup-patch.mjs \
            apply-score-continuity-fix.mjs \
            apply-qa4-deterministic-lab-patch.mjs \
            apply-qa4-mobile-input-fix.mjs \
            apply-qa4-run-lock-fix.mjs \
            apply-qa4-pause-forensics.mjs \
            apply-pause-overlay-hit-test-fix.mjs \
            apply-pause-overlay-hard-hide.mjs \
            apply-qa4-popup-assertion-fix.mjs \
            apply-qa4-rampage-popup-fix.mjs \
            apply-v500-campaign-patch.mjs \
            apply-v500-realtime-clock-fix.mjs \
            apply-v500-world-tour-patch.mjs \
            apply-v500-mobile-layout-fix.mjs \
            apply-v500-cow-signature-patch.mjs \
            apply-v510-production-slice.mjs \
            apply-modernization-phase2-clocks.mjs \
            apply-phase2-player-forensics-guard.mjs \
            apply-modernization-phase3-input-abilities.mjs \
            apply-modernization-phase4-scoring-campaign.mjs \
            apply-modernization-phase5-presentation-world.mjs \
            apply-modernization-phase6-performance.mjs \
            apply-city-fabric-destruction.mjs \
            apply-presentation-identity-moo-brew.mjs \
            apply-threejs-asset-pipeline.mjs \
            apply-threejs-visual-foundation.mjs \
            apply-threejs-hero-slice4.mjs \
            apply-threejs-hero-slice5.mjs \
            apply-threejs-hero-slice6.mjs \
            apply-sw-game-002-moo-level.mjs \
            apply-sw-ui-001-newspaper-presentation.mjs \
            apply-sw-score-001-persistent-scorekeeper.mjs \
            apply-sw-rpg-001-moolah-storm-triangle.mjs \
            apply-sw-rpg-002-slingshot.mjs \
            apply-sw-level-001-storm-site-framework.mjs \
            apply-sw-ui-002-landscape-unleash.mjs \
            apply-sw-quality-001-owner-playtest-rescue.mjs
          do
            node "scripts/$script"
          done
          echo "SEVERE_WEATHER_SOURCE_PATH=$candidate" >> "$GITHUB_ENV"

      - name: Preserve accepted static contracts
        run: |
          set -euo pipefail
          pnpm run verify:process
          pnpm run verify:sw-game-002
          pnpm run verify:sw-ui-001
          pnpm run verify:sw-score-001
          pnpm run verify:sw-rpg-001
          pnpm run verify:sw-rpg-002
          pnpm run verify:sw-level-001
          node scripts/verify-sw-quality-001-owner-playtest-rescue.mjs
          node scripts/verify-sw-quality-002-visual-rescue.mjs
          node scripts/verify-sw-ui-003-run-shell-identity.mjs
          node scripts/verify-sw-ui-004-gameplay-product-identity.mjs

      - name: Build QUALITY-001 packaged player bundle
        run: |
          set -euo pipefail
          pnpm run modern:build
          node scripts/build-web.mjs

      - name: Preserve QUALITY-001 browser rescue
        run: node scripts/qa-sw-quality-001-owner-playtest-rescue.mjs

      - name: Apply QUALITY-002 plus accepted commercial shell
        run: |
          set -euo pipefail
          node scripts/apply-sw-quality-002-visual-rescue.mjs
          node scripts/apply-sw-quality-002-storm-frame-bridge.mjs
          node scripts/apply-sw-ui-003-run-shell-identity.mjs
          node scripts/apply-sw-ui-004-gameplay-product-identity.mjs
          node scripts/verify-sw-quality-002-visual-rescue.mjs
          node scripts/verify-sw-ui-003-run-shell-identity.mjs
          node scripts/verify-sw-ui-004-gameplay-product-identity.mjs
          node scripts/build-web.mjs

      - name: Preserve QUALITY-002 browser rescue
        run: node scripts/qa-sw-quality-002-visual-rescue.mjs

      - name: Preserve accepted UI-003 complete browser proof
        run: node scripts/qa-sw-ui-003-run-shell-identity.mjs

      - name: Preserve Storm Site browser QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-artifacts/sw-level-001
          python3 -m http.server 4173 --directory www > qa-artifacts/sw-level-001/int-004-server.log 2>&1 &
          SERVER_PID=$!
          cleanup() { kill "$SERVER_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          for attempt in $(seq 1 60); do
            if curl --silent --fail 'http://127.0.0.1:4173/' >/dev/null; then break; fi
            sleep 0.25
          done
          curl --silent --fail 'http://127.0.0.1:4173/' >/dev/null
          export SEVERE_WEATHER_QA_URL='http://127.0.0.1:4173/'
          pnpm run qa:sw-level-001

      - name: Prove accepted UI slices coexist
        run: node scripts/qa-sw-int-004-commercial-shell.mjs

      - name: Upload combined commercial-shell evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sw-int-004-commercial-shell
          path: artifacts/sw-int-004/
          if-no-files-found: warn
