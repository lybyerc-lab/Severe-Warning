name: Three.js Hero Slice 4 World Cohesion and Storm Volume

on:
  workflow_dispatch:
  pull_request:
    branches:
      - agent/threejs-visual-production-foundation

permissions:
  contents: read

concurrency:
  group: threejs-hero-slice4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-package:
    name: Build verify and package Hero Slice 4 candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out exact Hero Slice 4 candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact source identity
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$actual" = "$expected"
          echo "Verified Hero Slice 4 source: $actual"

      - name: Check out sealed Run 5 visual reference
        uses: actions/checkout@v6
        with:
          ref: 9515a3a5cc0ff04e1e4f95ff55b4a319aaa3602c
          path: run5-base
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Install frozen dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          npm install --global pnpm@11.9.0
          pnpm install --frozen-lockfile
          pnpm --dir run5-base install --frozen-lockfile

      - name: Verify Hero Slice 4 source and process truth
        shell: bash
        run: |
          set -euo pipefail
          pnpm run verify:process
          for file in \
            runtime/threejs-visual-hero-slice4.js \
            scripts/apply-threejs-hero-slice4.mjs \
            scripts/vendor-threejs-hero-slice4-assets.mjs \
            scripts/verify-threejs-hero-slice4.mjs \
            scripts/qa-threejs-hero-slice4.mjs; do
            node --check "$file"
          done
          node -e "JSON.parse(require('fs').readFileSync('assets/production/asset-provenance.json','utf8'))"
          node scripts/verify-threejs-hero-slice4.mjs
          pnpm run verify:visual-foundation
          pnpm run modern:typecheck

      - name: Verify historical gameplay source remains untouched
        shell: bash
        run: |
          set -euo pipefail
          cmp -s MechanicsLab/SevereWeather_3D_Lab.html run5-base/MechanicsLab/SevereWeather_3D_Lab.html
          if grep -F 'THREEJS_VISUAL_HERO_SLICE4_V1' MechanicsLab/SevereWeather_3D_Lab.html; then
            echo 'Generated Hero Slice 4 output was committed over the historical source baseline.' >&2
            exit 1
          fi

      - name: Vendor exact pinned Hero Slice 4 VFX candidates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/vendor-threejs-hero-slice4-assets.mjs
          test -s assets/production/vfx/kenney/dirt_01.png
          test -s assets/production/vfx/kenney/smoke_03.png
          test -s assets/production/vfx/kenney/trace_03.png
          test -s assets/production/vfx/kenney/checksums.json

      - name: Generate verified audio in Run 5 and candidate
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir run5-base run audio:generate
          pnpm run audio:generate

      - name: Build sealed Run 5 visual reference
        shell: bash
        working-directory: run5-base
        run: |
          set -euo pipefail
          pnpm run patch:v431
          pnpm run patch:v440
          pnpm run patch:v441
          pnpm run patch:v442
          pnpm run patch:v450
          pnpm run patch:v500
          pnpm run verify:v500
          pnpm run patch:v510
          pnpm run verify:v510
          pnpm run patch:phase2
          pnpm run verify:phase2
          pnpm run patch:phase3
          pnpm run verify:phase3
          pnpm run patch:phase4
          pnpm run verify:phase4
          pnpm run patch:phase5
          pnpm run verify:phase5
          pnpm run patch:phase6
          pnpm run verify:phase6
          pnpm run patch:city-fabric
          pnpm run verify:city-fabric
          pnpm run patch:presentation-identity
          pnpm run verify:presentation-identity
          pnpm run patch:asset-pipeline
          pnpm run verify:asset-pipeline
          pnpm run patch:visual-foundation
          pnpm run verify:visual-foundation
          pnpm run modern:build
          node scripts/build-web.mjs
          node scripts/stamp-qa-pages.mjs
          node scripts/verify-qa-package.mjs
          grep -F 'THREEJS_VISUAL_HERO_SLICE3_V1' www/index.html
          if grep -F 'THREEJS_VISUAL_HERO_SLICE4_V1' www/index.html; then
            echo 'Sealed Run 5 reference unexpectedly contains Hero Slice 4.' >&2
            exit 1
          fi

      - name: Build and verify Hero Slice 4 candidate
        shell: bash
        run: |
          set -euo pipefail
          pnpm run patch:v431
          pnpm run patch:v440
          pnpm run patch:v441
          pnpm run patch:v442
          pnpm run patch:v450
          pnpm run patch:v500
          pnpm run verify:v500
          pnpm run patch:v510
          pnpm run verify:v510
          pnpm run patch:phase2
          pnpm run verify:phase2
          pnpm run patch:phase3
          pnpm run verify:phase3
          pnpm run patch:phase4
          pnpm run verify:phase4
          pnpm run patch:phase5
          pnpm run verify:phase5
          pnpm run patch:phase6
          pnpm run verify:phase6
          pnpm run patch:city-fabric
          pnpm run verify:city-fabric
          pnpm run patch:presentation-identity
          pnpm run verify:presentation-identity
          pnpm run patch:asset-pipeline
          pnpm run verify:asset-pipeline
          pnpm run patch:visual-foundation
          pnpm run verify:visual-foundation
          node scripts/apply-threejs-hero-slice4.mjs
          node scripts/verify-threejs-hero-slice4.mjs
          pnpm run modern:build
          node scripts/build-web.mjs
          node scripts/stamp-qa-pages.mjs
          node scripts/verify-qa-package.mjs
          grep -F 'THREEJS_VISUAL_HERO_SLICE4_V1' www/index.html
          test -s www/assets/production/vfx/kenney/dirt_01.png
          test -s www/assets/production/vfx/kenney/smoke_03.png
          test -s www/assets/production/vfx/kenney/trace_03.png
          test -s www/assets/production/vfx/kenney/checksums.json
          node - <<'NODE'
          const fs = require('fs');
          const provenance = JSON.parse(fs.readFileSync('www/assets/production/asset-provenance.json', 'utf8'));
          const checksums = JSON.parse(fs.readFileSync('www/assets/production/vfx/kenney/checksums.json', 'utf8'));
          if (provenance.policy?.runtimeNetworkAssetsAllowed !== false) throw new Error('Runtime network asset policy regressed.');
          if ((provenance.productionImports || []).length !== 0) throw new Error('Candidate VFX were falsely marked production-approved before owner review.');
          if (checksums.version !== 'THREEJS_HERO_SLICE4_VFX_VENDOR_V1') throw new Error(`Unexpected VFX evidence ${checksums.version}`);
          if (checksums.runtimeNetworkRequired !== false) throw new Error('Vendored VFX evidence claims a runtime network dependency.');
          if ((checksums.files || []).length !== 3) throw new Error('Expected three pinned VFX candidate files.');
          NODE

      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium

      - name: Run inherited gameplay and Hero Slice 4 browser QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-artifacts/threejs-hero-slice4
          python3 -m http.server 4173 --directory www > qa-artifacts/threejs-hero-slice4/head-server.log 2>&1 &
          HEAD_SERVER_PID=$!
          cleanup() { kill "$HEAD_SERVER_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          for attempt in $(seq 1 60); do
            if curl --silent --fail 'http://127.0.0.1:4173/' > /dev/null; then break; fi
            sleep 0.25
          done
          curl --silent --fail 'http://127.0.0.1:4173/' > /dev/null
          export SEVERE_WEATHER_QA_URL='http://127.0.0.1:4173/'
          env SEVERE_WEATHER_QA_DIR='qa-artifacts/threejs-hero-slice4/v510' pnpm run qa:v510
          env SEVERE_WEATHER_QA_DIR='qa-artifacts/threejs-hero-slice4/clocks' pnpm run qa:phase2
          env SEVERE_WEATHER_QA_DIR='qa-artifacts/threejs-hero-slice4/input-abilities' pnpm run qa:phase3
          env SEVERE_WEATHER_QA_DIR='qa-artifacts/threejs-hero-slice4/scoring-campaign' pnpm run qa:phase4
          env SEVERE_WEATHER_QA_DIR='qa-artifacts/threejs-hero-slice4/presentation-world' pnpm run qa:phase5
          env SEVERE_WEATHER_QA_DIR='qa-artifacts/threejs-hero-slice4/phase6' pnpm run qa:phase6
          env SEVERE_WEATHER_QA_DIR='qa-artifacts/threejs-hero-slice4/city' pnpm run qa:city-fabric
          env SEVERE_WEATHER_QA_DIR='qa-artifacts/threejs-hero-slice4/identity' pnpm run qa:presentation-identity
          env SEVERE_WEATHER_QA_DIR='qa-artifacts/threejs-hero-slice4/asset' pnpm run qa:asset-pipeline
          env SEVERE_WEATHER_QA_DIR='qa-artifacts/threejs-hero-slice4/visual-run5' pnpm run qa:visual-foundation
          env SEVERE_WEATHER_QA_DIR='qa-artifacts/threejs-hero-slice4/visual-slice4' node scripts/qa-threejs-hero-slice4.mjs

      - name: Run same-runner Run 5 versus Hero Slice 4 performance evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4180 --directory run5-base/www > qa-artifacts/threejs-hero-slice4/perf-base-server.log 2>&1 &
          BASE_SERVER_PID=$!
          python3 -m http.server 4181 --directory www > qa-artifacts/threejs-hero-slice4/perf-candidate-server.log 2>&1 &
          CANDIDATE_SERVER_PID=$!
          cleanup() { kill "$BASE_SERVER_PID" "$CANDIDATE_SERVER_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          for port in 4180 4181; do
            for attempt in $(seq 1 60); do
              if curl --silent --fail "http://127.0.0.1:${port}/" > /dev/null; then break; fi
              sleep 0.25
            done
            curl --silent --fail "http://127.0.0.1:${port}/" > /dev/null
          done
          env \
            SEVERE_WEATHER_BASE_URL='http://127.0.0.1:4180/' \
            SEVERE_WEATHER_CANDIDATE_URL='http://127.0.0.1:4181/' \
            SEVERE_WEATHER_PERF_DIR='qa-artifacts/threejs-hero-slice4/performance' \
            pnpm run perf:phase6

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: severe-weather-threejs-hero-slice4-diagnostics-${{ github.run_number }}
          path: qa-artifacts/threejs-hero-slice4
          if-no-files-found: warn
          retention-days: 14

      - name: Synchronize Android assets
        shell: bash
        run: |
          set -euo pipefail
          node node_modules/@capacitor/cli/bin/capacitor sync android
          cmp -s www/index.html android/app/src/main/assets/public/index.html
          cmp -s www/assets/production/vfx/kenney/dirt_01.png android/app/src/main/assets/public/assets/production/vfx/kenney/dirt_01.png
          cmp -s www/assets/production/vfx/kenney/smoke_03.png android/app/src/main/assets/public/assets/production/vfx/kenney/smoke_03.png
          cmp -s www/assets/production/vfx/kenney/trace_03.png android/app/src/main/assets/public/assets/production/vfx/kenney/trace_03.png

      - name: Assemble debug APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Package exact-source Hero Slice 4 evidence
        id: package
        shell: bash
        run: |
          set -euo pipefail
          source_commit='${{ github.event.pull_request.head.sha || github.sha }}'
          output_dir='dist/threejs-hero-slice4'
          mkdir -p "$output_dir"
          source_apk='android/app/build/outputs/apk/debug/app-debug.apk'
          output_apk="$output_dir/Severe-Weather-v5.1.0-ThreeJS-Hero-Slice4-${GITHUB_RUN_NUMBER}.apk"
          test -s "$source_apk"
          cp "$source_apk" "$output_apk"
          sha256sum "$output_apk" | tee "$output_apk.sha256"
          test -s threejs-hero-slice4-static-report.json
          test -s qa-artifacts/threejs-hero-slice4/visual-slice4/threejs-hero-slice4-report.json
          test -s qa-artifacts/threejs-hero-slice4/visual-slice4/threejs-hero-slice4-pristine-street.png
          test -s qa-artifacts/threejs-hero-slice4/visual-slice4/threejs-hero-slice4-storm-volume.png
          test -s qa-artifacts/threejs-hero-slice4/visual-slice4/threejs-hero-slice4-damaged-storefront.png
          test -s qa-artifacts/threejs-hero-slice4/performance/comparison-report.json
          cp -R www "$output_dir/web-preview"
          cp -R qa-artifacts/threejs-hero-slice4 "$output_dir/qa-evidence"
          cp threejs-hero-slice4-static-report.json "$output_dir/"
          cp Docs/HERO_SLICE4_WORLD_COHESION_STORM_VOLUME.md "$output_dir/"
          cp assets/production/asset-provenance.json "$output_dir/"
          cp assets/production/vfx/kenney/checksums.json "$output_dir/hero-slice4-vfx-checksums.json"
          git diff --name-status 9515a3a5cc0ff04e1e4f95ff55b4a319aaa3602c...HEAD > "$output_dir/changed-module-ledger.txt"
          cat > "$output_dir/package-manifest.json" <<MANIFEST
          {
            "sourceBranch": "agent/threejs-hero-slice4-world-cohesion-storm-volume",
            "sourceCommit": "$source_commit",
            "sealedRun5Reference": "9515a3a5cc0ff04e1e4f95ff55b4a319aaa3602c",
            "sealedStage1Reference": "f2060dff08ddb9df9f90ecd245940d8db86c7266",
            "frozenGameplayReference": "1f4292c05b3ff5c407d77d1f3eaa6493e43b9d3f",
            "workflowRunId": "${GITHUB_RUN_ID}",
            "workflowRunNumber": ${GITHUB_RUN_NUMBER},
            "versionName": "5.1.0",
            "renderer": "Three.js r128",
            "prototype": "threejs-hero-slice4-world-cohesion-storm-volume",
            "visualBridge": "THREEJS_VISUAL_FOUNDATION_V1",
            "heroSlice4Bridge": "THREEJS_VISUAL_HERO_SLICE4_V1",
            "assetProvenance": "SW_ASSET_PROVENANCE_V1",
            "apkType": "debug",
            "apkFile": "$(basename "$output_apk")",
            "apkSha256": "$(sha256sum "$output_apk" | awk '{print $1}')"
          }
          MANIFEST
          echo "$source_commit" > "$output_dir/SOURCE_COMMIT.txt"
          echo "$GITHUB_RUN_ID" > "$output_dir/WORKFLOW_RUN_ID.txt"
          echo "artifact_name=severe-weather-threejs-hero-slice4-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Upload Hero Slice 4 APK and evidence
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: dist/threejs-hero-slice4
          if-no-files-found: error
          retention-days: 14
