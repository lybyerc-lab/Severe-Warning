name: SW-QA-007 Modern-Shell Causal A/B Classification

on:
  push:
    branches:
      - agent/sw-qa-007-actions-harness
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sw-qa-007-causal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  causal-matrix:
    name: Causal Inspection for ${{ matrix.source.label }} (${{ matrix.source.sha }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        source:
          - label: "A_ACCEPTED_PRE_LEVEL_BASE"
            sha: "89aeac92d032bfc6546cb8da7c52effc7a408aa1"
            is_level: false
          - label: "B_ORIGINAL_LEVEL_HEAD"
            sha: "07e089f03bdb2943e6b3d64033010736805afb4a"
            is_level: true
          - label: "C_CORRECTED_LEVEL_HEAD"
            sha: "1350cee7535220fb9fc5e7c1b4de284e6aae8156"
            is_level: true

    steps:
      - name: Check out target source SHA (${{ matrix.source.sha }})
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.source.sha }}
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install system ffmpeg
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -n 1

      - name: Install pnpm 11.9.0
        shell: bash
        run: |
          set -euo pipefail
          npm install -g pnpm@11.9.0
          pnpm --version

      - name: Print and record source metadata
        shell: bash
        run: |
          set -euo pipefail
          echo "=== EXECUTING CAUSAL TEST FOR [${{ matrix.source.label }}] ==="
          echo "EXPECTED SHA: ${{ matrix.source.sha }}"
          echo "ACTUAL HEAD SHA: $(git rev-parse HEAD)"
          echo "STATUS:"
          git status --short
          test "$(git rev-parse HEAD)" = "${{ matrix.source.sha }}"

      - name: Install frozen dependencies
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile

      - name: Prepare approved Kenney VFX inputs & Audio
        shell: bash
        run: |
          set -euo pipefail
          node scripts/vendor-threejs-hero-slice4-assets.mjs
          pnpm run audio:generate
          test -f assets/production/vfx/kenney/dirt_01.png
          test -f assets/production/vfx/kenney/smoke_03.png
          test -f assets/production/vfx/kenney/trace_03.png

      - name: Construct task-versioned playable source using patch chain
        shell: bash
        run: |
          set -euo pipefail
          echo "=== APPLYING IN-PLACE PATCH CHAIN FOR ${{ matrix.source.label }} ==="
          for script in \
            apply-v431-source-patch.mjs \
            apply-v440-source-patch.mjs \
            apply-v441-source-patch.mjs \
            apply-v442-source-patch.mjs \
            fix-v450-parser.mjs \
            apply-v450-source-patch.mjs \
            apply-v450-rampage-music-patch.mjs \
            apply-qa-corrections-patch.mjs \
            apply-audio-mix-followup-patch.mjs \
            apply-ui-polish-followup-patch.mjs \
            apply-score-continuity-fix.mjs \
            apply-qa4-deterministic-lab-patch.mjs \
            apply-qa4-mobile-input-fix.mjs \
            apply-qa4-run-lock-fix.mjs \
            apply-qa4-pause-forensics.mjs \
            apply-pause-overlay-hit-test-fix.mjs \
            apply-pause-overlay-hard-hide.mjs \
            apply-qa4-popup-assertion-fix.mjs \
            apply-v500-campaign-patch.mjs \
            apply-v500-realtime-clock-fix.mjs \
            apply-v500-world-tour-patch.mjs \
            apply-v500-mobile-layout-fix.mjs \
            apply-v500-cow-signature-patch.mjs \
            apply-v510-production-slice.mjs \
            apply-modernization-phase2-clocks.mjs \
            apply-phase2-player-forensics-guard.mjs \
            apply-modernization-phase3-input-abilities.mjs \
            apply-modernization-phase4-scoring-campaign.mjs \
            apply-modernization-phase5-presentation-world.mjs \
            apply-modernization-phase6-performance.mjs \
            apply-city-fabric-destruction.mjs \
            apply-presentation-identity-moo-brew.mjs \
            apply-threejs-asset-pipeline.mjs \
            apply-threejs-visual-foundation.mjs
          do
            if [ -f "scripts/$script" ]; then
              node "scripts/$script"
            fi
          done

          if [ -f scripts/apply-sw-level-001-storm-site-framework.mjs ]; then
            node scripts/apply-sw-level-001-storm-site-framework.mjs
          fi

          mkdir -p qa-artifacts/causal
          sha256sum MechanicsLab/SevereWeather_3D_Lab.html | tee qa-artifacts/causal/constructed-source-sha256.txt

      - name: Build modern shell & offline web package
        shell: bash
        run: |
          set -euo pipefail
          pnpm run modern:build
          node scripts/build-web.mjs
          test -f www/index.html

      - name: Install Playwright browser dependencies
        shell: bash
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium

      - name: Checkout harness inspection script
        shell: bash
        run: |
          set -euo pipefail
          git checkout origin/agent/sw-qa-007-actions-harness -- scripts/test-modern-shell-causal.mjs || true

      - name: Execute browser harness causal inspection
        shell: bash
        run: |
          set -euo pipefail
          node scripts/serve-www.mjs &
          sleep 3
          SOURCE_LABEL="${{ matrix.source.label }}" SOURCE_SHA="${{ matrix.source.sha }}" node scripts/test-modern-shell-causal.mjs | tee "causal-report-${{ matrix.source.label }}.json"

      - name: Run focused LEVEL verifier if applicable
        if: matrix.source.is_level
        shell: bash
        run: |
          set -euo pipefail
          pnpm run verify:sw-level-001

      - name: Upload causal inspection artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: causal-artifact-${{ matrix.source.label }}
          path: |
            causal-report-*.json
            qa-artifacts/**
            reports/**
