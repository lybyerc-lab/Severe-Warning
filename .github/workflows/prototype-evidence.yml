name: Prototype Evidence (Not Production QA)

on:
  push:
    branches:
      - agent/sw-qa-002-rapid-prototype-lane
    paths:
      - .github/workflows/prototype-evidence.yml
      - Docs/PROTOTYPE_EVIDENCE_LANE.md
      - scripts/build-prototype-evidence-candidate.mjs
      - scripts/qa-prototype-evidence.mjs
      - scripts/test-prototype-evidence-lane.mjs
      - scripts/verify-prototype-web.mjs
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact source SHA or branch/ref to inspect; blank uses the manually selected workflow ref
        required: false
        type: string
        default: ''
      prototype_task_id:
        description: Bounded prototype task ID used in the evidence report and artifact name
        required: true
        type: string
      screenshot_profile:
        description: Deterministic mobile screenshot profile (mobile-landscape, mobile-portrait, or mobile-default)
        required: false
        type: string
        default: mobile-default

permissions:
  contents: read

concurrency:
  group: prototype-evidence-${{ inputs.prototype_task_id || 'SW-QA-002-preintegration' }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prototype-evidence:
    name: Prototype-only build, smoke, and screenshots
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Start prototype wall-clock measurement
        id: timing
        shell: bash
        run: echo "started_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Check out requested prototype source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          # The bounded build runs the existing Phase 5 historical-source verifier.
          # It needs the accepted commit object, but does not create a reference build.
          fetch-depth: 0

      - name: Verify exact source identity
        id: source
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          source_ref='${{ inputs.source_ref || github.ref }}'
          echo "source_commit=$source_commit" >> "$GITHUB_OUTPUT"
          echo "source_ref=$source_ref" >> "$GITHUB_OUTPUT"
          echo "PROTOTYPE ONLY - NOT PRODUCTION QA"
          echo "Verified prototype source: $source_commit ($source_ref)"

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install frozen dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          npm install --global pnpm@11.9.0
          pnpm install --frozen-lockfile

      - name: Run minimum implementation-truth and static checks
        shell: bash
        run: |
          set -euo pipefail
          pnpm run verify:process
          pnpm run modern:typecheck
          node --check scripts/qa-prototype-evidence.mjs
          node scripts/test-prototype-evidence-lane.mjs

      - name: Build exact Three.js prototype candidate once
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-prototype-evidence-candidate.mjs
          node scripts/verify-prototype-web.mjs
          test -s www/index.html
          test -s www/build-info.json
          grep -F 'Three.js r128' www/build-info.json

      - name: Install Chromium for prototype smoke
        shell: bash
        run: npx playwright install --with-deps chromium

      - name: Run bounded mobile boot, control, render, and screenshot smoke
        shell: bash
        env:
          SEVERE_WEATHER_PROTOTYPE_DIR: prototype-evidence
          SEVERE_WEATHER_PROTOTYPE_TASK_ID: ${{ inputs.prototype_task_id || 'SW-QA-002-preintegration' }}
          SEVERE_WEATHER_PROTOTYPE_PROFILE: ${{ inputs.screenshot_profile || 'mobile-default' }}
          SEVERE_WEATHER_PROTOTYPE_SOURCE_COMMIT: ${{ steps.source.outputs.source_commit }}
          SEVERE_WEATHER_PROTOTYPE_SOURCE_REF: ${{ steps.source.outputs.source_ref }}
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory www > prototype-evidence/server.log 2>&1 &
          SERVER_PID=$!
          cleanup() { kill "$SERVER_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          for attempt in $(seq 1 60); do
            curl --silent --fail http://127.0.0.1:4173/ > /dev/null && break
            sleep 0.25
          done
          curl --silent --fail http://127.0.0.1:4173/ > /dev/null
          SEVERE_WEATHER_QA_URL='http://127.0.0.1:4173/' node scripts/qa-prototype-evidence.mjs

      - name: Package prototype-only evidence
        shell: bash
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.source_commit }}
          SOURCE_REF: ${{ steps.source.outputs.source_ref }}
          PROTOTYPE_TASK_ID: ${{ inputs.prototype_task_id || 'SW-QA-002-preintegration' }}
          SCREENSHOT_PROFILE: ${{ inputs.screenshot_profile || 'mobile-default' }}
          STARTED_EPOCH: ${{ steps.timing.outputs.started_epoch }}
        run: |
          set -euo pipefail
          output_dir='dist/prototype-evidence'
          mkdir -p "$output_dir"
          cp -R www "$output_dir/web-preview"
          cp -R prototype-evidence "$output_dir/evidence"
          printf '%s\n' "$SOURCE_COMMIT" > "$output_dir/SOURCE_COMMIT.txt"
          node - <<'NODE'
          const fs = require('node:fs');
          const manifest = {
            version: 'SEVERE_WEATHER_PROTOTYPE_EVIDENCE_V1',
            authority: 'PROTOTYPE ONLY - NOT PRODUCTION QA',
            sourceCommit: process.env.SOURCE_COMMIT,
            sourceRef: process.env.SOURCE_REF,
            prototypeTaskId: process.env.PROTOTYPE_TASK_ID,
            screenshotProfile: process.env.SCREENSHOT_PROFILE,
            productionAuthority: false,
            qaPagesDispatched: false,
            androidPackaged: false,
            elapsedSeconds: Math.max(0, Math.floor(Date.now() / 1000) - Number(process.env.STARTED_EPOCH || 0)),
          };
          fs.writeFileSync('dist/prototype-evidence/prototype-manifest.json', `${JSON.stringify(manifest, null, 2)}\n`);
          NODE
          test -s "$output_dir/web-preview/index.html"
          test -s "$output_dir/evidence/prototype-evidence-report.json"
          test -s "$output_dir/evidence/mobile-screenshot.png"
          grep -F 'PROTOTYPE ONLY - NOT PRODUCTION QA' "$output_dir/prototype-manifest.json"

      - name: Upload prototype-only web preview and evidence
        uses: actions/upload-artifact@v7
        with:
          name: severe-weather-prototype-${{ inputs.prototype_task_id || 'SW-QA-002-preintegration' }}-${{ github.run_number }}
          path: dist/prototype-evidence
          if-no-files-found: error
          retention-days: 14
