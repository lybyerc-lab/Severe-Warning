name: Modernization Phase 6 Android Performance Proof

on:
  workflow_dispatch:
  pull_request:
    branches:
      - agent/phase4-knowledge-antigravity-handoff

permissions:
  contents: read

concurrency:
  group: modernization-phase-6-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-package:
    name: Build verify and package integrated performance proof
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out Phase 6 head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check out accepted Phase 5 base
        uses: actions/checkout@v6
        with:
          ref: 182f916807f3195dfe0546775a1fff7dc8c64aaa
          path: phase6-base
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Install frozen dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          npm install --global pnpm@11.9.0
          pnpm install --frozen-lockfile
          pnpm --dir phase6-base install --frozen-lockfile

      - name: Verify process truth, script syntax, and TypeScript
        shell: bash
        run: |
          set -euo pipefail
          pnpm run verify:process
          for file in \
            scripts/apply-modernization-phase6-performance.mjs \
            scripts/verify-modernization-phase6-performance.mjs \
            scripts/verify-implementation-truth.mjs \
            scripts/qa-modernization-phase6-performance.mjs \
            scripts/measure-phase6-performance.mjs \
            runtime/modernization-phase6-performance.js; do
            node --check "$file"
          done
          pnpm run modern:typecheck

      - name: Verify clean historical source
        shell: bash
        run: |
          set -euo pipefail
          cmp -s \
            MechanicsLab/SevereWeather_3D_Lab.html \
            phase6-base/MechanicsLab/SevereWeather_3D_Lab.html
          grep -F '<title>Severe Weather 3D Lab v4.3.0 - Rampage Layer</title>' MechanicsLab/SevereWeather_3D_Lab.html
          if grep -F 'MODERNIZATION_PHASE6_PERFORMANCE' MechanicsLab/SevereWeather_3D_Lab.html; then
            echo 'Generated Phase 6 output was committed over the historical source baseline.' >&2
            exit 1
          fi

      - name: Generate verified audio in base and candidate
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir phase6-base run audio:generate
          pnpm run audio:generate

      - name: Build accepted Phase 5 base
        shell: bash
        working-directory: phase6-base
        run: |
          set -euo pipefail
          pnpm run patch:v431
          pnpm run patch:v440
          pnpm run patch:v441
          pnpm run patch:v442
          pnpm run patch:v450
          pnpm run patch:v500
          pnpm run verify:v500
          pnpm run patch:v510
          pnpm run verify:v510
          pnpm run patch:phase2
          pnpm run verify:phase2
          pnpm run patch:phase3
          pnpm run verify:phase3
          pnpm run patch:phase4
          pnpm run verify:phase4
          pnpm run patch:phase5
          pnpm run verify:phase5
          pnpm run modern:build
          node scripts/build-web.mjs
          node scripts/stamp-qa-pages.mjs
          node scripts/verify-qa-package.mjs

      - name: Build and verify integrated Phase 6 candidate
        shell: bash
        run: |
          set -euo pipefail
          pnpm run patch:v431
          pnpm run patch:v440
          pnpm run patch:v441
          pnpm run patch:v442
          pnpm run patch:v450
          pnpm run patch:v500
          pnpm run verify:v500
          pnpm run patch:v510
          pnpm run verify:v510
          pnpm run patch:phase2
          pnpm run verify:phase2
          pnpm run patch:phase3
          pnpm run verify:phase3
          pnpm run patch:phase4
          pnpm run verify:phase4
          pnpm run patch:phase5
          pnpm run verify:phase5
          pnpm run patch:phase6
          pnpm run verify:phase6
          pnpm run modern:build
          node scripts/build-web.mjs
          node scripts/stamp-qa-pages.mjs
          node scripts/verify-qa-package.mjs
          grep -F 'MODERNIZATION_PHASE6_PERFORMANCE_V2' www/index.html

      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium

      - name: Run blocking inherited and integrated Phase 6 QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-artifacts/modernization-phase-6
          python3 -m http.server 4173 --directory www > qa-artifacts/modernization-phase-6/head-server.log 2>&1 &
          HEAD_SERVER_PID=$!
          cleanup() {
            kill "$HEAD_SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 60); do
            if curl --silent --fail 'http://127.0.0.1:4173/' > /dev/null; then break; fi
            sleep 0.25
          done
          curl --silent --fail 'http://127.0.0.1:4173/' > /dev/null

          export SEVERE_WEATHER_QA_URL='http://127.0.0.1:4173/'
          env SEVERE_WEATHER_QA_DIR='qa-artifacts/modernization-phase-6/v510' pnpm run qa:v510
          env SEVERE_WEATHER_QA_DIR='qa-artifacts/modernization-phase-6/clocks' pnpm run qa:phase2
          env SEVERE_WEATHER_QA_DIR='qa-artifacts/modernization-phase-6/input-abilities' pnpm run qa:phase3
          env SEVERE_WEATHER_QA_DIR='qa-artifacts/modernization-phase-6/scoring-campaign' pnpm run qa:phase4
          env SEVERE_WEATHER_QA_DIR='qa-artifacts/modernization-phase-6/presentation-world' pnpm run qa:phase5
          env SEVERE_WEATHER_QA_DIR='qa-artifacts/modernization-phase-6/phase6' pnpm run qa:phase6

      - name: Run advisory Phase 5 visual comparison
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory www > qa-artifacts/modernization-phase-6/visual-head-server.log 2>&1 &
          HEAD_SERVER_PID=$!
          python3 -m http.server 4174 --directory phase6-base/www > qa-artifacts/modernization-phase-6/visual-base-server.log 2>&1 &
          BASE_SERVER_PID=$!
          cleanup() {
            kill "$HEAD_SERVER_PID" 2>/dev/null || true
            kill "$BASE_SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          for port in 4173 4174; do
            for attempt in $(seq 1 60); do
              if curl --silent --fail "http://127.0.0.1:${port}/" > /dev/null; then break; fi
              sleep 0.25
            done
            curl --silent --fail "http://127.0.0.1:${port}/" > /dev/null
          done
          env \
            SEVERE_WEATHER_QA_URL='http://127.0.0.1:4173/' \
            SEVERE_WEATHER_BASE_URL='http://127.0.0.1:4174/' \
            SEVERE_WEATHER_VISUAL_DIR='qa-artifacts/modernization-phase-6/visual-baseline' \
            pnpm run qa:phase5:visual

      - name: Run same-runner Phase 5 versus Phase 6 performance evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4180 --directory phase6-base/www > qa-artifacts/modernization-phase-6/perf-base-server.log 2>&1 &
          BASE_SERVER_PID=$!
          python3 -m http.server 4181 --directory www > qa-artifacts/modernization-phase-6/perf-candidate-server.log 2>&1 &
          CANDIDATE_SERVER_PID=$!
          cleanup() {
            kill "$BASE_SERVER_PID" 2>/dev/null || true
            kill "$CANDIDATE_SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          for port in 4180 4181; do
            for attempt in $(seq 1 60); do
              if curl --silent --fail "http://127.0.0.1:${port}/" > /dev/null; then break; fi
              sleep 0.25
            done
            curl --silent --fail "http://127.0.0.1:${port}/" > /dev/null
          done
          env \
            SEVERE_WEATHER_BASE_URL='http://127.0.0.1:4180/' \
            SEVERE_WEATHER_CANDIDATE_URL='http://127.0.0.1:4181/' \
            SEVERE_WEATHER_PERF_DIR='qa-artifacts/modernization-phase-6/performance' \
            pnpm run perf:phase6

      - name: Upload Phase 6 diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: severe-weather-modernization-phase-6-diagnostics-${{ github.run_number }}
          path: qa-artifacts/modernization-phase-6
          if-no-files-found: warn
          retention-days: 14

      - name: Synchronize Android assets
        shell: bash
        run: |
          set -euo pipefail
          node node_modules/@capacitor/cli/bin/capacitor sync android
          cmp -s www/index.html android/app/src/main/assets/public/index.html
          cmp -s www/modern/modern-shell.js android/app/src/main/assets/public/modern/modern-shell.js

      - name: Assemble debug APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Package complete Phase 6 evidence
        id: package
        shell: bash
        run: |
          set -euo pipefail
          source_commit='${{ github.event.pull_request.head.sha || github.sha }}'
          output_dir='dist/modernization-phase-6'
          mkdir -p "$output_dir"

          source_apk='android/app/build/outputs/apk/debug/app-debug.apk'
          output_apk="$output_dir/Severe-Weather-v5.1.0-Phase-6-Android-Performance-${GITHUB_RUN_NUMBER}.apk"
          test -s "$source_apk"
          cp "$source_apk" "$output_apk"
          sha256sum "$output_apk" | tee "$output_apk.sha256"

          test -s qa-artifacts/modernization-phase-6/performance/baseline-report.json
          test -s qa-artifacts/modernization-phase-6/performance/candidate-report.json
          test -s qa-artifacts/modernization-phase-6/performance/comparison-report.json
          test -s qa-artifacts/modernization-phase-6/performance/phase6-performance-report.md
          test -s qa-artifacts/modernization-phase-6/phase6/phase6-qa-report.json
          test "$(find qa-artifacts/modernization-phase-6 -name '*.png' -type f | wc -l)" -ge 4

          cp -R www "$output_dir/web-preview"
          cp -R qa-artifacts/modernization-phase-6 "$output_dir/qa-evidence"
          cp Docs/PHASE6_PERFORMANCE_SOURCE_MAP.md "$output_dir/"
          cp Docs/IMPLEMENTATION_TRUTH_GATE.md "$output_dir/"
          git diff --name-status 182f916807f3195dfe0546775a1fff7dc8c64aaa...HEAD > "$output_dir/changed-module-ledger.txt"
          node - "$output_dir/changed-module-ledger.txt" "$output_dir/changed-module-ledger.json" <<'NODE'
          const fs = require('fs');
          const [input, output] = process.argv.slice(2);
          const rows = fs.readFileSync(input, 'utf8').trim().split(/\r?\n/).filter(Boolean).map((line) => {
            const [status, ...pathParts] = line.split('\t');
            return { status, path: pathParts.join('\t') };
          });
          fs.writeFileSync(output, JSON.stringify({ files: rows }, null, 2));
          NODE

          cat > "$output_dir/package-manifest.json" <<MANIFEST
          {
            "sourceBranch": "agent/phase6-android-performance-antigravity",
            "sourceCommit": "$source_commit",
            "acceptedBaseCommit": "182f916807f3195dfe0546775a1fff7dc8c64aaa",
            "workflowRunId": "${GITHUB_RUN_ID}",
            "workflowRunNumber": ${GITHUB_RUN_NUMBER},
            "versionName": "5.1.0",
            "renderer": "Three.js r128",
            "modernizationPhase": "phase-6-android-performance",
            "phase6Bridge": "MODERNIZATION_PHASE6_PERFORMANCE_V2",
            "apkType": "debug",
            "apkFile": "$(basename "$output_apk")",
            "apkSha256": "$(sha256sum "$output_apk" | awk '{print $1}')",
            "evidence": [
              "baseline-report.json",
              "candidate-report.json",
              "comparison-report.json",
              "phase6-performance-report.md",
              "phase6-qa-report.json",
              "screenshots",
              "browser logs",
              "changed-module-ledger.json"
            ]
          }
          MANIFEST
          echo "$source_commit" > "$output_dir/SOURCE_COMMIT.txt"
          echo "$GITHUB_RUN_ID" > "$output_dir/WORKFLOW_RUN_ID.txt"
          echo "artifact_name=severe-weather-modernization-phase-6-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Upload Phase 6 APK and complete evidence
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: dist/modernization-phase-6
          if-no-files-found: error
          retention-days: 14
