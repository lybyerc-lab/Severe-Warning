name: Deploy QA Pages

on:
  workflow_dispatch:
  push:
    branches:
      - qa
    paths:
      - '.github/workflows/deploy-qa-pages.yml'
      - 'MechanicsLab/SevereWeather_3D_Lab.html'
      - 'assets/audio/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'scripts/**'

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out QA branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install pinned JavaScript dependencies
        shell: bash
        run: |
          npm install --global pnpm@11.9.0
          pnpm install --frozen-lockfile

      - name: Verify QA patch and harness syntax
        shell: bash
        run: |
          node --check scripts/apply-qa-corrections-patch.mjs
          node --check scripts/apply-audio-mix-followup-patch.mjs
          node --check scripts/apply-ui-polish-followup-patch.mjs
          node --check scripts/apply-score-continuity-fix.mjs
          node --check scripts/apply-qa4-deterministic-lab-patch.mjs
          node --check scripts/apply-qa4-mobile-input-fix.mjs
          node --check scripts/apply-qa4-run-lock-fix.mjs
          node --check scripts/apply-qa4-pause-forensics.mjs
          node --check scripts/apply-pause-overlay-hit-test-fix.mjs
          node --check scripts/apply-pause-overlay-hard-hide.mjs
          node --check scripts/apply-qa4-popup-assertion-fix.mjs
          node --check scripts/apply-qa4-rampage-popup-fix.mjs
          node --check scripts/apply-v500-campaign-patch.mjs
          node --check scripts/apply-v500-cow-signature-patch.mjs
          node --check scripts/verify-v500-campaign.mjs
          node --check scripts/verify-qa-package.mjs
          node --check scripts/run-qa4-headless.mjs

      - name: Install FFmpeg for audio generation
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          ffmpeg -hide_banner -version | head -n 1

      - name: Generate verified audio
        run: pnpm run audio:generate

      - name: Build and verify Phase 5 web package
        shell: bash
        run: |
          set -euo pipefail
          pnpm run patch:v431
          pnpm run patch:v440
          pnpm run patch:v441
          pnpm run patch:v442
          pnpm run patch:v450
          pnpm run patch:v500
          pnpm run verify:v500
          pnpm run patch:v510
          pnpm run verify:v510
          pnpm run patch:phase2
          pnpm run verify:phase2
          pnpm run patch:phase3
          pnpm run verify:phase3
          pnpm run patch:phase4
          pnpm run verify:phase4
          pnpm run patch:phase5
          pnpm run verify:phase5
          pnpm run modern:typecheck
          pnpm run modern:build
          node scripts/build-web.mjs
          node scripts/stamp-qa-pages.mjs
          node scripts/verify-qa-package.mjs
          grep -F 'MODERNIZATION_PHASE5_PRESENTATION_WORLD_V2' www/index.html
          grep -F 'phase-5-rendering-world' www/modern/modern-shell.js

      - name: Run deterministic QA4 in headless Chrome
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-artifacts
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          echo "Using Chrome: $CHROME_BIN"

          python3 -m http.server 4173 --directory www > qa-artifacts/server.log 2>&1 &
          SERVER_PID=$!
          "$CHROME_BIN" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --autoplay-policy=no-user-gesture-required \
            --remote-debugging-port=9222 \
            --remote-allow-origins='*' \
            --user-data-dir=/tmp/severe-weather-qa4-chrome \
            'http://127.0.0.1:4173/?qa4=run' \
            > qa-artifacts/chrome.log 2>&1 &
          CHROME_PID=$!

          cleanup() {
            kill "$CHROME_PID" "$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            sleep 0.25
          done

          curl --silent --fail http://127.0.0.1:4173/ > /dev/null
          node scripts/run-qa4-headless.mjs

      - name: Upload QA4 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa4-diagnostics-${{ github.run_number }}
          path: qa-artifacts
          if-no-files-found: warn
          retention-days: 7

      - name: Download verified PlayCanvas rotation-stable storm-physics artifact
        uses: actions/download-artifact@v4
        with:
          name: severe-weather-playcanvas-slice-62
          path: playcanvas-preview-artifact
          repository: lybyerc-lab/Severe-Warning
          run-id: 31222412094
          github-token: ${{ github.token }}

      - name: Verify and overlay rotation-stable PlayCanvas storm-physics candidate
        shell: bash
        env:
          PLAYCANVAS_SOURCE_SHA: f5f01678595bf857840759604f362c93f62598e8
          PLAYCANVAS_RUN_ID: '31222412094'
          PLAYCANVAS_RUN_NUMBER: '62'
          PLAYCANVAS_ARTIFACT: severe-weather-playcanvas-slice-62
          PLAYCANVAS_ARTIFACT_DIGEST: sha256:4e59ba01045869b4a752d2dc8071aac361b4513a214e5d6d664296ddac0b37e0
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < playcanvas-preview-artifact/SOURCE_SHA.txt)" = "$PLAYCANVAS_SOURCE_SHA"
          test -s playcanvas-preview-artifact/preview/index.html
          test -s playcanvas-preview-artifact/preview/vendor/playcanvas-2.21.3.min.mjs
          test -s playcanvas-preview-artifact/playcanvas-slice-static-report.json
          test -s playcanvas-preview-artifact/playcanvas-slice-evidence/playcanvas-slice-report.json
          test -s playcanvas-preview-artifact/playcanvas-slice-evidence/playcanvas-rotation-stability-report.json
          test -s playcanvas-preview-artifact/playcanvas-slice-evidence/playcanvas-slice.png
          test -s playcanvas-preview-artifact/playcanvas-slice-evidence/playcanvas-slice-turn.png
          test -s playcanvas-preview-artifact/playcanvas-slice-evidence/playcanvas-slice-travel.png
          test -s playcanvas-preview-artifact/playcanvas-slice-evidence/playcanvas-slice-junction.png
          test -s playcanvas-preview-artifact/playcanvas-slice-evidence/playcanvas-slice-pull.png
          test -s playcanvas-preview-artifact/playcanvas-slice-evidence/playcanvas-slice-gust.png
          test -s playcanvas-preview-artifact/playcanvas-slice-evidence/playcanvas-slice-debris.png
          test -s playcanvas-preview-artifact/playcanvas-slice-evidence/playcanvas-slice-camera-stability.png
          test -s playcanvas-preview-artifact/playcanvas-slice-evidence/playcanvas-slice-cow-stability.png
          node - <<'NODE'
          const fs = require('fs');
          const staticReport = JSON.parse(fs.readFileSync('playcanvas-preview-artifact/playcanvas-slice-static-report.json', 'utf8'));
          const browserReport = JSON.parse(fs.readFileSync('playcanvas-preview-artifact/playcanvas-slice-evidence/playcanvas-slice-report.json', 'utf8'));
          const rotationReport = JSON.parse(fs.readFileSync('playcanvas-preview-artifact/playcanvas-slice-evidence/playcanvas-rotation-stability-report.json', 'utf8'));
          if (!staticReport.passed || staticReport.failedChecks?.length) throw new Error('PlayCanvas static report is not sealed green.');
          if (!browserReport.passed || browserReport.failedChecks?.length) throw new Error('PlayCanvas browser report is not sealed green.');
          if (!rotationReport.passed || rotationReport.failedChecks?.length) throw new Error('PlayCanvas rotation-stability report is not sealed green.');
          if (rotationReport.version !== 'PLAYCANVAS_ROTATION_STABILITY_V2') throw new Error(`Unexpected rotation report version: ${rotationReport.version}`);

          const staticChecks = new Map(staticReport.checks.map((check) => [check.name, check.passed]));
          for (const name of [
            'camera-relative-input-contract',
            'keyboard-camera-relative',
            'touch-camera-relative',
            'one-stick-chase-camera-contract',
            'chase-camera-turn-rate-bounded',
            'chase-camera-map-baseline-plus-owner-trailing-polish',
            'chase-camera-intent-wiring',
            'tornado-funnel-upright',
            'expanded-terrain-footprint',
            'connected-road-junctions-contract',
            'distinct-landmark-blocks-contract',
            'render-consumed-authority-telemetry-contract',
            'browser-visible-authority-scale-parity',
            'browser-camera-turn-frame-step-regression',
            'browser-visible-control-check',
            'browser-chase-camera-check',
            'storm-force-field-anchor',
            'storm-force-field-game-owned-components',
            'storm-force-accepted-pull-timing',
            'storm-force-accepted-gust-timing',
            'storm-force-real-executor-integration',
            'storm-force-normal-render-integration',
            'storm-force-telemetry-contract',
            'storm-reactive-scene-bodies',
            'storm-reactive-safe-animal-exclusion',
            'browser-visible-storm-physics-check',
            'browser-debris-and-reset-check',
            'browser-no-force-helper-bypass',
          ]) {
            if (staticChecks.get(name) !== true) throw new Error(`Required storm-physics static gate missing or red: ${name}`);
          }

          const browserChecks = new Map(browserReport.checks.map((check) => [check.name, check.passed]));
          for (const name of [
            'gameplay-authority-connected',
            'physics-body-registry-bounded',
            'physics-safe-animal-excluded',
            'joystick-up-moves-screen-forward',
            'keyboard-right-moves-screen-right',
            'camera-stays-stable-on-forward-input',
            'camera-turns-gradually-behind-keyboard-motion',
            'camera-distance-stable-joystick',
            'camera-distance-stable-keyboard',
            'visible-storm-speed-parity',
            'pull-visible-control-accepted',
            'pull-trees-react-inward',
            'pull-light-props-move-inward',
            'pull-light-props-orbit',
            'gust-visible-control-accepted',
            'gust-trees-react-outward',
            'gust-light-props-move-outward',
            'expanded-terrain-footprint',
            'road-junctions-count',
            'authority-setup-moves-real-storm',
            'authority-setup-approaches-live-target',
            'gust-executor-accepted',
            'pull-executor-accepted',
            'zap-executor-accepted',
            'destruction-state-changed',
            'authoritative-damage-activates-debris',
            'storm-field-moves-detached-debris',
            'cow17-safe',
            'physics-reset-clears-active-bodies',
            'physics-reset-count-advances',
            'dispose-physics-telemetry-cleared',
            'road-above-terrain',
            'tornado-above-road',
            'no-console-errors',
            'no-page-errors',
          ]) {
            if (browserChecks.get(name) !== true) throw new Error(`Required storm-physics browser gate missing or red: ${name}`);
          }

          const rotationChecks = new Map(rotationReport.checks.map((check) => [check.name, check.passed]));
          for (const name of [
            'held-camera-target-stable',
            'held-camera-turn-bounded',
            'held-camera-settles-not-spins',
            'released-camera-does-not-wander',
            'cow17-safe-flight-starts',
            'cow17-orbit-lock-engages',
            'cow17-orbit-is-bounded',
            'cow17-flight-wall-clock-bounded',
            'cow17-does-not-immediately-relaunch',
            'rotation-stability-no-console-errors',
            'rotation-stability-no-page-errors',
          ]) {
            if (rotationChecks.get(name) !== true) throw new Error(`Required rotation-stability gate missing or red: ${name}`);
          }

          const visibleInput = browserReport.evidence?.visibleInput ?? {};
          const physics = browserReport.evidence?.physics ?? {};
          const afterAbilities = browserReport.evidence?.afterAbilities ?? {};
          const camera = rotationReport.evidence?.camera ?? {};
          const cow17 = rotationReport.evidence?.cow17 ?? {};
          const scale = Number(visibleInput.joystickVisibleAuthorityScale);
          const maxStep = Number(visibleInput.keyboardHeadingStepMetrics?.maxStep);
          const turningSteps = Number(visibleInput.keyboardHeadingStepMetrics?.turningStepCount);
          const samples = visibleInput.keyboardHeadingSamples ?? [];
          const pull = physics.afterPullPhysics ?? {};
          const gust = physics.afterGustPhysics ?? {};
          const resetPhysics = physics.afterResetPhysics ?? {};
          const debris = afterAbilities.physics ?? {};
          const settleMs = Number(camera.settleElapsedMs);
          const releaseHeadingDrift = Number(camera.releaseHeadingDrift);
          const releaseDesiredDrift = Number(camera.releaseDesiredDrift);
          const heldDesiredDrift = Number(camera.heldDesiredDrift);
          const cowLandingMs = Number(cow17.landingElapsedMs);

          if (!Number.isFinite(scale) || Math.abs(scale - 0.7717) > 0.03) throw new Error(`Visible/authority scale parity out of bounds: ${scale}`);
          if (!Number.isFinite(maxStep) || maxStep > 0.13) throw new Error(`Camera heading step exceeds no-snap gate: ${maxStep}`);
          if (turningSteps < 3 || samples.length < 12) throw new Error(`Insufficient camera turn-frame evidence: steps=${turningSteps}, samples=${samples.length}`);
          if (Number(pull.treePullReactionCount) < 1 || Number(pull.lightPullReactionCount) < 1) throw new Error('Pull reaction telemetry is missing.');
          if (Number(pull.maxPullInwardDelta) <= 0.4 || Number(pull.maxPullTangentialDelta) <= 0.15) throw new Error('Pull inward/orbit telemetry is below the sealed browser gate.');
          if (Number(gust.treeGustReactionCount) < 1 || Number(gust.lightGustReactionCount) < 1 || Number(gust.maxGustOutwardDelta) <= 0.4) throw new Error('Gust reaction telemetry is below the sealed browser gate.');
          if (Number(debris.airborneBodyCount) < 1 || debris.roofAirborne !== true || Number(debris.maxDebrisDisplacement) <= 0.1) throw new Error('Authoritative debris physics evidence is missing.');
          if (Number(resetPhysics.activeBodyCount) !== 0 || Number(resetPhysics.airborneBodyCount) !== 0 || resetPhysics.roofAirborne !== false) throw new Error('Physics reset did not restore a clean authored state.');
          if (!Number.isFinite(settleMs) || settleMs >= 9000 || camera.heldSettled?.turning !== false) throw new Error(`Camera did not settle cleanly: ${settleMs} ms.`);
          if (!Number.isFinite(heldDesiredDrift) || heldDesiredDrift >= 0.05) throw new Error(`Held camera target drifted: ${heldDesiredDrift}.`);
          if (!Number.isFinite(releaseHeadingDrift) || releaseHeadingDrift >= 0.16 || !Number.isFinite(releaseDesiredDrift) || releaseDesiredDrift >= 0.05) throw new Error(`Camera wandered after release: heading=${releaseHeadingDrift}, desired=${releaseDesiredDrift}.`);
          if (cow17.orbitLockObserved !== true || !Number.isFinite(cowLandingMs) || cowLandingMs >= 6200) throw new Error(`Cow 17 flight was not wall-clock bounded: ${cowLandingMs} ms.`);
          if (cow17.landed?.snapshot?.cow17?.airborne !== false || cow17.postLanding?.snapshot?.cow17?.airborne !== false || cow17.postLanding?.snapshot?.cow17?.safe !== true || cow17.postLanding?.bovine?.cow17?.playcanvasOrbitLocked !== true) throw new Error('Cow 17 landing/relaunch safety evidence is incomplete.');
          if (staticReport.checks.length !== 69) throw new Error(`Unexpected static check count: ${staticReport.checks.length}`);
          if (browserReport.checks.length !== 61) throw new Error(`Unexpected browser check count: ${browserReport.checks.length}`);
          if (rotationReport.checks.length !== 11) throw new Error(`Unexpected rotation-stability check count: ${rotationReport.checks.length}`);
          console.log(`Verified rotation-stable storm physics: static ${staticReport.checks.length}/${staticReport.checks.length}, browser ${browserReport.checks.length}/${browserReport.checks.length}, rotation ${rotationReport.checks.length}/${rotationReport.checks.length}, scale=${scale}, settleMs=${settleMs}, cowLandingMs=${cowLandingMs}.`);
          NODE
          rm -rf www/playcanvas
          mkdir -p www/playcanvas
          cp -R playcanvas-preview-artifact/preview/. www/playcanvas/
          cat > www/playcanvas/qa-playcanvas-build.json <<EOF
          {
            "sourceSha": "$PLAYCANVAS_SOURCE_SHA",
            "workflowRunId": $PLAYCANVAS_RUN_ID,
            "workflowRunNumber": $PLAYCANVAS_RUN_NUMBER,
            "artifact": "$PLAYCANVAS_ARTIFACT",
            "artifactDigest": "$PLAYCANVAS_ARTIFACT_DIGEST",
            "terrainFootprint": "190x190",
            "roadJunctions": 9,
            "entityCount": 251,
            "stormPhysicsBodyCount": 13,
            "cameraTrailingScale": 0.9,
            "rotationStabilityChecks": 11,
            "cow17FlightBoundMilliseconds": 5200,
            "corrections": ["upright-funnel", "one-stick-chase-camera", "camera-relative-input", "prairie-expansion", "owner-trailing-camera-polish", "render-consumed-speed-parity", "storm-physics-parity", "game-owned-suction-swirl-lift", "visible-pull-gust-regression", "authoritative-debris-physics", "physics-reset-cleanup", "held-intent-stability", "release-settle", "cow17-wall-clock-bounded-flight", "cow17-rearm-distance"],
            "status": "browser-qa-passed-not-physical-android-accepted"
          }
          EOF
          test -s www/playcanvas/index.html
          test -s www/playcanvas/authority/index.html
          test -s www/playcanvas/qa-playcanvas-build.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: www

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show deployed URL
        run: |
          echo "QA URL: ${{ steps.deployment.outputs.page_url }}"

      - name: Verify live QA root and rotation-stable storm-physics PlayCanvas candidate
        shell: bash
        env:
          QA_ROOT_URL: https://lybyerc-lab.github.io/Severe-Warning/
          PLAYCANVAS_URL: https://lybyerc-lab.github.io/Severe-Warning/playcanvas/
          PLAYCANVAS_METADATA_URL: https://lybyerc-lab.github.io/Severe-Warning/playcanvas/qa-playcanvas-build.json
          PLAYCANVAS_SOURCE_SHA: f5f01678595bf857840759604f362c93f62598e8
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if root_html="$(curl --fail --silent --show-error --location "$QA_ROOT_URL")" \
              && playcanvas_html="$(curl --fail --silent --show-error --location "$PLAYCANVAS_URL")" \
              && playcanvas_metadata="$(curl --fail --silent --show-error --location "$PLAYCANVAS_METADATA_URL")" \
              && grep -Fq 'MODERNIZATION_PHASE5_PRESENTATION_WORLD_V2' <<< "$root_html" \
              && grep -Fq 'PLAYCANVAS PLAYABLE SLICE' <<< "$playcanvas_html" \
              && grep -Fq "$PLAYCANVAS_SOURCE_SHA" <<< "$playcanvas_metadata" \
              && grep -Fq 'one-stick-chase-camera' <<< "$playcanvas_metadata" \
              && grep -Fq 'owner-trailing-camera-polish' <<< "$playcanvas_metadata" \
              && grep -Fq 'storm-physics-parity' <<< "$playcanvas_metadata" \
              && grep -Fq 'game-owned-suction-swirl-lift' <<< "$playcanvas_metadata" \
              && grep -Fq 'visible-pull-gust-regression' <<< "$playcanvas_metadata" \
              && grep -Fq 'authoritative-debris-physics' <<< "$playcanvas_metadata" \
              && grep -Fq 'physics-reset-cleanup' <<< "$playcanvas_metadata" \
              && grep -Fq 'held-intent-stability' <<< "$playcanvas_metadata" \
              && grep -Fq 'release-settle' <<< "$playcanvas_metadata" \
              && grep -Fq 'cow17-wall-clock-bounded-flight' <<< "$playcanvas_metadata" \
              && grep -Fq 'cow17-rearm-distance' <<< "$playcanvas_metadata" \
              && grep -Fq '"stormPhysicsBodyCount": 13' <<< "$playcanvas_metadata" \
              && grep -Fq '"rotationStabilityChecks": 11' <<< "$playcanvas_metadata" \
              && grep -Fq '"cow17FlightBoundMilliseconds": 5200' <<< "$playcanvas_metadata" \
              && grep -Fq '"cameraTrailingScale": 0.9' <<< "$playcanvas_metadata" \
              && grep -Fq '190x190' <<< "$playcanvas_metadata"; then
              echo "Live QA root verified: $QA_ROOT_URL"
              echo "Live rotation-stable storm-physics PlayCanvas candidate verified: $PLAYCANVAS_URL"
              echo "Live rotation-stable PlayCanvas source verified: $PLAYCANVAS_SOURCE_SHA"
              exit 0
            fi
            echo "Live Pages propagation attempt $attempt/30 not ready yet."
            sleep 3
          done
          echo 'Live QA verification did not converge after deployment.' >&2
          exit 1
