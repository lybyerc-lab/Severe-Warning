name: Deploy QA Pages

on:
  workflow_dispatch:
  push:
    branches:
      - qa
    paths:
      - '.github/workflows/deploy-qa-pages.yml'
      - 'MechanicsLab/SevereWeather_3D_Lab.html'
      - 'assets/audio/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'scripts/**'

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out QA branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install pinned JavaScript dependencies
        shell: bash
        run: |
          npm install --global pnpm@11.9.0
          pnpm install --frozen-lockfile

      - name: Verify QA patch and harness syntax
        shell: bash
        run: |
          node --check scripts/apply-qa-corrections-patch.mjs
          node --check scripts/apply-audio-mix-followup-patch.mjs
          node --check scripts/apply-ui-polish-followup-patch.mjs
          node --check scripts/apply-score-continuity-fix.mjs
          node --check scripts/apply-qa4-deterministic-lab-patch.mjs
          node --check scripts/apply-qa4-mobile-input-fix.mjs
          node --check scripts/apply-qa4-run-lock-fix.mjs
          node --check scripts/apply-qa4-pause-forensics.mjs
          node --check scripts/apply-pause-overlay-hit-test-fix.mjs
          node --check scripts/apply-pause-overlay-hard-hide.mjs
          node --check scripts/apply-qa4-popup-assertion-fix.mjs
          node --check scripts/apply-qa4-rampage-popup-fix.mjs
          node --check scripts/apply-v500-campaign-patch.mjs
          node --check scripts/apply-v500-cow-signature-patch.mjs
          node --check scripts/verify-v500-campaign.mjs
          node --check scripts/verify-qa-package.mjs
          node --check scripts/run-qa4-headless.mjs

      - name: Install FFmpeg for audio generation
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          ffmpeg -hide_banner -version | head -n 1

      - name: Generate verified audio
        run: pnpm run audio:generate

      - name: Build and verify Phase 5 web package
        shell: bash
        run: |
          set -euo pipefail
          pnpm run patch:v431
          pnpm run patch:v440
          pnpm run patch:v441
          pnpm run patch:v442
          pnpm run patch:v450
          pnpm run patch:v500
          pnpm run verify:v500
          pnpm run patch:v510
          pnpm run verify:v510
          pnpm run patch:phase2
          pnpm run verify:phase2
          pnpm run patch:phase3
          pnpm run verify:phase3
          pnpm run patch:phase4
          pnpm run verify:phase4
          pnpm run patch:phase5
          pnpm run verify:phase5
          pnpm run modern:typecheck
          pnpm run modern:build
          node scripts/build-web.mjs
          node scripts/stamp-qa-pages.mjs
          node scripts/verify-qa-package.mjs
          grep -F 'MODERNIZATION_PHASE5_PRESENTATION_WORLD_V2' www/index.html
          grep -F 'phase-5-rendering-world' www/modern/modern-shell.js

      - name: Run deterministic QA4 in headless Chrome
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-artifacts
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          echo "Using Chrome: $CHROME_BIN"

          python3 -m http.server 4173 --directory www > qa-artifacts/server.log 2>&1 &
          SERVER_PID=$!
          "$CHROME_BIN" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --autoplay-policy=no-user-gesture-required \
            --remote-debugging-port=9222 \
            --remote-allow-origins='*' \
            --user-data-dir=/tmp/severe-weather-qa4-chrome \
            'http://127.0.0.1:4173/?qa4=run' \
            > qa-artifacts/chrome.log 2>&1 &
          CHROME_PID=$!

          cleanup() {
            kill "$CHROME_PID" "$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            sleep 0.25
          done

          curl --silent --fail http://127.0.0.1:4173/ > /dev/null
          node scripts/run-qa4-headless.mjs

      - name: Upload QA4 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa4-diagnostics-${{ github.run_number }}
          path: qa-artifacts
          if-no-files-found: warn
          retention-days: 7

      - name: Download verified PlayCanvas Moo Brew intro artifact
        uses: actions/download-artifact@v4
        with:
          name: severe-weather-playcanvas-slice-83
          path: playcanvas-preview-artifact
          repository: lybyerc-lab/Severe-Warning
          run-id: 31265520417
          github-token: ${{ github.token }}

      - name: Verify and overlay PlayCanvas Moo Brew intro candidate
        shell: bash
        env:
          PLAYCANVAS_SOURCE_SHA: fdb5679c5c28d4fef378314c187780de071dd37e
          PLAYCANVAS_RUN_ID: '31265520417'
          PLAYCANVAS_RUN_NUMBER: '83'
          PLAYCANVAS_ARTIFACT: severe-weather-playcanvas-slice-83
          PLAYCANVAS_ARTIFACT_DIGEST: sha256:bebd2cc77c2d8ba45d264a34d34bedbe5afb2f379c92c39625d79bfd0c238163
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < playcanvas-preview-artifact/SOURCE_SHA.txt)" = "$PLAYCANVAS_SOURCE_SHA"
          test -s playcanvas-preview-artifact/preview/index.html
          test -s playcanvas-preview-artifact/preview/vendor/playcanvas-2.21.3.min.mjs
          test -s playcanvas-preview-artifact/playcanvas-slice-static-report.json
          test -s playcanvas-preview-artifact/playcanvas-multi-structure-static-report.json
          test -s playcanvas-preview-artifact/playcanvas-slice-evidence/playcanvas-slice-report.json
          test -s playcanvas-preview-artifact/playcanvas-slice-evidence/playcanvas-rotation-stability-report.json
          test -s playcanvas-preview-artifact/playcanvas-slice-evidence/playcanvas-multi-structure-report.json
          test -s playcanvas-preview-artifact/playcanvas-slice-evidence/playcanvas-slice.png
          test -s playcanvas-preview-artifact/playcanvas-slice-evidence/playcanvas-slice-pull.png
          test -s playcanvas-preview-artifact/playcanvas-slice-evidence/playcanvas-slice-gust.png
          test -s playcanvas-preview-artifact/playcanvas-slice-evidence/playcanvas-slice-camera-stability.png
          test -s playcanvas-preview-artifact/playcanvas-slice-evidence/playcanvas-slice-cow-stability.png
          test -s playcanvas-preview-artifact/playcanvas-slice-evidence/playcanvas-multi-structure-intact.png
          test -s playcanvas-preview-artifact/playcanvas-slice-evidence/playcanvas-multi-structure-damage.png
          test -s playcanvas-preview-artifact/playcanvas-slice-evidence/playcanvas-multi-structure-destroyed.png
          test -s playcanvas-preview-artifact/playcanvas-intro-static-report.json
          test -s playcanvas-preview-artifact/playcanvas-slice-evidence/playcanvas-intro-report.json
          test -s playcanvas-preview-artifact/playcanvas-slice-evidence/playcanvas-intro-newspaper.png
          test -s playcanvas-preview-artifact/playcanvas-slice-evidence/playcanvas-intro-moo-brew.png
          test -s playcanvas-preview-artifact/playcanvas-slice-evidence/playcanvas-intro-touchdown.png
          test -s playcanvas-preview-artifact/playcanvas-slice-evidence/playcanvas-intro-playable-handoff.png
          node - <<'NODE'
          const fs = require('fs');
          const staticReport = JSON.parse(fs.readFileSync('playcanvas-preview-artifact/playcanvas-slice-static-report.json', 'utf8'));
          const structureStatic = JSON.parse(fs.readFileSync('playcanvas-preview-artifact/playcanvas-multi-structure-static-report.json', 'utf8'));
          const browserReport = JSON.parse(fs.readFileSync('playcanvas-preview-artifact/playcanvas-slice-evidence/playcanvas-slice-report.json', 'utf8'));
          const rotationReport = JSON.parse(fs.readFileSync('playcanvas-preview-artifact/playcanvas-slice-evidence/playcanvas-rotation-stability-report.json', 'utf8'));
          const structureReport = JSON.parse(fs.readFileSync('playcanvas-preview-artifact/playcanvas-slice-evidence/playcanvas-multi-structure-report.json', 'utf8'));
          const introStatic = JSON.parse(fs.readFileSync('playcanvas-preview-artifact/playcanvas-intro-static-report.json', 'utf8'));
          const introReport = JSON.parse(fs.readFileSync('playcanvas-preview-artifact/playcanvas-slice-evidence/playcanvas-intro-report.json', 'utf8'));

          for (const [label, report] of [
            ['main static', staticReport],
            ['multi-structure static', structureStatic],
            ['browser', browserReport],
            ['rotation', rotationReport],
            ['multi-structure browser', structureReport],
            ['Moo Brew intro static', introStatic],
            ['Moo Brew intro browser', introReport],
          ]) {
            if (!report.passed || report.failedChecks?.length) throw new Error(`${label} report is not sealed green.`);
          }
          if (rotationReport.version !== 'PLAYCANVAS_ROTATION_STABILITY_V2') throw new Error(`Unexpected rotation report version: ${rotationReport.version}`);
          if (structureReport.version !== 'PLAYCANVAS_MULTI_STRUCTURE_QA_V2') throw new Error(`Unexpected multi-structure report version: ${structureReport.version}`);
          if (introStatic.version !== 'PLAYCANVAS_MOO_BREW_INTRO_STATIC_V1') throw new Error(`Unexpected intro static report version: ${introStatic.version}`);
          if (introReport.version !== 'PLAYCANVAS_MOO_BREW_INTRO_QA_V1') throw new Error(`Unexpected intro browser report version: ${introReport.version}`);
          if (staticReport.checks.length !== 79) throw new Error(`Unexpected main static count: ${staticReport.checks.length}`);
          if (structureStatic.checks.length !== 19) throw new Error(`Unexpected multi-structure static count: ${structureStatic.checks.length}`);
          if (browserReport.checks.length !== 61) throw new Error(`Unexpected browser count: ${browserReport.checks.length}`);
          if (rotationReport.checks.length !== 11) throw new Error(`Unexpected rotation count: ${rotationReport.checks.length}`);
          if (structureReport.checks.length !== 22) throw new Error(`Unexpected multi-structure browser count: ${structureReport.checks.length}`);
          if (introStatic.checks.length !== 8) throw new Error(`Unexpected intro static count: ${introStatic.checks.length}`);
          if (introReport.checks.length !== 12) throw new Error(`Unexpected intro browser count: ${introReport.checks.length}`);

          const requiredStructureChecks = [
            'four-authoritative-structures-bound',
            'four-presentation-bindings-bound',
            'structures-inside-test-world',
            'storefront-damaged-through-accepted-gameplay',
            'storefront-destroyed-through-accepted-gameplay',
            'second-distinct-structure-damaged',
            'at-least-two-structures-authoritatively-damaged',
            'destruction-score-grows-through-authority',
            'presentation-matches-authority',
            'authoritative-stage-activates-structure-debris',
            'accepted-pull-moves-detached-structure-debris',
            'all-four-structure-debris-classes-activate',
            'structure-debris-mass-order-is-readable',
            'heavy-frame-trails-light-trim',
            'roof-lifts-more-than-frame',
            'structure-debris-count-remains-bounded',
            'reset-restores-authoritative-structures',
            'reset-restores-structure-presentation',
            'reset-clears-structure-debris',
            'cow17-remains-safe',
            'no-console-errors-multi-structure',
            'no-page-errors-multi-structure',
          ];
          const structureChecks = new Map(structureReport.checks.map((check) => [check.name, check.passed]));
          for (const name of requiredStructureChecks) {
            if (structureChecks.get(name) !== true) throw new Error(`Required multi-structure gate missing or red: ${name}`);
          }

          const requiredIntroChecks = [
            'qa-default-skips-timed-intro',
            'forced-qa-intro-is-deterministic',
            'authority-not-loaded-before-intro-finish',
            'canonical-intro-phase-order',
            'newspaper-phase-readable',
            'moo-brew-cow-cup-phase-readable',
            'chicken-scatter-phase-readable',
            'touchdown-phase-readable',
            'intro-finish-hands-off-to-gameplay',
            'warning-run-starts-fresh-after-intro',
            'no-console-errors-intro',
            'no-page-errors-intro',
          ];
          const introChecks = new Map(introReport.checks.map((check) => [check.name, check.passed]));
          for (const name of requiredIntroChecks) {
            if (introChecks.get(name) !== true) throw new Error(`Required Moo Brew intro gate missing or red: ${name}`);
          }

          const physics = browserReport.evidence?.physics ?? {};
          const pull = physics.afterPullPhysics ?? {};
          const gust = physics.afterGustPhysics ?? {};
          const visibleInput = browserReport.evidence?.visibleInput ?? {};
          const scale = Number(visibleInput.joystickVisibleAuthorityScale);
          const maxStep = Number(visibleInput.keyboardHeadingStepMetrics?.maxStep);
          const camera = rotationReport.evidence?.camera ?? {};
          const cow17 = rotationReport.evidence?.cow17 ?? {};
          const multi = structureReport.evidence ?? {};
          const scoreAfter = Number(multi.score?.afterDestruction);
          const changedIds = multi.changedIds ?? [];
          const massHierarchy = multi.massHierarchy ?? {};
          const classes = massHierarchy.classes ?? {};
          const trim = classes.trim ?? {};
          const roof = classes.roof ?? {};
          const wall = classes.wall ?? {};
          const frame = classes.frame ?? {};
          const structureDebris = multi.afterDamage?.debris ?? {};
          const resetDebris = multi.afterReset?.debris ?? {};
          const resetPresentation = multi.afterReset?.presentation ?? {};
          const introBefore = introReport.evidence?.beforeHandoff ?? {};
          const introAfter = introReport.evidence?.afterHandoff ?? {};
          const introWarningStart = Number(introAfter.authority?.run?.remainingSeconds);

          if (!Number.isFinite(scale) || Math.abs(scale - 0.7717) > 0.03) throw new Error(`Visible/authority scale parity out of bounds: ${scale}`);
          if (!Number.isFinite(maxStep) || maxStep > 0.13) throw new Error(`Camera heading step exceeds no-snap gate: ${maxStep}`);
          if (Math.abs(Number(pull.peakTreeTiltRadians) - 0.4218329627222749) > 0.000001) throw new Error('Protected Pull tree tilt changed.');
          if (Math.abs(Number(pull.maxPullInwardDelta) - 5.374028004530404) > 0.000001) throw new Error('Protected Pull inward response changed.');
          if (Math.abs(Number(pull.maxPullTangentialDelta) - 1.340381940964075) > 0.000001) throw new Error('Protected Pull orbit response changed.');
          if (Math.abs(Number(gust.peakTreeTiltRadians) - 0.3673336055836977) > 0.000001) throw new Error('Protected Gust tree tilt changed.');
          if (Math.abs(Number(gust.maxGustOutwardDelta) - 5.042881747270892) > 0.000001) throw new Error('Protected Gust outward response changed.');
          if (Number(camera.releaseHeadingDrift) >= 0.16 || Number(camera.releaseDesiredDrift) >= 0.05) throw new Error('Camera release stability regressed.');
          if (cow17.postLanding?.snapshot?.cow17?.safe !== true || cow17.postLanding?.snapshot?.cow17?.airborne !== false) throw new Error('Cow 17 safety/landing evidence regressed.');
          if (!changedIds.includes('storefront') || !changedIds.includes('house') || changedIds.length < 2) throw new Error(`Expected two damaged structures; got ${JSON.stringify(changedIds)}.`);
          if (!Number.isFinite(scoreAfter) || scoreAfter <= 0) throw new Error(`Accepted destruction score did not grow: ${scoreAfter}.`);
          if (Number(structureDebris.activationCount) < 1 || Number(structureDebris.activeCount) < 1 || Number(structureDebris.maxDisplacement) <= 0.15) throw new Error('Structure debris evidence is missing.');
          if (Number(massHierarchy.activeCount) < 5 || Number(massHierarchy.activeCount) > 20) throw new Error(`Unexpected active structure debris count: ${massHierarchy.activeCount}.`);
          if (!(Number(trim.minMass) < Number(roof.minMass) && Number(roof.minMass) < Number(wall.minMass) && Number(wall.minMass) < Number(frame.minMass))) throw new Error('Structure debris mass order regressed.');
          if (!(Number(trim.maxHorizontal) > Number(frame.maxHorizontal) + 0.25)) throw new Error('Heavy frame no longer trails light trim.');
          if (!(Number(roof.maxRise) > Number(frame.maxRise) + 0.15)) throw new Error('Roof no longer lifts more than frame.');
          if (!(Number(trim.maxRise) >= 5 && Number(trim.maxRise) <= 22.05)) throw new Error(`Trim spectacle rise out of band: ${trim.maxRise}.`);
          if (!(Number(roof.maxRise) >= 3 && Number(roof.maxRise) <= 14.05)) throw new Error(`Roof peel/lift rise out of band: ${roof.maxRise}.`);
          if (!(Number(wall.maxRise) <= 4.55)) throw new Error(`Wall rise is too light: ${wall.maxRise}.`);
          if (!(Number(frame.maxRise) <= 2.55)) throw new Error(`Frame rise is too light: ${frame.maxRise}.`);
          if (Number(resetDebris.activeCount) !== 0 || Number(resetDebris.maxDisplacement) !== 0) throw new Error('Structure debris did not reset cleanly.');
          if (Number(resetPresentation.damagedCount) !== 0 || Number(resetPresentation.destroyedCount) !== 0) throw new Error('Structure presentation did not reset intact.');
          if (introBefore.sliceExists !== false || introBefore.intro?.gameplayLoaded !== false) throw new Error('Gameplay authority loaded before the intro finished.');
          if (introAfter.intro?.completed !== true || introAfter.intro?.gameplayLoaded !== true || introAfter.authority?.ready !== true) throw new Error('Intro did not hand off cleanly to accepted gameplay authority.');
          if (introAfter.authority?.run?.runActive !== true || Number(introAfter.authority?.run?.stage) !== 1 || !Number.isFinite(introWarningStart) || introWarningStart < 176 || Number(introAfter.authority?.score?.destructionScore) !== 0) throw new Error(`Accepted warning run did not start fresh after intro: ${introWarningStart}.`);

          console.log(`Verified Moo Brew intro artifact: main ${staticReport.checks.length}, multi-static ${structureStatic.checks.length}, browser ${browserReport.checks.length}, rotation ${rotationReport.checks.length}, multi-browser ${structureReport.checks.length}, intro-static ${introStatic.checks.length}, intro-browser ${introReport.checks.length}, warningStart=${introWarningStart}, score=${scoreAfter}, trimRise=${trim.maxRise}, roofRise=${roof.maxRise}, wallRise=${wall.maxRise}, frameRise=${frame.maxRise}.`);
          NODE

          rm -rf www/playcanvas
          mkdir -p www/playcanvas
          cp -R playcanvas-preview-artifact/preview/. www/playcanvas/
          cat > www/playcanvas/qa-playcanvas-build.json <<EOF
          {
            "sourceSha": "$PLAYCANVAS_SOURCE_SHA",
            "workflowRunId": $PLAYCANVAS_RUN_ID,
            "workflowRunNumber": $PLAYCANVAS_RUN_NUMBER,
            "artifact": "$PLAYCANVAS_ARTIFACT",
            "artifactDigest": "$PLAYCANVAS_ARTIFACT_DIGEST",
            "terrainFootprint": "190x190",
            "roadJunctions": 9,
            "entityCount": 307,
            "stormPhysicsBodyCount": 13,
            "authorityStructureCount": 4,
            "structureDebrisBodyCount": 19,
            "cameraTrailingScale": 0.9,
            "rotationStabilityChecks": 11,
            "multiStructureChecks": 22,
            "introStaticChecks": 8,
            "introChecks": 12,
            "corrections": ["upright-funnel", "one-stick-chase-camera", "camera-relative-input", "prairie-expansion", "owner-trailing-camera-polish", "storm-physics-parity", "held-intent-stability", "release-settle", "cow17-wall-clock-bounded-flight", "multi-structure-authority", "local-authority-alignment", "authority-stage-destruction", "structure-debris-field", "multi-structure-reset-cleanup", "building-anatomy", "staged-breakup", "structure-mass-hierarchy", "spectacle-band-altitude", "assistant-playtest-gate", "moo-brew-intro", "intro-gated-authority", "intro-transition-settle-qa"],
            "status": "browser-qa-passed-assistant-reviewed-moo-brew-intro-owner-test-pending-not-physical-android-accepted"
          }
          EOF
          test -s www/playcanvas/index.html
          test -s www/playcanvas/authority/index.html
          test -s www/playcanvas/qa-playcanvas-build.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: www

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show deployed URL
        run: |
          echo "QA URL: ${{ steps.deployment.outputs.page_url }}"

      - name: Verify live QA root and Moo Brew intro PlayCanvas candidate
        shell: bash
        env:
          QA_ROOT_URL: https://lybyerc-lab.github.io/Severe-Warning/
          PLAYCANVAS_URL: https://lybyerc-lab.github.io/Severe-Warning/playcanvas/
          PLAYCANVAS_METADATA_URL: https://lybyerc-lab.github.io/Severe-Warning/playcanvas/qa-playcanvas-build.json
          PLAYCANVAS_SOURCE_SHA: fdb5679c5c28d4fef378314c187780de071dd37e
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if root_html="$(curl --fail --silent --show-error --location "$QA_ROOT_URL")" \
              && playcanvas_html="$(curl --fail --silent --show-error --location "$PLAYCANVAS_URL")" \
              && playcanvas_metadata="$(curl --fail --silent --show-error --location "$PLAYCANVAS_METADATA_URL")" \
              && grep -Fq 'MODERNIZATION_PHASE5_PRESENTATION_WORLD_V2' <<< "$root_html" \
              && grep -Fq 'PLAYCANVAS PLAYABLE SLICE' <<< "$playcanvas_html" \
              && grep -Fq "$PLAYCANVAS_SOURCE_SHA" <<< "$playcanvas_metadata" \
              && grep -Fq 'storm-physics-parity' <<< "$playcanvas_metadata" \
              && grep -Fq 'held-intent-stability' <<< "$playcanvas_metadata" \
              && grep -Fq 'cow17-wall-clock-bounded-flight' <<< "$playcanvas_metadata" \
              && grep -Fq 'multi-structure-authority' <<< "$playcanvas_metadata" \
              && grep -Fq 'authority-stage-destruction' <<< "$playcanvas_metadata" \
              && grep -Fq 'building-anatomy' <<< "$playcanvas_metadata" \
              && grep -Fq 'staged-breakup' <<< "$playcanvas_metadata" \
              && grep -Fq 'structure-mass-hierarchy' <<< "$playcanvas_metadata" \
              && grep -Fq 'spectacle-band-altitude' <<< "$playcanvas_metadata" \
              && grep -Fq 'assistant-playtest-gate' <<< "$playcanvas_metadata" \
              && grep -Fq 'moo-brew-intro' <<< "$playcanvas_metadata" \
              && grep -Fq 'intro-gated-authority' <<< "$playcanvas_metadata" \
              && grep -Fq 'intro-transition-settle-qa' <<< "$playcanvas_metadata" \
              && grep -Fq '"authorityStructureCount": 4' <<< "$playcanvas_metadata" \
              && grep -Fq '"structureDebrisBodyCount": 19' <<< "$playcanvas_metadata" \
              && grep -Fq '"multiStructureChecks": 22' <<< "$playcanvas_metadata" \
              && grep -Fq '"introStaticChecks": 8' <<< "$playcanvas_metadata" \
              && grep -Fq '"introChecks": 12' <<< "$playcanvas_metadata" \
              && grep -Fq '"entityCount": 307' <<< "$playcanvas_metadata" \
              && grep -Fq '"cameraTrailingScale": 0.9' <<< "$playcanvas_metadata" \
              && grep -Fq '190x190' <<< "$playcanvas_metadata"; then
              echo "Live QA root verified: $QA_ROOT_URL"
              echo "Live Moo Brew intro PlayCanvas candidate verified: $PLAYCANVAS_URL"
              echo "Live Moo Brew intro PlayCanvas source verified: $PLAYCANVAS_SOURCE_SHA"
              exit 0
            fi
            echo "Live Pages propagation attempt $attempt/30 not ready yet."
            sleep 3
          done
          echo 'Live QA verification did not converge after deployment.' >&2
          exit 1