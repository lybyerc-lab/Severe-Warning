name: Deploy QA Pages

on:
  workflow_dispatch:
  push:
    branches:
      - qa
    paths:
      - '.github/workflows/deploy-qa-pages.yml'
      - 'MechanicsLab/SevereWeather_3D_Lab.html'
      - 'assets/audio/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'scripts/**'

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out QA branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install pinned JavaScript dependencies
        shell: bash
        run: |
          npm install --global pnpm@11.9.0
          pnpm install --frozen-lockfile

      - name: Verify QA patch and harness syntax
        shell: bash
        run: |
          node --check scripts/apply-qa-corrections-patch.mjs
          node --check scripts/apply-audio-mix-followup-patch.mjs
          node --check scripts/apply-ui-polish-followup-patch.mjs
          node --check scripts/apply-score-continuity-fix.mjs
          node --check scripts/apply-qa4-deterministic-lab-patch.mjs
          node --check scripts/apply-qa4-mobile-input-fix.mjs
          node --check scripts/apply-qa4-run-lock-fix.mjs
          node --check scripts/apply-qa4-pause-forensics.mjs
          node --check scripts/apply-pause-overlay-hit-test-fix.mjs
          node --check scripts/apply-pause-overlay-hard-hide.mjs
          node --check scripts/apply-qa4-popup-assertion-fix.mjs
          node --check scripts/apply-qa4-rampage-popup-fix.mjs
          node --check scripts/apply-v500-campaign-patch.mjs
          node --check scripts/apply-v500-cow-signature-patch.mjs
          node --check scripts/verify-v500-campaign.mjs
          node --check scripts/verify-qa-package.mjs
          node --check scripts/run-qa4-headless.mjs

      - name: Install FFmpeg for audio generation
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          ffmpeg -hide_banner -version | head -n 1

      - name: Generate verified audio
        run: pnpm run audio:generate

      - name: Build and verify Phase 5 web package
        shell: bash
        run: |
          set -euo pipefail
          pnpm run patch:v431
          pnpm run patch:v440
          pnpm run patch:v441
          pnpm run patch:v442
          pnpm run patch:v450
          pnpm run patch:v500
          pnpm run verify:v500
          pnpm run patch:v510
          pnpm run verify:v510
          pnpm run patch:phase2
          pnpm run verify:phase2
          pnpm run patch:phase3
          pnpm run verify:phase3
          pnpm run patch:phase4
          pnpm run verify:phase4
          pnpm run patch:phase5
          pnpm run verify:phase5
          pnpm run modern:typecheck
          pnpm run modern:build
          node scripts/build-web.mjs
          node scripts/stamp-qa-pages.mjs
          node scripts/verify-qa-package.mjs
          grep -F 'MODERNIZATION_PHASE5_PRESENTATION_WORLD_V2' www/index.html
          grep -F 'phase-5-rendering-world' www/modern/modern-shell.js

      - name: Run deterministic QA4 in headless Chrome
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-artifacts
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          echo "Using Chrome: $CHROME_BIN"

          python3 -m http.server 4173 --directory www > qa-artifacts/server.log 2>&1 &
          SERVER_PID=$!
          "$CHROME_BIN" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --autoplay-policy=no-user-gesture-required \
            --remote-debugging-port=9222 \
            --remote-allow-origins='*' \
            --user-data-dir=/tmp/severe-weather-qa4-chrome \
            'http://127.0.0.1:4173/?qa4=run' \
            > qa-artifacts/chrome.log 2>&1 &
          CHROME_PID=$!

          cleanup() {
            kill "$CHROME_PID" "$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            sleep 0.25
          done

          curl --silent --fail http://127.0.0.1:4173/ > /dev/null
          node scripts/run-qa4-headless.mjs

      - name: Upload QA4 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa4-diagnostics-${{ github.run_number }}
          path: qa-artifacts
          if-no-files-found: warn
          retention-days: 7

      - name: Download verified PlayCanvas one-stick chase artifact
        uses: actions/download-artifact@v4
        with:
          name: severe-weather-playcanvas-slice-34
          path: playcanvas-preview-artifact
          repository: lybyerc-lab/Severe-Warning
          run-id: 31173231741
          github-token: ${{ github.token }}

      - name: Verify and overlay one-stick chase PlayCanvas candidate
        shell: bash
        env:
          PLAYCANVAS_SOURCE_SHA: 540087c3ea08c56b3b47dffb0b448608a934c350
          PLAYCANVAS_RUN_ID: '31173231741'
          PLAYCANVAS_RUN_NUMBER: '34'
          PLAYCANVAS_ARTIFACT: severe-weather-playcanvas-slice-34
          PLAYCANVAS_ARTIFACT_DIGEST: sha256:f7f90a48b6bd4a4b67b2523d90ec914ad291ad969c93d47d3a70dea7168c458d
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < playcanvas-preview-artifact/SOURCE_SHA.txt)" = "$PLAYCANVAS_SOURCE_SHA"
          test -s playcanvas-preview-artifact/preview/index.html
          test -s playcanvas-preview-artifact/preview/vendor/playcanvas-2.21.3.min.mjs
          test -s playcanvas-preview-artifact/playcanvas-slice-static-report.json
          test -s playcanvas-preview-artifact/playcanvas-slice-evidence/playcanvas-slice-report.json
          node - <<'NODE'
          const fs = require('fs');
          const staticReport = JSON.parse(fs.readFileSync('playcanvas-preview-artifact/playcanvas-slice-static-report.json', 'utf8'));
          const browserReport = JSON.parse(fs.readFileSync('playcanvas-preview-artifact/playcanvas-slice-evidence/playcanvas-slice-report.json', 'utf8'));
          if (!staticReport.passed || staticReport.failedChecks?.length) throw new Error('PlayCanvas static report is not sealed green.');
          if (!browserReport.passed || browserReport.failedChecks?.length) throw new Error('PlayCanvas browser report is not sealed green.');

          const staticChecks = new Map(staticReport.checks.map((check) => [check.name, check.passed]));
          for (const name of [
            'camera-relative-input-contract',
            'keyboard-camera-relative',
            'touch-camera-relative',
            'one-stick-chase-camera-contract',
            'chase-camera-turn-rate-bounded',
            'chase-camera-intent-wiring',
            'tornado-funnel-upright',
            'browser-visible-control-check',
            'browser-chase-camera-check',
          ]) {
            if (staticChecks.get(name) !== true) throw new Error(`Required one-stick PlayCanvas static gate missing or red: ${name}`);
          }

          const browserChecks = new Map(browserReport.checks.map((check) => [check.name, check.passed]));
          for (const name of [
            'gameplay-authority-connected',
            'joystick-up-moves-screen-forward',
            'keyboard-right-moves-screen-right',
            'camera-stays-stable-on-forward-input',
            'camera-turns-gradually-behind-keyboard-motion',
            'camera-distance-stable-joystick',
            'camera-distance-stable-keyboard',
            'authority-setup-moves-real-storm',
            'authority-setup-approaches-live-target',
            'gust-executor-accepted',
            'pull-executor-accepted',
            'zap-executor-accepted',
            'destruction-state-changed',
            'cow17-safe',
            'road-above-terrain',
            'tornado-above-road',
            'no-console-errors',
            'no-page-errors',
          ]) {
            if (browserChecks.get(name) !== true) throw new Error(`Required one-stick PlayCanvas browser gate missing or red: ${name}`);
          }
          console.log(`Verified one-stick PlayCanvas artifact: static ${staticReport.checks.length}/${staticReport.checks.length}, browser ${browserReport.checks.length}/${browserReport.checks.length}.`);
          NODE
          rm -rf www/playcanvas
          mkdir -p www/playcanvas
          cp -R playcanvas-preview-artifact/preview/. www/playcanvas/
          cat > www/playcanvas/qa-playcanvas-build.json <<EOF
          {
            "sourceSha": "$PLAYCANVAS_SOURCE_SHA",
            "workflowRunId": $PLAYCANVAS_RUN_ID,
            "workflowRunNumber": $PLAYCANVAS_RUN_NUMBER,
            "artifact": "$PLAYCANVAS_ARTIFACT",
            "artifactDigest": "$PLAYCANVAS_ARTIFACT_DIGEST",
            "corrections": ["upright-funnel", "one-stick-chase-camera", "camera-relative-input", "frame-rate-resilient-camera"],
            "status": "browser-qa-passed-not-physical-android-accepted"
          }
          EOF
          test -s www/playcanvas/index.html
          test -s www/playcanvas/authority/index.html
          test -s www/playcanvas/qa-playcanvas-build.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: www

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show deployed URL
        run: |
          echo "QA URL: ${{ steps.deployment.outputs.page_url }}"

      - name: Verify live QA root and one-stick chase PlayCanvas candidate
        shell: bash
        env:
          QA_ROOT_URL: https://lybyerc-lab.github.io/Severe-Warning/
          PLAYCANVAS_URL: https://lybyerc-lab.github.io/Severe-Warning/playcanvas/
          PLAYCANVAS_METADATA_URL: https://lybyerc-lab.github.io/Severe-Warning/playcanvas/qa-playcanvas-build.json
          PLAYCANVAS_SOURCE_SHA: 540087c3ea08c56b3b47dffb0b448608a934c350
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if root_html="$(curl --fail --silent --show-error --location "$QA_ROOT_URL")" \
              && playcanvas_html="$(curl --fail --silent --show-error --location "$PLAYCANVAS_URL")" \
              && playcanvas_metadata="$(curl --fail --silent --show-error --location "$PLAYCANVAS_METADATA_URL")" \
              && grep -Fq 'MODERNIZATION_PHASE5_PRESENTATION_WORLD_V2' <<< "$root_html" \
              && grep -Fq 'PLAYCANVAS PLAYABLE SLICE' <<< "$playcanvas_html" \
              && grep -Fq "$PLAYCANVAS_SOURCE_SHA" <<< "$playcanvas_metadata" \
              && grep -Fq 'one-stick-chase-camera' <<< "$playcanvas_metadata" \
              && grep -Fq 'camera-relative-input' <<< "$playcanvas_metadata" \
              && grep -Fq 'frame-rate-resilient-camera' <<< "$playcanvas_metadata"; then
              echo "Live QA root verified: $QA_ROOT_URL"
              echo "Live one-stick chase PlayCanvas candidate verified: $PLAYCANVAS_URL"
              echo "Live one-stick chase PlayCanvas source verified: $PLAYCANVAS_SOURCE_SHA"
              exit 0
            fi
            echo "Live Pages propagation attempt $attempt/30 not ready yet."
            sleep 3
          done
          echo 'Live QA verification did not converge after deployment.' >&2
          exit 1