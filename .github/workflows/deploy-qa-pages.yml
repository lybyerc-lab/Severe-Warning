name: Deploy sealed QA candidate to Pages

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful Hero Slice workflow run ID that produced the candidate artifact
        required: true
        type: string
      artifact_name:
        description: Exact final evidence artifact name, for example severe-weather-threejs-hero-slice6-web-123
        required: true
        type: string
      source_commit:
        description: Exact source commit declared by the candidate manifest
        required: true
        type: string

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate-and-publish:
    name: Validate sealed candidate then publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out publisher contract
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Download exact candidate artifact from its successful source run
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: candidate

      - name: Reject mismatched, incomplete, or failed candidate evidence
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/qa-candidate-contract.mjs
          node scripts/qa-candidate-contract.mjs validate \
            --root candidate --manifest package-manifest.json --expected-source '${{ inputs.source_commit }}'
          test "$(tr -d '\n' < candidate/SOURCE_COMMIT.txt)" = '${{ inputs.source_commit }}'
          test -s candidate/web-preview/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload validated Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: candidate/web-preview

  deploy:
    needs: validate-and-publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show deployed URL
        run: |
          echo "QA URL: ${{ steps.deployment.outputs.page_url }}"
