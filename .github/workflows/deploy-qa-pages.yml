name: Deploy QA Pages

on:
  workflow_dispatch:
  push:
    branches:
      - qa
    paths:
      - '.github/workflows/deploy-qa-pages.yml'
      - 'MechanicsLab/SevereWeather_3D_Lab.html'
      - 'assets/audio/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'scripts/**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out QA branch
        uses: actions/checkout@v6

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install pinned JavaScript dependencies
        shell: bash
        run: |
          npm install --global pnpm@11.9.0
          pnpm install --frozen-lockfile

      - name: Verify QA patch and harness syntax
        shell: bash
        run: |
          node --check scripts/apply-qa-corrections-patch.mjs
          node --check scripts/apply-audio-mix-followup-patch.mjs
          node --check scripts/apply-ui-polish-followup-patch.mjs
          node --check scripts/apply-score-continuity-fix.mjs
          node --check scripts/apply-qa4-deterministic-lab-patch.mjs
          node --check scripts/apply-qa4-mobile-input-fix.mjs
          node --check scripts/apply-qa4-run-lock-fix.mjs
          node --check scripts/apply-qa4-pause-forensics.mjs
          node --check scripts/apply-pause-overlay-hit-test-fix.mjs
          node --check scripts/apply-pause-overlay-hard-hide.mjs
          node --check scripts/apply-qa4-popup-assertion-fix.mjs
          node --check scripts/apply-qa4-rampage-popup-fix.mjs
          node --check scripts/apply-v500-campaign-patch.mjs
          node --check scripts/apply-v500-cow-signature-patch.mjs
          node --check scripts/verify-v500-campaign.mjs
          node --check scripts/verify-qa-package.mjs
          node --check scripts/run-qa4-headless.mjs

      - name: Restore verified QA audio cache
        id: audio-cache
        uses: actions/cache@v5
        with:
          path: assets/audio
          key: qa-audio-${{ hashFiles('scripts/generate-storm-audio.mjs', 'scripts/apply-recorded-storm-effects.mjs', 'scripts/append-rampage-music.mjs') }}

      - name: Install FFmpeg for audio cache miss
        if: steps.audio-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          ffmpeg -hide_banner -version | head -n 1

      - name: Generate verified audio on cache miss
        if: steps.audio-cache.outputs.cache-hit != 'true'
        run: npm run audio:generate

      - name: Apply deterministic gameplay patches
        shell: bash
        run: |
          npm run patch:v431
          npm run patch:v440
          npm run patch:v441
          npm run patch:v442
          npm run patch:v450
          npm run patch:v500
          npm run patch:v510
          npm run patch:phase2
          npm run patch:phase3
          npm run patch:phase4
          npm run patch:phase5

      - name: Verify v5 campaign foundation
        run: |
          npm run verify:v500
          npm run verify:v510
          npm run verify:phase2
          npm run verify:phase3
          npm run verify:phase4
          npm run verify:phase5

      - name: Build web game without regenerating audio
        run: |
          pnpm run modern:typecheck
          pnpm run modern:build
          node scripts/build-web.mjs

      - name: Stamp QA build identity
        run: node scripts/stamp-qa-pages.mjs

      - name: Verify QA package with named checks
        run: node scripts/verify-qa-package.mjs

      - name: Run deterministic QA4 in headless Chrome
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-artifacts
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          echo "Using Chrome: $CHROME_BIN"

          python3 -m http.server 4173 --directory www > qa-artifacts/server.log 2>&1 &
          SERVER_PID=$!
          "$CHROME_BIN" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --autoplay-policy=no-user-gesture-required \
            --remote-debugging-port=9222 \
            --remote-allow-origins='*' \
            --user-data-dir=/tmp/severe-weather-qa4-chrome \
            'http://127.0.0.1:4173/?qa4=run' \
            > qa-artifacts/chrome.log 2>&1 &
          CHROME_PID=$!

          cleanup() {
            kill "$CHROME_PID" "$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            sleep 0.25
          done

          curl --silent --fail http://127.0.0.1:4173/ > /dev/null
          node scripts/run-qa4-headless.mjs

      - name: Upload QA4 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa4-diagnostics-${{ github.run_number }}
          path: qa-artifacts
          if-no-files-found: warn
          retention-days: 7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: www

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show deployed URL
        run: |
          echo "QA URL: ${{ steps.deployment.outputs.page_url }}"
