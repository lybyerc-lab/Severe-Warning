name: Modernization Phase 2 Clocks

on:
  workflow_dispatch:
  push:
    branches:
      - agent/modernization-phase-2-clocks
  pull_request:
    branches:
      - agent/modernization-phase-1-shell

permissions:
  contents: read

concurrency:
  group: modernization-phase-2-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-package:
    name: Build, verify, and package clock migration
    runs-on: ubuntu-24.04
    timeout-minutes: 50

    steps:
      - name: Check out Phase 2 branch
        uses: actions/checkout@v6

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Install frozen dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          npm install --global pnpm@11.9.0
          pnpm install --frozen-lockfile

      - name: Verify syntax and strict TypeScript
        shell: bash
        run: |
          node --check scripts/apply-modernization-phase2-clocks.mjs
          node --check scripts/verify-modernization-phase2-clocks.mjs
          node --check scripts/qa-modernization-phase2-clocks.mjs
          node --check runtime/modernization-phase2-clocks.js
          npm run modern:typecheck

      - name: Generate verified audio
        run: npm run audio:generate

      - name: Apply accepted gameplay chain
        shell: bash
        run: |
          npm run patch:v431
          npm run patch:v440
          npm run patch:v441
          npm run patch:v442
          npm run patch:v450
          npm run patch:v500
          npm run verify:v500
          npm run patch:v510
          npm run verify:v510

      - name: Apply and verify Phase 2 clocks
        shell: bash
        run: |
          npm run patch:phase2
          npm run verify:phase2

      - name: Build modern shell and offline package
        shell: bash
        run: |
          npm run modern:build
          node scripts/build-web.mjs
          node scripts/stamp-qa-pages.mjs
          node scripts/verify-qa-package.mjs
          grep -F 'MODERNIZATION_PHASE2_CLOCKS_V1' www/index.html
          grep -F 'phase-2-clocks' www/modern/modern-shell.js

      - name: Run browser parity and clock QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-artifacts/modernization-phase-2
          python3 -m http.server 4173 --directory www > qa-artifacts/modernization-phase-2/server.log 2>&1 &
          SERVER_PID=$!
          cleanup() { kill "$SERVER_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          for attempt in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 0.25
          done
          curl --silent --fail http://127.0.0.1:4173/ > /dev/null
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          CHROME_BIN="$CHROME_BIN" SEVERE_WEATHER_QA_DIR="qa-artifacts/modernization-phase-2/visual" npm run qa:v510
          CHROME_BIN="$CHROME_BIN" SEVERE_WEATHER_QA_DIR="qa-artifacts/modernization-phase-2/clocks" npm run qa:phase2

      - name: Synchronize Android assets
        shell: bash
        run: |
          node node_modules/@capacitor/cli/bin/capacitor sync android
          cmp -s www/index.html android/app/src/main/assets/public/index.html
          cmp -s www/modern/modern-shell.js android/app/src/main/assets/public/modern/modern-shell.js

      - name: Assemble debug APK
        shell: bash
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Package Phase 2 evidence
        id: package
        shell: bash
        run: |
          set -euo pipefail
          source_commit="${{ github.event.pull_request.head.sha || github.sha }}"
          output_dir="dist/modernization-phase-2"
          mkdir -p "$output_dir"
          # Packaging identity comes from package.json and is checked against the
          # APK Gradle actually produced, so these evidence bundles cannot keep
          # advertising a version that nobody builds any more.
          base_version="$(node -p "require('./package.json').version")"
          if [[ ! "$base_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::package.json version must be semantic x.y.z, received: $base_version"
            exit 1
          fi
          IFS='.' read -r major minor patch <<< "$base_version"
          if (( minor > 9 || patch > 9 )); then
            echo "::error::The xyz versionCode scheme cannot encode $base_version; minor and patch must each stay below 10."
            exit 1
          fi
          version_code="$((major * 100 + minor * 10 + patch))"

          metadata="android/app/build/outputs/apk/debug/output-metadata.json"
          test -s "$metadata"
          actual_version_code="$(node -p "String(require('./$metadata').elements?.[0]?.versionCode ?? '')")"
          actual_version_name="$(node -p "String(require('./$metadata').elements?.[0]?.versionName ?? '')")"
          identity_ok=1
          if [[ "$actual_version_code" != "$version_code" ]]; then
            echo "::error::APK versionCode is '$actual_version_code', expected '$version_code'"
            identity_ok=0
          fi
          if [[ "$actual_version_name" != "$base_version" ]]; then
            echo "::error::APK versionName is '$actual_version_name', expected '$base_version'"
            identity_ok=0
          fi
          if (( identity_ok == 0 )); then
            echo "::error::Packaged APK identity does not match package.json. Refusing to record a mislabelled evidence bundle."
            exit 1
          fi

          source_apk="android/app/build/outputs/apk/debug/app-debug.apk"
          output_apk="$output_dir/Severe-Weather-v${base_version}-Phase-2-Clocks-${GITHUB_RUN_NUMBER}.apk"
          cp "$source_apk" "$output_apk"
          sha256sum "$output_apk" | tee "$output_apk.sha256"
          cp -R www "$output_dir/web-preview"
          cp -R qa-artifacts/modernization-phase-2 "$output_dir/qa-evidence"
          cat > "$output_dir/package-manifest.json" <<MANIFEST
          {
            "sourceBranch": "agent/modernization-phase-2-clocks",
            "sourceCommit": "$source_commit",
            "workflowRun": $GITHUB_RUN_NUMBER,
            "versionName": "$base_version",
            "renderer": "Three.js r128",
            "architecture": "modern-shell-v1",
            "modernizationPhase": "phase-2-clocks",
            "apkFile": "$(basename "$output_apk")",
            "apkSha256": "$(sha256sum "$output_apk" | awk '{print $1}')"
          }
          MANIFEST
          echo "artifact_name=severe-weather-modernization-phase-2-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Upload Phase 2 bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.artifact_name || 'severe-weather-modernization-phase-2-diagnostics' }}
          path: |
            dist/modernization-phase-2
            qa-artifacts/modernization-phase-2
          if-no-files-found: warn
          retention-days: 14
