name: SW-ART-008 Cow 17 Rigging

on:
  push:
    branches:
      - agent/sw-art-008-cow17-rigging
    paths:
      - tools/meshy/live-requests/cow17-rigging-v1.json

permissions:
  contents: read
  actions: read

concurrency:
  group: sw-art-008-cow17-rigging
  cancel-in-progress: false

jobs:
  rig-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact task source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prove exact base and bounded changed-file territory
        shell: bash
        run: |
          set -euo pipefail
          base='963a8a3a037bc738c22ae575cfc475e91061086c'
          test "$(git merge-base "$base" HEAD)" = "$base"
          git diff --name-only "$base"...HEAD | tee sw-art-008-changed-files.txt
          bad="$(grep -Ev '^(tools/meshy/sw-meshy-rigging\.mjs|tools/meshy/live-requests/cow17-rigging-v1\.json|scripts/verify-sw-art-008-cow17-rigging\.mjs|\.github/workflows/sw-art-008-cow17-rigging\.yml)$' sw-art-008-changed-files.txt || true)"
          if [ -n "$bad" ]; then
            echo 'SW-ART-008 changed files outside allowed tooling territory:' >&2
            echo "$bad" >&2
            exit 1
          fi

      - name: Block rerun credit spend
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_RUN_ATTEMPT}" != '1' ]; then
            echo 'SW-ART-008 rigging must not be rerun; create a new reviewed request commit instead.' >&2
            exit 1
          fi

      - name: Resolve exactly one reviewed rigging request
        id: request
        shell: bash
        env:
          MESHY_API_KEY: ${{ secrets.Meshy_API }}
        run: |
          set -euo pipefail
          test -n "$MESHY_API_KEY" || { echo 'GitHub Actions secret Meshy_API is missing or empty.' >&2; exit 1; }
          request_file='tools/meshy/live-requests/cow17-rigging-v1.json'
          test -f "$request_file"
          changed="$(git diff-tree --root --no-commit-id --name-only -r "$GITHUB_SHA" -- "$request_file")"
          test "$changed" = "$request_file" || { echo 'Launch commit must change exactly the reviewed SW-ART-008 request file.' >&2; exit 1; }
          REQUEST_FILE="$request_file" node - <<'NODE'
          const fs = require('fs');
          const request = JSON.parse(fs.readFileSync(process.env.REQUEST_FILE, 'utf8'));
          const fail = (message) => { throw new Error(message); };
          if (request.version !== 'SW_MESHY_RIGGING_LIVE_REQUEST_V1') fail(`Unexpected version: ${request.version}`);
          if (request.productionAuthority !== 'candidate only') fail('Output must remain candidate only.');
          if (request.source?.recoveryRunId !== 31908595053 || request.source?.recoveryArtifactId !== 9253031593) fail('Source must be exact SW-ART-007 recovery artifact.');
          if (request.source?.glbPath !== 'art-source/generated/meshy/cow17-textured-v1-recovered/cow17-textured-v1.glb') fail('Unexpected recovered GLB path.');
          if (request.source?.expectedGlbSha256 !== '7e5bdc2ecf0799c7759ed2d4bc1f6dd3b49ecaf21b4ba4a5308e3a8a9e03bd90') fail('Unexpected recovered GLB SHA.');
          if (request.meshy?.endpoint !== 'rigging') fail('SW-ART-008 requires rigging endpoint.');
          if (request.meshy?.inputTaskId !== '01a0073a-779e-768e-9f0f-46f4e27347a5') fail('SW-ART-008 requires exact recovered Retexture task.');
          if (request.costGuard?.authorizedTasks !== 1 || request.costGuard?.maxCredits !== 5) fail('SW-ART-008 cost guard violated.');
          const values = {
            request_file: process.env.REQUEST_FILE,
            request_id: request.id,
            source_run_id: request.source.recoveryRunId,
            source_artifact_id: request.source.recoveryArtifactId,
            source_glb_path: request.source.glbPath,
            output_dir: request.output.dir,
          };
          for (const [key, value] of Object.entries(values)) {
            if (String(value).includes('\n')) fail(`Multiline workflow output rejected: ${key}`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `${key}=${value}\n`);
          }
          console.log(`SW-ART-008 request contract PASS: ${request.id}`);
          NODE

      - name: Verify Cow 17 rigging tooling before spend
        run: node scripts/verify-sw-art-008-cow17-rigging.mjs

      - name: Preserve existing Meshy and authored-asset contracts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-sw-art-003-meshy-pipeline.mjs
          node scripts/verify-sw-art-006-refined-face-meshy.mjs
          node scripts/verify-sw-art-007-cow17-texture.mjs
          node scripts/verify-threejs-asset-pipeline.mjs

      - name: Download exact recovered textured Cow 17 artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.request.outputs.source_artifact_id }}
          path: sw-art-008-source
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.request.outputs.source_run_id }}
          merge-multiple: true

      - name: Prove exact recovered textured Cow 17 source
        id: source
        shell: bash
        env:
          REQUEST_FILE: ${{ steps.request.outputs.request_file }}
          SOURCE_GLB_PATH: ${{ steps.request.outputs.source_glb_path }}
        run: |
          set -euo pipefail
          full_path="sw-art-008-source/$SOURCE_GLB_PATH"
          test -s "$full_path"
          ACTUAL_PATH="$full_path" REQUEST_FILE="$REQUEST_FILE" node - <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const request = JSON.parse(fs.readFileSync(process.env.REQUEST_FILE, 'utf8'));
          const bytes = fs.readFileSync(process.env.ACTUAL_PATH);
          const sha = crypto.createHash('sha256').update(bytes).digest('hex');
          if (sha !== request.source.expectedGlbSha256) throw new Error(`Recovered textured GLB SHA mismatch: ${sha}`);
          if (bytes.subarray(0, 4).toString('ascii') !== 'glTF' || bytes.readUInt32LE(4) !== 2) throw new Error('Recovered textured source is not GLB 2.0.');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `full_path=${process.env.ACTUAL_PATH}\n`);
          console.log(`Exact recovered textured Cow 17 PASS: ${sha}`);
          NODE

      - name: Exercise no-credit rigging dry run
        shell: bash
        env:
          MESHY_API_KEY: ''
          REQUEST_FILE: ${{ steps.request.outputs.request_file }}
        run: |
          set -euo pipefail
          node tools/meshy/sw-meshy-rigging.mjs \
            --request "$REQUEST_FILE" \
            --output-dir "${{ steps.request.outputs.output_dir }}" \
            --dry-run > sw-art-008-meshy-rigging-dry-run.json
          test -s sw-art-008-meshy-rigging-dry-run.json

      - name: Rig Cow 17 once
        shell: bash
        env:
          MESHY_API_KEY: ${{ secrets.Meshy_API }}
          REQUEST_FILE: ${{ steps.request.outputs.request_file }}
        run: |
          set -euo pipefail
          node tools/meshy/sw-meshy-rigging.mjs \
            --request "$REQUEST_FILE" \
            --output-dir "${{ steps.request.outputs.output_dir }}"
          test -s "${{ steps.request.outputs.output_dir }}/cow17-rigged-v1.glb"
          test -s "${{ steps.request.outputs.output_dir }}/cow17-walking-v1.glb"
          test -s "${{ steps.request.outputs.output_dir }}/cow17-running-v1.glb"
          test -s "${{ steps.request.outputs.output_dir }}/sw-art-008-glb-inspection.json"
          test -s "${{ steps.request.outputs.output_dir }}/sw-art-008-receipt.json"

      - name: Record exact rigging output hashes
        shell: bash
        env:
          SOURCE_GLB: ${{ steps.source.outputs.full_path }}
        run: |
          set -euo pipefail
          sha256sum \
            "$SOURCE_GLB" \
            "${{ steps.request.outputs.output_dir }}/cow17-rigged-v1.glb" \
            "${{ steps.request.outputs.output_dir }}/cow17-walking-v1.glb" \
            "${{ steps.request.outputs.output_dir }}/cow17-running-v1.glb" \
            | tee sw-art-008-sha256.txt

      - name: Upload rigged Cow 17 evidence
        uses: actions/upload-artifact@v4
        with:
          name: sw-art-008-${{ steps.request.outputs.request_id }}
          retention-days: 30
          if-no-files-found: error
          path: |
            sw-art-008-static-report.json
            sw-art-008-changed-files.txt
            sw-art-008-meshy-rigging-dry-run.json
            sw-art-008-sha256.txt
            ${{ steps.source.outputs.full_path }}
            ${{ steps.request.outputs.output_dir }}/cow17-rigged-v1.glb
            ${{ steps.request.outputs.output_dir }}/cow17-walking-v1.glb
            ${{ steps.request.outputs.output_dir }}/cow17-running-v1.glb
            ${{ steps.request.outputs.output_dir }}/sw-art-008-task-created.json
            ${{ steps.request.outputs.output_dir }}/sw-art-008-task-final.json
            ${{ steps.request.outputs.output_dir }}/sw-art-008-glb-inspection.json
            ${{ steps.request.outputs.output_dir }}/sw-art-008-receipt.json
            threejs-asset-pipeline-static-report.json
