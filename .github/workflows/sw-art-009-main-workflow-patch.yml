name: SW-ART-009 Patch Main Evidence Workflow

on:
  push:
    branches:
      - agent/sw-art-009-cow17-runtime-integration
    paths:
      - tools/art/live-requests/cow17-main-workflow-patch-v1.json

permissions:
  contents: write

concurrency:
  group: sw-art-009-main-workflow-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/sw-art-009-cow17-runtime-integration

      - name: Prove reviewed patch launch
        shell: bash
        run: |
          set -euo pipefail
          base='de2e62835e79567b4bbfc079a372ce2af4ee0879'
          test "$(git merge-base "$base" HEAD)" = "$base"
          test "${GITHUB_RUN_ATTEMPT}" = '1'
          request='tools/art/live-requests/cow17-main-workflow-patch-v1.json'
          test -s "$request"
          test "$(git diff-tree --root --no-commit-id --name-only -r "$GITHUB_SHA" -- "$request")" = "$request"

      - name: Patch permanent Moo parity gate
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/tmp-sw-art-009-patch-main.py
          grep -F 'Prove inherited Moo Level parity against accepted base' .github/workflows/sw-art-009-cow17-runtime.yml
          grep -F 'SW_ART_009_MOO_LEVEL_PARITY_V1' .github/workflows/sw-art-009-cow17-runtime.yml
          grep -F 'qa-artifacts/sw-art-009/moo-level-parity.json' .github/workflows/sw-art-009-cow17-runtime.yml

      - name: Remove temporary probe and patch controls
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/sw-art-009-moo-parity-probe.yml \
            tools/art/live-requests/cow17-moo-parity-probe-v1.json \
            .github/workflows/sw-art-009-main-workflow-patch.yml \
            tools/art/live-requests/cow17-main-workflow-patch-v1.json \
            scripts/tmp-sw-art-009-patch-main.py

      - name: Commit permanent evidence-gate correction
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ci(sw-art-009): compare Moo QA against accepted baseline'
          git push origin HEAD:agent/sw-art-009-cow17-runtime-integration
