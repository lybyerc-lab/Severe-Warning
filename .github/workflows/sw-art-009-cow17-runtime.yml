name: SW-ART-009 Cow 17 Simple Runtime Proof

on:
  push:
    branches:
      - agent/sw-art-009-cow17-runtime-integration
    paths:
      - tools/art/live-requests/cow17-runtime-qa-v2.json

permissions:
  contents: read

concurrency:
  group: sw-art-009-cow17-simple-proof
  cancel-in-progress: true

jobs:
  prove-cow17:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact Cow 17 candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove exact task scope and one-shot launch
        shell: bash
        run: |
          set -euo pipefail
          base='de2e62835e79567b4bbfc079a372ce2af4ee0879'
          request='tools/art/live-requests/cow17-runtime-qa-v2.json'
          test "$(git merge-base "$base" HEAD)" = "$base"
          test "${GITHUB_RUN_ATTEMPT}" = '1' || { echo 'Create a fresh reviewed request instead of rerunning.' >&2; exit 1; }
          test -s "$request"
          changed_launch="$(git diff-tree --root --no-commit-id --name-only -r "$GITHUB_SHA" -- "$request")"
          test "$changed_launch" = "$request" || { echo 'Launch commit must change only the reviewed Cow QA request.' >&2; exit 1; }
          git diff --name-only "$base"...HEAD | tee sw-art-009-changed-files.txt
          bad="$(grep -Ev '^(\.gitattributes|\.github/workflows/sw-art-009-cow17-runtime\.yml|assets/production/asset-provenance\.json|assets/production/characters/cow17-walking-v1\.glb|runtime/vendor/GLTFLoader-r128\.js|runtime/vendor/THREE-LICENSE\.txt|runtime/sw-art-009-cow17-runtime\.js|scripts/build-web\.mjs|scripts/verify-sw-art-009-cow17-runtime\.mjs|scripts/qa-sw-art-009-cow17-runtime\.mjs|tools/art/live-requests/cow17-runtime-qa-v2\.json)$' sw-art-009-changed-files.txt || true)"
          if [ -n "$bad" ]; then
            echo 'Files outside the Cow 17 task:' >&2
            echo "$bad" >&2
            exit 1
          fi

      - name: Set up Node.js 22 and frozen dependencies
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frozen dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --global pnpm@11.9.0
          pnpm install --frozen-lockfile

      - name: Run small static Cow 17 proof
        shell: bash
        run: |
          set -euo pipefail
          node --check runtime/sw-art-009-cow17-runtime.js
          node --check scripts/build-web.mjs
          node --check scripts/verify-sw-art-009-cow17-runtime.mjs
          node --check scripts/qa-sw-art-009-cow17-runtime.mjs
          node scripts/verify-sw-art-009-cow17-runtime.mjs

      - name: Prepare deterministic local build assets
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo timeout 120s apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
            sudo timeout 120s apt-get install --yes --no-install-recommends ffmpeg
          fi
          timeout 180s pnpm run audio:generate
          timeout 60s node scripts/vendor-threejs-hero-slice4-assets.mjs

      - name: Assemble exact accepted Stage 2B source
        shell: bash
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/sw-art-009-candidate.html"
          cp MechanicsLab/SevereWeather_3D_Lab.html "$source"
          export SEVERE_WEATHER_SOURCE_PATH="$source"
          initial_scripts=(
            apply-v431-source-patch.mjs
            apply-v440-source-patch.mjs
            apply-v441-source-patch.mjs
            apply-v442-source-patch.mjs
            fix-v450-parser.mjs
            apply-v450-source-patch.mjs
            apply-v450-rampage-music-patch.mjs
            apply-qa-corrections-patch.mjs
            apply-audio-mix-followup-patch.mjs
            apply-ui-polish-followup-patch.mjs
            apply-score-continuity-fix.mjs
            apply-qa4-deterministic-lab-patch.mjs
            apply-qa4-mobile-input-fix.mjs
            apply-qa4-run-lock-fix.mjs
            apply-qa4-pause-forensics.mjs
            apply-pause-overlay-hit-test-fix.mjs
            apply-pause-overlay-hard-hide.mjs
            apply-qa4-popup-assertion-fix.mjs
            apply-qa4-rampage-popup-fix.mjs
            apply-v500-campaign-patch.mjs
            apply-v500-realtime-clock-fix.mjs
            apply-v500-world-tour-patch.mjs
            apply-v500-mobile-layout-fix.mjs
            apply-v500-cow-signature-patch.mjs
            apply-v510-production-slice.mjs
            apply-modernization-phase2-clocks.mjs
            apply-phase2-player-forensics-guard.mjs
            apply-modernization-phase3-input-abilities.mjs
            apply-modernization-phase4-scoring-campaign.mjs
            apply-modernization-phase5-presentation-world.mjs
            apply-modernization-phase6-performance.mjs
            apply-city-fabric-destruction.mjs
            apply-presentation-identity-moo-brew.mjs
            apply-threejs-asset-pipeline.mjs
            apply-threejs-visual-foundation.mjs
            apply-threejs-hero-slice4.mjs
            apply-threejs-hero-slice5.mjs
            apply-threejs-hero-slice6.mjs
            apply-sw-game-002-moo-level.mjs
            apply-sw-ui-001-newspaper-presentation.mjs
            apply-sw-score-001-persistent-scorekeeper.mjs
            apply-sw-rpg-001-moolah-storm-triangle.mjs
            apply-sw-rpg-002-slingshot.mjs
            apply-sw-level-001-storm-site-framework.mjs
            apply-sw-ui-002-landscape-unleash.mjs
            apply-sw-quality-001-owner-playtest-rescue.mjs
          )
          overlay_scripts=(
            apply-sw-quality-002-visual-rescue.mjs
            apply-sw-quality-002-storm-frame-bridge.mjs
            apply-sw-ui-003-run-shell-identity.mjs
            apply-sw-ui-004-gameplay-product-identity.mjs
            apply-sw-world-007-secondary-storm-forms.mjs
            apply-sw-world-007-atmospheric-correction.mjs
            apply-sw-world-007-visibility-lock.mjs
            apply-sw-world-007-secondary-exclusive.mjs
            apply-sw-feel-001-destruction-consequence.mjs
            apply-sw-feel-001-structural-anatomy.mjs
            apply-sw-feel-001-structural-priority.mjs
            apply-sw-ui-005-field-controls.mjs
          )
          for script in "${initial_scripts[@]}"; do node "scripts/$script"; done
          for script in "${overlay_scripts[@]}"; do node "scripts/$script"; done
          test -s "$source"
          grep -F 'V500_BOVINE_SIGNATURE_V1' "$source"
          grep -F 'SW_FEEL_001_DESTRUCTION_CONSEQUENCE_V1' "$source"
          echo "SEVERE_WEATHER_SOURCE_PATH=$source" >> "$GITHUB_ENV"

      - name: Verify protected Cow seam and build
        shell: bash
        run: |
          set -euo pipefail
          pnpm run verify:process
          pnpm run verify:v500
          pnpm run verify:asset-pipeline
          pnpm run modern:typecheck
          pnpm run build
          test -s www/index.html
          test -s www/assets/production/characters/cow17-walking-v1.glb
          cmp -s assets/production/characters/cow17-walking-v1.glb www/assets/production/characters/cow17-walking-v1.glb
          grep -F '[SW:SOURCE:GLTFLoader-r128.js]' www/index.html
          grep -F '[SW:SOURCE:sw-art-009-cow17-runtime.js]' www/index.html
          grep -F 'SW_COW17_RUNTIME_ASSET_V2' www/index.html
          node - <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const expected = 'd5bb4e47a12fde652808a53fdcb3dfddf71b944f2efb6641bf18ce8ac5c82a93';
          const bytes = fs.readFileSync('www/assets/production/characters/cow17-walking-v1.glb');
          const sha = crypto.createHash('sha256').update(bytes).digest('hex');
          if (sha !== expected || bytes.length !== 14412828) throw new Error('Packaged Cow 17 identity changed.');
          const info = JSON.parse(fs.readFileSync('www/build-info.json', 'utf8'));
          if (info.renderer !== 'Three.js r128') throw new Error(`Renderer changed: ${info.renderer}`);
          if (info.cow17Loader?.gitBlob !== 'cfa518ede1b0893f1da14347d78fcd19355f3686') throw new Error('Official loader identity missing from build-info.');
          NODE

      - name: Install Chromium
        shell: bash
        run: npx playwright install chromium

      - name: Run focused Cow 17 browser proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-artifacts/sw-art-009/cow17
          python3 -m http.server 4173 --directory www > qa-artifacts/sw-art-009/cow17-server.log 2>&1 &
          SERVER_PID=$!
          cleanup() { kill "$SERVER_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          for attempt in $(seq 1 80); do
            if curl --silent --fail 'http://127.0.0.1:4173/' > /dev/null; then break; fi
            sleep 0.25
          done
          curl --silent --fail 'http://127.0.0.1:4173/' > /dev/null
          env \
            SEVERE_WEATHER_QA_URL='http://127.0.0.1:4173/' \
            SEVERE_WEATHER_QA_DIR='qa-artifacts/sw-art-009/cow17' \
            node scripts/qa-sw-art-009-cow17-runtime.mjs

      - name: Upload exact candidate and visual proof
        uses: actions/upload-artifact@v4
        with:
          name: sw-art-009-cow17-simple-candidate
          retention-days: 30
          if-no-files-found: error
          path: |
            www
            sw-art-009-static-report.json
            sw-art-009-changed-files.txt
            qa-artifacts/sw-art-009/cow17
            qa-artifacts/sw-art-009/cow17-server.log
