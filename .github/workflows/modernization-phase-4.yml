name: Modernization Phase 4 Scoring Campaign and Persistence

on:
  workflow_dispatch:
  push:
    branches:
      - agent/phase4-scoring-campaign-antigravity
  pull_request:
    branches:
      - agent/phase3-knowledge-antigravity-handoff

permissions:
  contents: read

concurrency:
  group: modernization-phase-4-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-package:
    name: Build, verify, and package scoring migration
    runs-on: ubuntu-24.04
    timeout-minutes: 65

    steps:
      - name: Check out Phase 4 branch
        uses: actions/checkout@v6

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Install frozen dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          npm install --global pnpm@11.9.0
          pnpm install --frozen-lockfile

      - name: Verify clean historical source and script syntax
        shell: bash
        run: |
          grep -F '<title>Severe Weather 3D Lab v4.3.0 - Rampage Layer</title>' MechanicsLab/SevereWeather_3D_Lab.html
          if grep -F 'V510_THREEJS_PRODUCTION_SLICE_V1' MechanicsLab/SevereWeather_3D_Lab.html; then
            echo 'Generated V5.1 output was committed over the historical source baseline.' >&2
            exit 1
          fi
          node --check scripts/apply-modernization-phase2-clocks.mjs
          node --check scripts/apply-phase2-player-forensics-guard.mjs
          node --check scripts/apply-modernization-phase3-input-abilities.mjs
          node --check scripts/apply-modernization-phase4-scoring-campaign.mjs
          node --check scripts/verify-modernization-phase2-clocks.mjs
          node --check scripts/verify-modernization-phase3-input-abilities.mjs
          node --check scripts/verify-modernization-phase4-scoring-campaign.mjs
          node --check scripts/qa-modernization-phase2-clocks.mjs
          node --check scripts/qa-modernization-phase3-input-abilities.mjs
          node --check scripts/qa-modernization-phase4-scoring-campaign.mjs
          node --check runtime/modernization-phase3-input-abilities.js
          node --check runtime/modernization-phase4-scoring-campaign.js
          npm run modern:typecheck

      - name: Generate verified audio
        run: npm run audio:generate

      - name: Apply accepted gameplay chain
        shell: bash
        run: |
          npm run patch:v431
          npm run patch:v440
          npm run patch:v441
          npm run patch:v442
          npm run patch:v450
          npm run patch:v500
          npm run verify:v500
          npm run patch:v510
          npm run verify:v510

      - name: Apply and verify modernization phases
        shell: bash
        run: |
          npm run patch:phase2
          npm run verify:phase2
          npm run patch:phase3
          npm run verify:phase3
          npm run patch:phase4
          npm run verify:phase4

      - name: Build modern shell and offline package
        shell: bash
        run: |
          npm run modern:build
          node scripts/build-web.mjs
          node scripts/stamp-qa-pages.mjs
          node scripts/verify-qa-package.mjs
          grep -F 'MODERNIZATION_PHASE4_SCORING_CAMPAIGN_V2' www/index.html
          grep -F 'phase-4-scoring-campaign' www/modern/modern-shell.js

      - name: Run inherited and Phase 4 browser QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-artifacts/modernization-phase-4
          python3 -m http.server 4173 --directory www > qa-artifacts/modernization-phase-4/server.log 2>&1 &
          SERVER_PID=$!
          cleanup() { kill "$SERVER_PID" 2>/dev/null || true; }
          trap cleanup EXIT

          for attempt in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 0.25
          done
          curl --silent --fail http://127.0.0.1:4173/ > /dev/null

          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          CHROME_BIN="$CHROME_BIN" SEVERE_WEATHER_QA_DIR="qa-artifacts/modernization-phase-4/visual" npm run qa:v510
          CHROME_BIN="$CHROME_BIN" SEVERE_WEATHER_QA_DIR="qa-artifacts/modernization-phase-4/clocks" npm run qa:phase2
          CHROME_BIN="$CHROME_BIN" SEVERE_WEATHER_QA_DIR="qa-artifacts/modernization-phase-4/controls" npm run qa:phase3
          CHROME_BIN="$CHROME_BIN" SEVERE_WEATHER_QA_DIR="qa-artifacts/modernization-phase-4/scoring-campaign" npm run qa:phase4

      - name: Synchronize Android assets
        shell: bash
        run: |
          node node_modules/@capacitor/cli/bin/capacitor sync android
          cmp -s www/index.html android/app/src/main/assets/public/index.html
          cmp -s www/modern/modern-shell.js android/app/src/main/assets/public/modern/modern-shell.js

      - name: Assemble debug APK
        shell: bash
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Package Phase 4 evidence
        id: package
        shell: bash
        run: |
          set -euo pipefail
          source_commit="${{ github.event.pull_request.head.sha || github.sha }}"
          output_dir="dist/modernization-phase-4"
          mkdir -p "$output_dir"

          source_apk="android/app/build/outputs/apk/debug/app-debug.apk"
          output_apk="$output_dir/Severe-Weather-v5.1.0-Phase-4-Scoring-Campaign-${GITHUB_RUN_NUMBER}.apk"
          test -s "$source_apk"
          cp "$source_apk" "$output_apk"
          sha256sum "$output_apk" | tee "$output_apk.sha256"

          cp -R www "$output_dir/web-preview"
          cp -R qa-artifacts/modernization-phase-4 "$output_dir/qa-evidence"
          cat > "$output_dir/package-manifest.json" <<MANIFEST
          {
            "sourceBranch": "agent/phase4-scoring-campaign-antigravity",
            "sourceCommit": "$source_commit",
            "workflowRun": $GITHUB_RUN_NUMBER,
            "versionName": "5.1.0",
            "renderer": "Three.js r128",
            "architecture": "modern-shell-v1",
            "modernizationPhase": "phase-4-scoring-campaign",
            "phase4Bridge": "MODERNIZATION_PHASE4_SCORING_CAMPAIGN_V2",
            "storageKey": "severe_weather_campaign_v1",
            "apkFile": "$(basename "$output_apk")",
            "apkSha256": "$(sha256sum "$output_apk" | awk '{print $1}')"
          }
          MANIFEST
          echo "artifact_name=severe-weather-modernization-phase-4-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Upload Phase 4 bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.artifact_name || 'severe-weather-modernization-phase-4-diagnostics' }}
          path: |
            dist/modernization-phase-4
            qa-artifacts/modernization-phase-4
          if-no-files-found: warn
          retention-days: 14
