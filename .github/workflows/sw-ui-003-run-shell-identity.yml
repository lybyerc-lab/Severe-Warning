name: SW-UI-003 Run Shell Identity

on:
  push:
    branches:
      - agent/sw-ui-003-run-shell-identity
  pull_request:
    branches:
      - main
      - agent/sw-ui-003-run-shell-identity

permissions:
  contents: read

jobs:
  verify-and-qa:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate

      - name: Install dependencies and Chromium
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Prepare deterministic local assets
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          pnpm run audio:generate

      - name: Run SW-UI-003 Static Verifier
        run: pnpm run verify:sw-ui-003

      - name: Run SW-UI-003 Browser QA Suite
        run: pnpm run qa:sw-ui-003

      - name: Upload QA Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sw-ui-003-qa-artifacts
          path: qa-artifacts/sw-ui-003-run-shell/
          if-no-files-found: warn
