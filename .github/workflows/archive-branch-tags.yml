name: Archive branch tags

# Create one archive/<branch> tag per remote branch, so branches can be deleted
# without losing their history.
#
# This runs as a workflow rather than from a QA session because agent sessions
# reach GitHub through a proxy that refuses ref writes outright:
#   "Write access to this GitHub API path is not permitted through this proxy."
# and their git credential is scoped to the qa branch, so `git push --tags`
# comes back 403. A workflow has the repository's own token and is not proxied.
#
# Tags are what keep commits reachable. Docs/BRANCH_ARCHIVE_MANIFEST.md records
# the SHAs, but a list of SHAs does not stop garbage collection - so nothing
# should be deleted until this has run and the tags are confirmed.

# Two triggers on purpose.
#
# workflow_dispatch is the one you want. GitHub only registers dispatchable
# workflows from the DEFAULT branch; that default is now `qa`, so this workflow
# does appear in the Actions tab and can be dispatched normally. It was not
# always so -- while `main` was still default this file was invisible there and
# dispatching returned 404, which is why the push trigger below exists.
#
# `push` has no such requirement: a workflow on the pushed branch runs. It is
# kept as a fallback, and because writing to .github/archive-tags.trigger is
# still the only lever available from a session scoped to the qa branch.
#
# Put `apply` in that file to create tags. Anything else is a dry run.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'List what would be tagged without creating anything'
        type: boolean
        default: true
  push:
    branches: [qa]
    paths:
      - '.github/archive-tags.trigger'
      - '.github/workflows/archive-branch-tags.yml'

permissions:
  contents: write

concurrency:
  group: archive-branch-tags
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out with full history and all branches
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create archive tags
        shell: bash
        env:
          DISPATCH_DRY_RUN: ${{ inputs.dry_run }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'

          # On dispatch the checkbox decides. On push the trigger file decides,
          # so that a session which can only write to qa can still say "apply"
          # deliberately rather than having every push create refs.
          if [ "$EVENT" = "push" ]; then
            want="$(tr -d '[:space:]' < .github/archive-tags.trigger 2>/dev/null || echo dry)"
            if [ "$want" = "apply" ]; then DRY_RUN=false; else DRY_RUN=true; fi
            echo "push trigger: .github/archive-tags.trigger says '$want' -> dry_run=$DRY_RUN"
          else
            DRY_RUN="${DISPATCH_DRY_RUN:-true}"
          fi

          created=0
          existing=0
          planned=0

          while read -r ref; do
            branch="${ref#refs/remotes/origin/}"
            [ "$branch" = "HEAD" ] && continue
            # qa is the live trunk; it is not archived.
            [ "$branch" = "qa" ] && continue

            tag="archive/$branch"
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              existing=$((existing + 1))
              continue
            fi

            if [ "$DRY_RUN" = "true" ]; then
              echo "would tag $tag -> $(git rev-parse --short "origin/$branch")"
              planned=$((planned + 1))
            else
              git tag "$tag" "origin/$branch"
              created=$((created + 1))
            fi
          done < <(git for-each-ref --format='%(refname)' refs/remotes/origin)

          if [ "$DRY_RUN" = "true" ]; then
            echo "DRY RUN: $planned tag(s) would be created, $existing already present."
            echo "Re-run with dry_run unchecked to create them."
            exit 0
          fi

          echo "created $created tag(s), $existing already present"
          [ "$created" -gt 0 ] && git push origin --tags

          echo "archive tags on remote: $(git ls-remote --tags origin | grep -c 'refs/tags/archive/' || true)"
