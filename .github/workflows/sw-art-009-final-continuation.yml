name: SW-ART-009 Final Continuation

on:
  push:
    branches:
      - agent/sw-art-009-cow17-runtime-integration
    paths:
      - tools/art/live-requests/cow17-final-continuation-v1.json

permissions:
  contents: read

concurrency:
  group: sw-art-009-final-continuation
  cancel-in-progress: true

jobs:
  continuation:
    name: Finish Cow 17 inherited QA and performance evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove exact task base and continuation-only launch
        shell: bash
        run: |
          set -euo pipefail
          base='de2e62835e79567b4bbfc079a372ce2af4ee0879'
          test "$(git merge-base "$base" HEAD)" = "$base"
          test "${GITHUB_RUN_ATTEMPT}" = '1' || { echo 'Continuation reruns are forbidden; create a fresh reviewed request commit.' >&2; exit 1; }
          request='tools/art/live-requests/cow17-final-continuation-v1.json'
          test -s "$request"
          test "$(git diff-tree --root --no-commit-id --name-only -r "$GITHUB_SHA" -- "$request")" = "$request" || { echo 'Launch commit must change exactly the reviewed continuation request.' >&2; exit 1; }
          git diff --name-only "$base"...HEAD | tee sw-art-009-continuation-changed-files.txt
          bad="$(grep -Ev '^(\.gitattributes|\.github/workflows/sw-art-009-cow17-asset-intake\.yml|\.github/workflows/sw-art-009-cow17-runtime\.yml|\.github/workflows/sw-art-009-cow17-final-evidence\.yml|\.github/workflows/sw-art-009-final-continuation\.yml|assets/production/asset-provenance\.json|assets/production/characters/cow17-walking-v1\.glb|runtime/sw-art-009-cow17-runtime\.js|scripts/build-web\.mjs|scripts/verify-sw-art-009-cow17-runtime\.mjs|scripts/qa-sw-art-009-cow17-runtime\.mjs|tools/art/live-requests/cow17-runtime-intake-v1\.json|tools/art/live-requests/cow17-runtime-qa-v1\.json|tools/art/live-requests/cow17-final-evidence-v1\.json|tools/art/live-requests/cow17-final-continuation-v1\.json)$' sw-art-009-continuation-changed-files.txt || true)"
          if [ -n "$bad" ]; then echo "$bad" >&2; exit 1; fi
          node - <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const p = 'assets/production/characters/cow17-walking-v1.glb';
          const b = fs.readFileSync(p);
          const sha = crypto.createHash('sha256').update(b).digest('hex');
          if (sha !== 'd5bb4e47a12fde652808a53fdcb3dfddf71b944f2efb6641bf18ce8ac5c82a93') throw new Error(`Cow 17 source drift: ${sha}`);
          if (b.length !== 14412828) throw new Error(`Cow 17 byte drift: ${b.length}`);
          NODE

      - name: Checkout accepted canonical
        uses: actions/checkout@v4
        with:
          ref: de2e62835e79567b4bbfc079a372ce2af4ee0879
          path: accepted-base
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frozen dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --global pnpm@11.9.0
          pnpm install --frozen-lockfile
          pnpm --dir accepted-base install --frozen-lockfile

      - name: Prepare deterministic local assets
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo timeout 120s apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
            sudo timeout 120s apt-get install --yes --no-install-recommends ffmpeg
          fi
          timeout 180s pnpm run audio:generate
          timeout 60s node scripts/vendor-threejs-hero-slice4-assets.mjs
          (
            cd accepted-base
            timeout 180s pnpm run audio:generate
            timeout 60s node scripts/vendor-threejs-hero-slice4-assets.mjs
          )

      - name: Assemble accepted Stage 2B source on both sides
        shell: bash
        run: |
          set -euo pipefail
          initial_scripts=(
            apply-v431-source-patch.mjs apply-v440-source-patch.mjs apply-v441-source-patch.mjs apply-v442-source-patch.mjs
            fix-v450-parser.mjs apply-v450-source-patch.mjs apply-v450-rampage-music-patch.mjs apply-qa-corrections-patch.mjs
            apply-audio-mix-followup-patch.mjs apply-ui-polish-followup-patch.mjs apply-score-continuity-fix.mjs
            apply-qa4-deterministic-lab-patch.mjs apply-qa4-mobile-input-fix.mjs apply-qa4-run-lock-fix.mjs apply-qa4-pause-forensics.mjs
            apply-pause-overlay-hit-test-fix.mjs apply-pause-overlay-hard-hide.mjs apply-qa4-popup-assertion-fix.mjs apply-qa4-rampage-popup-fix.mjs
            apply-v500-campaign-patch.mjs apply-v500-realtime-clock-fix.mjs apply-v500-world-tour-patch.mjs apply-v500-mobile-layout-fix.mjs apply-v500-cow-signature-patch.mjs
            apply-v510-production-slice.mjs apply-modernization-phase2-clocks.mjs apply-phase2-player-forensics-guard.mjs
            apply-modernization-phase3-input-abilities.mjs apply-modernization-phase4-scoring-campaign.mjs apply-modernization-phase5-presentation-world.mjs apply-modernization-phase6-performance.mjs
            apply-city-fabric-destruction.mjs apply-presentation-identity-moo-brew.mjs apply-threejs-asset-pipeline.mjs apply-threejs-visual-foundation.mjs
            apply-threejs-hero-slice4.mjs apply-threejs-hero-slice5.mjs apply-threejs-hero-slice6.mjs apply-sw-game-002-moo-level.mjs
            apply-sw-ui-001-newspaper-presentation.mjs apply-sw-score-001-persistent-scorekeeper.mjs apply-sw-rpg-001-moolah-storm-triangle.mjs
            apply-sw-rpg-002-slingshot.mjs apply-sw-level-001-storm-site-framework.mjs apply-sw-ui-002-landscape-unleash.mjs apply-sw-quality-001-owner-playtest-rescue.mjs
          )
          overlay_scripts=(
            apply-sw-quality-002-visual-rescue.mjs apply-sw-quality-002-storm-frame-bridge.mjs apply-sw-ui-003-run-shell-identity.mjs apply-sw-ui-004-gameplay-product-identity.mjs
            apply-sw-world-007-secondary-storm-forms.mjs apply-sw-world-007-atmospheric-correction.mjs apply-sw-world-007-visibility-lock.mjs apply-sw-world-007-secondary-exclusive.mjs
            apply-sw-feel-001-destruction-consequence.mjs apply-sw-feel-001-structural-anatomy.mjs apply-sw-feel-001-structural-priority.mjs apply-sw-ui-005-field-controls.mjs
          )
          assemble_stack() {
            local root="$1" output="$2"
            cp "$root/MechanicsLab/SevereWeather_3D_Lab.html" "$output"
            (
              cd "$root"
              export SEVERE_WEATHER_SOURCE_PATH="$output"
              for script in "${initial_scripts[@]}"; do node "scripts/$script"; done
              for script in "${overlay_scripts[@]}"; do node "scripts/$script"; done
            )
          }
          candidate_source="$RUNNER_TEMP/sw-art-009-cont-candidate.html"
          base_source="$RUNNER_TEMP/sw-art-009-cont-base.html"
          assemble_stack '.' "$candidate_source"
          assemble_stack 'accepted-base' "$base_source"
          test -s "$candidate_source" && test -s "$base_source"
          echo "SEVERE_WEATHER_SOURCE_PATH=$candidate_source" >> "$GITHUB_ENV"
          echo "SW_ART_009_BASE_SOURCE_PATH=$base_source" >> "$GITHUB_ENV"

      - name: Build accepted base and Cow 17 candidate
        shell: bash
        run: |
          set -euo pipefail
          (
            cd accepted-base
            SEVERE_WEATHER_SOURCE_PATH="$SW_ART_009_BASE_SOURCE_PATH" pnpm run build
          )
          pnpm run build
          test -s accepted-base/www/index.html
          test -s www/index.html
          test ! -e accepted-base/www/assets/production/characters/cow17-walking-v1.glb
          cmp -s assets/production/characters/cow17-walking-v1.glb www/assets/production/characters/cow17-walking-v1.glb

      - name: Install Playwright Chromium
        shell: bash
        run: npx playwright install chromium

      - name: Prove Moo Level parity candidate-first on clean runner
        shell: bash
        run: |
          set -euo pipefail
          cleanup_browsers() { for name in headless_shell chrome chromium; do pkill -TERM -x "$name" 2>/dev/null || true; done; }
          cleanup_browsers
          mkdir -p qa-artifacts/sw-art-009-continuation/moo-candidate qa-artifacts/sw-art-009-continuation/moo-base
          python3 -m http.server 4172 --directory accepted-base/www > qa-artifacts/sw-art-009-continuation/moo-base-server.log 2>&1 &
          BASE_PID=$!
          python3 -m http.server 4173 --directory www > qa-artifacts/sw-art-009-continuation/moo-candidate-server.log 2>&1 &
          CANDIDATE_PID=$!
          cleanup() { kill "$BASE_PID" "$CANDIDATE_PID" 2>/dev/null || true; cleanup_browsers; }
          trap cleanup EXIT
          for port in 4172 4173; do
            for attempt in $(seq 1 80); do
              if curl --silent --fail "http://127.0.0.1:${port}/" > /dev/null; then break; fi
              sleep 0.25
            done
            curl --silent --fail "http://127.0.0.1:${port}/" > /dev/null
          done

          set +e
          env SEVERE_WEATHER_QA_URL='http://127.0.0.1:4173/' SEVERE_WEATHER_QA_DIR='qa-artifacts/sw-art-009-continuation/moo-candidate' pnpm run qa:sw-game-002 > qa-artifacts/sw-art-009-continuation/moo-candidate.log 2>&1
          CANDIDATE_STATUS=$?
          cleanup_browsers
          sleep 1
          (
            cd accepted-base
            env SEVERE_WEATHER_QA_URL='http://127.0.0.1:4172/' SEVERE_WEATHER_QA_DIR="$GITHUB_WORKSPACE/qa-artifacts/sw-art-009-continuation/moo-base" pnpm run qa:sw-game-002
          ) > qa-artifacts/sw-art-009-continuation/moo-base.log 2>&1
          BASE_STATUS=$?
          set -e
          cat qa-artifacts/sw-art-009-continuation/moo-candidate.log
          cat qa-artifacts/sw-art-009-continuation/moo-base.log

          BASE_STATUS="$BASE_STATUS" CANDIDATE_STATUS="$CANDIDATE_STATUS" node - <<'NODE'
          const fs = require('fs');
          const baseStatus = Number(process.env.BASE_STATUS);
          const candidateStatus = Number(process.env.CANDIDATE_STATUS);
          const basePath = 'qa-artifacts/sw-art-009-continuation/moo-base/report.json';
          const candidatePath = 'qa-artifacts/sw-art-009-continuation/moo-candidate/report.json';
          if (!fs.existsSync(candidatePath)) throw new Error('Cow 17 candidate did not reach a Moo report on clean candidate-first run.');
          if (!fs.existsSync(basePath)) throw new Error('Accepted base did not reach a Moo report on clean comparison run.');
          const base = JSON.parse(fs.readFileSync(basePath, 'utf8'));
          const candidate = JSON.parse(fs.readFileSync(candidatePath, 'utf8'));
          const failed = (r) => Object.entries(r.checks || {}).filter(([, ok]) => !ok).map(([name]) => name).sort();
          const b = failed(base), c = failed(candidate);
          const extra = c.filter((name) => !b.includes(name));
          if (extra.length) throw new Error(`Cow 17 adds Moo failures beyond accepted base: ${extra.join(', ')}`);
          if ((candidate.pageErrors || []).length > (base.pageErrors || []).length) throw new Error('Cow 17 adds Moo page errors.');
          if ((candidate.runtimeConsoleErrors || []).length > (base.runtimeConsoleErrors || []).length) throw new Error('Cow 17 adds Moo runtime console errors.');
          if (baseStatus === 0 && candidateStatus !== 0) throw new Error('Accepted base passes Moo QA while Cow 17 candidate fails.');
          const report = { version: 'SW_ART_009_CONTINUATION_MOO_PARITY_V1', baseStatus, candidateStatus, baseFailedChecks: b, candidateFailedChecks: c, candidateAddsFailures: false, verdict: candidateStatus === 0 ? 'candidate-passes' : 'candidate-matches-or-improves-accepted-baseline' };
          fs.writeFileSync('qa-artifacts/sw-art-009-continuation/moo-parity.json', `${JSON.stringify(report, null, 2)}\n`);
          console.log(`Moo parity PASS: ${report.verdict}; base=${b.join(',') || 'none'}; candidate=${c.join(',') || 'none'}`);
          NODE

      - name: Run inherited destruction-feel browser QA
        shell: bash
        run: |
          set -euo pipefail
          for name in headless_shell chrome chromium; do pkill -TERM -x "$name" 2>/dev/null || true; done
          sleep 1
          mkdir -p qa-artifacts/sw-art-009-continuation
          python3 -m http.server 4173 --directory www > qa-artifacts/sw-art-009-continuation/feel-server.log 2>&1 &
          SERVER_PID=$!
          cleanup() { kill "$SERVER_PID" 2>/dev/null || true; for name in headless_shell chrome chromium; do pkill -TERM -x "$name" 2>/dev/null || true; done; }
          trap cleanup EXIT
          for attempt in $(seq 1 80); do
            if curl --silent --fail 'http://127.0.0.1:4173/' > /dev/null; then break; fi
            sleep 0.25
          done
          curl --silent --fail 'http://127.0.0.1:4173/' > /dev/null
          SEVERE_WEATHER_QA_URL='http://127.0.0.1:4173/' pnpm run qa:sw-feel-001

      - name: Capture same-runner performance evidence
        shell: bash
        run: |
          set -euo pipefail
          for name in headless_shell chrome chromium; do pkill -TERM -x "$name" 2>/dev/null || true; done
          sleep 1
          mkdir -p qa-artifacts/sw-art-009-continuation/performance
          python3 -m http.server 4180 --directory accepted-base/www > qa-artifacts/sw-art-009-continuation/perf-base-server.log 2>&1 &
          BASE_PID=$!
          python3 -m http.server 4181 --directory www > qa-artifacts/sw-art-009-continuation/perf-candidate-server.log 2>&1 &
          CANDIDATE_PID=$!
          cleanup() { kill "$BASE_PID" "$CANDIDATE_PID" 2>/dev/null || true; for name in headless_shell chrome chromium; do pkill -TERM -x "$name" 2>/dev/null || true; done; }
          trap cleanup EXIT
          for port in 4180 4181; do
            for attempt in $(seq 1 80); do
              if curl --silent --fail "http://127.0.0.1:${port}/" > /dev/null; then break; fi
              sleep 0.25
            done
            curl --silent --fail "http://127.0.0.1:${port}/" > /dev/null
          done
          env SEVERE_WEATHER_BASE_URL='http://127.0.0.1:4180/' SEVERE_WEATHER_CANDIDATE_URL='http://127.0.0.1:4181/' SEVERE_WEATHER_PERF_DIR='qa-artifacts/sw-art-009-continuation/performance' pnpm run perf:phase6

      - name: Validate continuation evidence
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            qa-artifacts/sw-art-009-continuation/moo-candidate/report.json \
            qa-artifacts/sw-art-009-continuation/moo-base/report.json \
            qa-artifacts/sw-art-009-continuation/moo-parity.json \
            artifacts/feel-001-evidence/qa-report.json \
            qa-artifacts/sw-art-009-continuation/performance/baseline-report.json \
            qa-artifacts/sw-art-009-continuation/performance/candidate-report.json \
            qa-artifacts/sw-art-009-continuation/performance/comparison-report.json \
            www/build-info.json; do
            test -s "$file" || { echo "Missing continuation evidence: $file" >&2; exit 1; }
          done
          sha256sum assets/production/characters/cow17-walking-v1.glb www/assets/production/characters/cow17-walking-v1.glb | tee sw-art-009-continuation-cow17-sha256.txt

      - name: Upload continuation diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sw-art-009-continuation-diagnostics-${{ github.run_number }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            sw-art-009-continuation-changed-files.txt
            qa-artifacts/sw-art-009-continuation
            artifacts/feel-001-evidence
            www/build-info.json

      - name: Upload continuation evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sw-art-009-continuation-${{ github.run_number }}
          retention-days: 30
          if-no-files-found: error
          path: |
            sw-art-009-continuation-changed-files.txt
            sw-art-009-continuation-cow17-sha256.txt
            qa-artifacts/sw-art-009-continuation
            artifacts/feel-001-evidence
            www/build-info.json
