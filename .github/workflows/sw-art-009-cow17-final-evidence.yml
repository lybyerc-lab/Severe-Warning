name: SW-ART-009 Cow 17 Final Evidence

on:
  push:
    branches:
      - agent/sw-art-009-cow17-runtime-integration
    paths:
      - tools/art/live-requests/cow17-final-evidence-v1.json

permissions:
  contents: read

concurrency:
  group: sw-art-009-cow17-final-evidence
  cancel-in-progress: true

jobs:
  final-evidence:
    name: Verify final Cow 17 runtime integration
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove exact task base scope and one-shot launch
        shell: bash
        run: |
          set -euo pipefail
          base='de2e62835e79567b4bbfc079a372ce2af4ee0879'
          test "$(git merge-base "$base" HEAD)" = "$base"
          test "${GITHUB_RUN_ATTEMPT}" = '1' || { echo 'Final evidence reruns are forbidden; create a fresh reviewed request commit.' >&2; exit 1; }
          request='tools/art/live-requests/cow17-final-evidence-v1.json'
          test -s "$request"
          test "$(git diff-tree --root --no-commit-id --name-only -r "$GITHUB_SHA" -- "$request")" = "$request" || { echo 'Launch commit must change exactly the reviewed final-evidence request.' >&2; exit 1; }
          git diff --name-only "$base"...HEAD | tee sw-art-009-final-changed-files.txt
          bad="$(grep -Ev '^(\.gitattributes|\.github/workflows/sw-art-009-cow17-asset-intake\.yml|\.github/workflows/sw-art-009-cow17-runtime\.yml|\.github/workflows/sw-art-009-cow17-final-evidence\.yml|assets/production/asset-provenance\.json|assets/production/characters/cow17-walking-v1\.glb|runtime/sw-art-009-cow17-runtime\.js|scripts/build-web\.mjs|scripts/verify-sw-art-009-cow17-runtime\.mjs|scripts/qa-sw-art-009-cow17-runtime\.mjs|tools/art/live-requests/cow17-runtime-intake-v1\.json|tools/art/live-requests/cow17-runtime-qa-v1\.json|tools/art/live-requests/cow17-final-evidence-v1\.json)$' sw-art-009-final-changed-files.txt || true)"
          if [ -n "$bad" ]; then
            echo 'SW-ART-009 final evidence found files outside exact task territory:' >&2
            echo "$bad" >&2
            exit 1
          fi

      - name: Checkout accepted canonical for same-runner comparison
        uses: actions/checkout@v4
        with:
          ref: de2e62835e79567b4bbfc079a372ce2af4ee0879
          path: accepted-base
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frozen dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --global pnpm@11.9.0
          pnpm install --frozen-lockfile
          pnpm --dir accepted-base install --frozen-lockfile

      - name: Prepare deterministic local assets on base and candidate
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo timeout 120s apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
            sudo timeout 120s apt-get install --yes --no-install-recommends ffmpeg
          fi
          ffmpeg -version | head -n 1
          timeout 180s pnpm run audio:generate
          timeout 60s node scripts/vendor-threejs-hero-slice4-assets.mjs
          (
            cd accepted-base
            timeout 180s pnpm run audio:generate
            timeout 60s node scripts/vendor-threejs-hero-slice4-assets.mjs
          )

      - name: Assemble exact accepted Stage 2B source on base and candidate
        shell: bash
        run: |
          set -euo pipefail
          initial_scripts=(
            apply-v431-source-patch.mjs
            apply-v440-source-patch.mjs
            apply-v441-source-patch.mjs
            apply-v442-source-patch.mjs
            fix-v450-parser.mjs
            apply-v450-source-patch.mjs
            apply-v450-rampage-music-patch.mjs
            apply-qa-corrections-patch.mjs
            apply-audio-mix-followup-patch.mjs
            apply-ui-polish-followup-patch.mjs
            apply-score-continuity-fix.mjs
            apply-qa4-deterministic-lab-patch.mjs
            apply-qa4-mobile-input-fix.mjs
            apply-qa4-run-lock-fix.mjs
            apply-qa4-pause-forensics.mjs
            apply-pause-overlay-hit-test-fix.mjs
            apply-pause-overlay-hard-hide.mjs
            apply-qa4-popup-assertion-fix.mjs
            apply-qa4-rampage-popup-fix.mjs
            apply-v500-campaign-patch.mjs
            apply-v500-realtime-clock-fix.mjs
            apply-v500-world-tour-patch.mjs
            apply-v500-mobile-layout-fix.mjs
            apply-v500-cow-signature-patch.mjs
            apply-v510-production-slice.mjs
            apply-modernization-phase2-clocks.mjs
            apply-phase2-player-forensics-guard.mjs
            apply-modernization-phase3-input-abilities.mjs
            apply-modernization-phase4-scoring-campaign.mjs
            apply-modernization-phase5-presentation-world.mjs
            apply-modernization-phase6-performance.mjs
            apply-city-fabric-destruction.mjs
            apply-presentation-identity-moo-brew.mjs
            apply-threejs-asset-pipeline.mjs
            apply-threejs-visual-foundation.mjs
            apply-threejs-hero-slice4.mjs
            apply-threejs-hero-slice5.mjs
            apply-threejs-hero-slice6.mjs
            apply-sw-game-002-moo-level.mjs
            apply-sw-ui-001-newspaper-presentation.mjs
            apply-sw-score-001-persistent-scorekeeper.mjs
            apply-sw-rpg-001-moolah-storm-triangle.mjs
            apply-sw-rpg-002-slingshot.mjs
            apply-sw-level-001-storm-site-framework.mjs
            apply-sw-ui-002-landscape-unleash.mjs
            apply-sw-quality-001-owner-playtest-rescue.mjs
          )
          overlay_scripts=(
            apply-sw-quality-002-visual-rescue.mjs
            apply-sw-quality-002-storm-frame-bridge.mjs
            apply-sw-ui-003-run-shell-identity.mjs
            apply-sw-ui-004-gameplay-product-identity.mjs
            apply-sw-world-007-secondary-storm-forms.mjs
            apply-sw-world-007-atmospheric-correction.mjs
            apply-sw-world-007-visibility-lock.mjs
            apply-sw-world-007-secondary-exclusive.mjs
            apply-sw-feel-001-destruction-consequence.mjs
            apply-sw-feel-001-structural-anatomy.mjs
            apply-sw-feel-001-structural-priority.mjs
            apply-sw-ui-005-field-controls.mjs
          )
          assemble_stack() {
            local root="$1"
            local output="$2"
            cp "$root/MechanicsLab/SevereWeather_3D_Lab.html" "$output"
            (
              cd "$root"
              export SEVERE_WEATHER_SOURCE_PATH="$output"
              for script in "${initial_scripts[@]}"; do node "scripts/$script"; done
              for script in "${overlay_scripts[@]}"; do node "scripts/$script"; done
            )
          }
          candidate_source="$RUNNER_TEMP/sw-art-009-final-candidate.html"
          base_source="$RUNNER_TEMP/sw-art-009-final-base.html"
          assemble_stack '.' "$candidate_source"
          assemble_stack 'accepted-base' "$base_source"
          test -s "$candidate_source"
          test -s "$base_source"
          grep -F 'V500_BOVINE_SIGNATURE_V1' "$candidate_source"
          grep -F 'V500_BOVINE_SIGNATURE_V1' "$base_source"
          grep -F 'SW_FEEL_001_DESTRUCTION_CONSEQUENCE_V1' "$candidate_source"
          grep -F 'SW_FEEL_001_DESTRUCTION_CONSEQUENCE_V1' "$base_source"
          echo "SEVERE_WEATHER_SOURCE_PATH=$candidate_source" >> "$GITHUB_ENV"
          echo "SW_ART_009_BASE_SOURCE_PATH=$base_source" >> "$GITHUB_ENV"

      - name: Verify Cow 17 static contract and canonical Stage 2B laws
        shell: bash
        run: |
          set -euo pipefail
          node --check runtime/sw-art-009-cow17-runtime.js
          node --check scripts/verify-sw-art-009-cow17-runtime.mjs
          node --check scripts/qa-sw-art-009-cow17-runtime.mjs
          node scripts/verify-sw-art-009-cow17-runtime.mjs
          pnpm run verify:process
          pnpm run verify:city-fabric
          pnpm run verify:asset-pipeline
          pnpm run verify:sw-game-002
          pnpm run verify:sw-ui-001
          pnpm run verify:sw-score-001
          pnpm run verify:sw-rpg-001
          pnpm run verify:sw-rpg-002
          pnpm run verify:sw-level-001
          node scripts/verify-sw-quality-001-owner-playtest-rescue.mjs
          node scripts/verify-sw-quality-002-visual-rescue.mjs
          node scripts/verify-sw-ui-003-run-shell-identity.mjs
          node scripts/verify-sw-ui-004-gameplay-product-identity.mjs
          node scripts/verify-sw-ui-005-field-controls.mjs
          node scripts/verify-sw-world-007-secondary-storm-forms.mjs
          node scripts/verify-sw-world-007-atmospheric-correction.mjs
          node scripts/verify-sw-world-007-visibility-lock.mjs
          node scripts/verify-sw-world-007-secondary-exclusive.mjs
          node scripts/verify-sw-feel-001-destruction-consequence.mjs
          node scripts/verify-sw-feel-001-structural-anatomy.mjs
          node scripts/verify-sw-feel-001-structural-priority.mjs
          pnpm run modern:typecheck

      - name: Build accepted canonical on same runner
        shell: bash
        working-directory: accepted-base
        env:
          SEVERE_WEATHER_SOURCE_PATH: ${{ env.SW_ART_009_BASE_SOURCE_PATH }}
        run: |
          set -euo pipefail
          pnpm run build
          test -s www/index.html
          test -s www/build-info.json
          test ! -e www/assets/production/characters/cow17-walking-v1.glb

      - name: Build Cow 17 candidate and prove offline package identity
        shell: bash
        run: |
          set -euo pipefail
          pnpm run build
          test -s www/index.html
          test -s www/assets/production/characters/cow17-walking-v1.glb
          cmp -s assets/production/characters/cow17-walking-v1.glb www/assets/production/characters/cow17-walking-v1.glb
          grep -F '[SW:SOURCE:sw-art-009-cow17-runtime.js]' www/index.html
          grep -F 'SW_COW17_RUNTIME_ASSET_V1' www/index.html
          node - <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const expected = 'd5bb4e47a12fde652808a53fdcb3dfddf71b944f2efb6641bf18ce8ac5c82a93';
          const bytes = fs.readFileSync('www/assets/production/characters/cow17-walking-v1.glb');
          const sha = crypto.createHash('sha256').update(bytes).digest('hex');
          if (sha !== expected) throw new Error(`Packaged Cow 17 SHA mismatch: ${sha}`);
          if (bytes.length !== 14412828) throw new Error(`Packaged Cow 17 size mismatch: ${bytes.length}`);
          const info = JSON.parse(fs.readFileSync('www/build-info.json', 'utf8'));
          if (info.renderer !== 'Three.js r128') throw new Error(`Renderer changed: ${info.renderer}`);
          if (info.productionAssets?.cow17 !== 'assets/production/characters/cow17-walking-v1.glb') throw new Error('Cow 17 path missing from build-info.json.');
          if (info.productionAssets?.cow17Sha256 !== expected) throw new Error('Cow 17 SHA missing from build-info.json.');
          if (info.productionAssets?.cow17Bytes !== 14412828) throw new Error('Cow 17 byte cost missing from build-info.json.');
          NODE

      - name: Install Playwright Chromium
        shell: bash
        run: npx playwright install chromium

      - name: Run Cow 17 behavioral browser QA
        shell: bash
        run: |
          set -euo pipefail
          cleanup_browsers() { for name in headless_shell chrome chromium; do pkill -TERM -x "$name" 2>/dev/null || true; done; }
          cleanup_browsers
          mkdir -p qa-artifacts/sw-art-009-final/cow17
          python3 -m http.server 4173 --directory www > qa-artifacts/sw-art-009-final/cow17-server.log 2>&1 &
          SERVER_PID=$!
          cleanup() { kill "$SERVER_PID" 2>/dev/null || true; cleanup_browsers; }
          trap cleanup EXIT
          for attempt in $(seq 1 80); do
            if curl --silent --fail 'http://127.0.0.1:4173/' > /dev/null; then break; fi
            sleep 0.25
          done
          curl --silent --fail 'http://127.0.0.1:4173/' > /dev/null
          env SEVERE_WEATHER_QA_URL='http://127.0.0.1:4173/' SEVERE_WEATHER_QA_DIR='qa-artifacts/sw-art-009-final/cow17' node scripts/qa-sw-art-009-cow17-runtime.mjs

      - name: Prove inherited Three.js asset-pipeline parity against accepted base
        shell: bash
        run: |
          set -euo pipefail
          cleanup_browsers() { for name in headless_shell chrome chromium; do pkill -TERM -x "$name" 2>/dev/null || true; done; }
          cleanup_browsers
          sleep 1
          mkdir -p qa-artifacts/sw-art-009-final/asset-pipeline-base qa-artifacts/sw-art-009-final/asset-pipeline-candidate
          python3 -m http.server 4172 --directory accepted-base/www > qa-artifacts/sw-art-009-final/asset-pipeline-base-server.log 2>&1 &
          BASE_SERVER_PID=$!
          python3 -m http.server 4173 --directory www > qa-artifacts/sw-art-009-final/asset-pipeline-candidate-server.log 2>&1 &
          CANDIDATE_SERVER_PID=$!
          cleanup() { kill "$BASE_SERVER_PID" "$CANDIDATE_SERVER_PID" 2>/dev/null || true; cleanup_browsers; }
          trap cleanup EXIT
          for port in 4172 4173; do
            for attempt in $(seq 1 80); do
              if curl --silent --fail "http://127.0.0.1:${port}/" > /dev/null; then break; fi
              sleep 0.25
            done
            curl --silent --fail "http://127.0.0.1:${port}/" > /dev/null
          done
          set +e
          (
            cd accepted-base
            env SEVERE_WEATHER_QA_URL='http://127.0.0.1:4172/' SEVERE_WEATHER_QA_DIR="$GITHUB_WORKSPACE/qa-artifacts/sw-art-009-final/asset-pipeline-base" pnpm run qa:asset-pipeline
          )
          BASE_STATUS=$?
          cleanup_browsers
          sleep 1
          env SEVERE_WEATHER_QA_URL='http://127.0.0.1:4173/' SEVERE_WEATHER_QA_DIR='qa-artifacts/sw-art-009-final/asset-pipeline-candidate' pnpm run qa:asset-pipeline
          CANDIDATE_STATUS=$?
          set -e
          BASE_STATUS="$BASE_STATUS" CANDIDATE_STATUS="$CANDIDATE_STATUS" node - <<'NODE'
          const fs = require('fs');
          const base = JSON.parse(fs.readFileSync('qa-artifacts/sw-art-009-final/asset-pipeline-base/threejs-asset-pipeline-report.json', 'utf8'));
          const candidate = JSON.parse(fs.readFileSync('qa-artifacts/sw-art-009-final/asset-pipeline-candidate/threejs-asset-pipeline-report.json', 'utf8'));
          const baseStatus = Number(process.env.BASE_STATUS);
          const candidateStatus = Number(process.env.CANDIDATE_STATUS);
          const cameraClass = (message) => {
            if (message.startsWith('Focused storefront width coverage')) return 'width';
            if (message.startsWith('Focused storefront height coverage')) return 'height';
            if (message.startsWith('Focused storefront is too far off-center horizontally')) return 'center-x';
            if (message.startsWith('Focused storefront is too far off-center vertically')) return 'center-y';
            return null;
          };
          const fail = (message) => { throw new Error(message); };
          const nonCamera = (report) => (report.failures || []).filter((message) => !cameraClass(message));
          const cameras = (report) => (report.failures || []).map(cameraClass).filter(Boolean).sort();
          const verifyFunctional = (label, report) => {
            if (report.success?.pipeline?.version !== 'THREEJS_ASSET_PIPELINE_V1') fail(`${label}: pipeline version changed`);
            if (report.success?.pipeline?.loadSuccesses !== 1 || report.success?.pipeline?.loadFailures !== 0 || report.success?.pipeline?.appliedCount !== 1) fail(`${label}: authored storefront success contract changed`);
            const applied = report.success?.applied?.[0];
            if (!applied || applied.assetId !== 'structure.storefront.v1' || applied.kind !== 'shop') fail(`${label}: wrong authored storefront executor`);
            if (applied.health !== 165 || applied.maxHealth !== 165 || applied.points !== 110 || applied.damagePartCount !== 12) fail(`${label}: gameplay truth drifted`);
            if (report.fallback?.pipeline?.loadSuccesses !== 0 || report.fallback?.pipeline?.appliedCount !== 0 || (report.fallback?.pipeline?.loadFailures || 0) < 1) fail(`${label}: fallback contract changed`);
            if (!String(report.fallback?.pipeline?.lastError || '').includes('BROKEN_ASSET_FOR_QA')) fail(`${label}: fallback error contract changed`);
            if (nonCamera(report).length) fail(`${label}: non-camera inherited failures: ${nonCamera(report).join(' | ')}`);
          };
          verifyFunctional('accepted-base', base);
          verifyFunctional('candidate', candidate);
          const a = base.success.applied[0];
          const b = candidate.success.applied[0];
          for (const key of ['assetId', 'kind', 'health', 'maxHealth', 'points', 'damagePartCount']) if (a[key] !== b[key]) fail(`asset pipeline drift at ${key}`);
          if (baseStatus === 0) {
            if (candidateStatus !== 0 || !candidate.passed) fail('candidate regressed passing accepted-base asset QA');
          } else {
            if (base.passed || cameras(base).length === 0) fail('accepted base failed outside known focus-camera gate');
            if (JSON.stringify(cameras(candidate)) !== JSON.stringify(cameras(base))) fail('candidate camera-failure class differs from accepted base');
          }
          const parity = { version: 'SW_ART_009_FINAL_ASSET_PARITY_V1', baseStatus, candidateStatus, baseCameraFailures: cameras(base), candidateCameraFailures: cameras(candidate), candidateFunctionalParity: true, verdict: baseStatus === 0 ? 'candidate-passes-inherited-qa' : 'candidate-matches-accepted-camera-only-baseline' };
          fs.writeFileSync('qa-artifacts/sw-art-009-final/asset-pipeline-parity.json', `${JSON.stringify(parity, null, 2)}\n`);
          console.log(`Asset-pipeline parity PASS: ${parity.verdict}`);
          NODE

      - name: Prove inherited Moo Level parity against accepted base
        shell: bash
        run: |
          set -euo pipefail
          cleanup_browsers() { for name in headless_shell chrome chromium; do pkill -TERM -x "$name" 2>/dev/null || true; done; }
          cleanup_browsers
          sleep 1
          mkdir -p qa-artifacts/sw-art-009-final/moo-base qa-artifacts/sw-art-009-final/moo-candidate
          python3 -m http.server 4172 --directory accepted-base/www > qa-artifacts/sw-art-009-final/moo-base-server.log 2>&1 &
          BASE_SERVER_PID=$!
          python3 -m http.server 4173 --directory www > qa-artifacts/sw-art-009-final/moo-candidate-server.log 2>&1 &
          CANDIDATE_SERVER_PID=$!
          cleanup() { kill "$BASE_SERVER_PID" "$CANDIDATE_SERVER_PID" 2>/dev/null || true; cleanup_browsers; }
          trap cleanup EXIT
          for port in 4172 4173; do
            for attempt in $(seq 1 80); do
              if curl --silent --fail "http://127.0.0.1:${port}/" > /dev/null; then break; fi
              sleep 0.25
            done
            curl --silent --fail "http://127.0.0.1:${port}/" > /dev/null
          done
          set +e
          (
            cd accepted-base
            env SEVERE_WEATHER_QA_URL='http://127.0.0.1:4172/' SEVERE_WEATHER_QA_DIR="$GITHUB_WORKSPACE/qa-artifacts/sw-art-009-final/moo-base" pnpm run qa:sw-game-002
          ) > qa-artifacts/sw-art-009-final/moo-base.log 2>&1
          BASE_STATUS=$?
          cleanup_browsers
          sleep 1
          env SEVERE_WEATHER_QA_URL='http://127.0.0.1:4173/' SEVERE_WEATHER_QA_DIR='qa-artifacts/sw-art-009-final/moo-candidate' pnpm run qa:sw-game-002 > qa-artifacts/sw-art-009-final/moo-candidate.log 2>&1
          CANDIDATE_STATUS=$?
          set -e
          cat qa-artifacts/sw-art-009-final/moo-base.log
          cat qa-artifacts/sw-art-009-final/moo-candidate.log
          BASE_STATUS="$BASE_STATUS" CANDIDATE_STATUS="$CANDIDATE_STATUS" node - <<'NODE'
          const fs = require('fs');
          const baseStatus = Number(process.env.BASE_STATUS);
          const candidateStatus = Number(process.env.CANDIDATE_STATUS);
          const baseReportPath = 'qa-artifacts/sw-art-009-final/moo-base/report.json';
          const candidateReportPath = 'qa-artifacts/sw-art-009-final/moo-candidate/report.json';
          const baseLog = fs.readFileSync('qa-artifacts/sw-art-009-final/moo-base.log', 'utf8');
          const candidateLog = fs.readFileSync('qa-artifacts/sw-art-009-final/moo-candidate.log', 'utf8');
          const baseReport = fs.existsSync(baseReportPath) ? JSON.parse(fs.readFileSync(baseReportPath, 'utf8')) : null;
          const candidateReport = fs.existsSync(candidateReportPath) ? JSON.parse(fs.readFileSync(candidateReportPath, 'utf8')) : null;
          const fail = (message) => { throw new Error(message); };
          const failureClass = (log) => {
            if (/waitForFunction: Timeout/.test(log)) return 'moo-marker-timeout';
            if (/page\.goto:/.test(log)) return 'page-navigation';
            if (/browserType\.launch|Executable doesn't exist/.test(log)) return 'browser-launch';
            if (/ELIFECYCLE/.test(log)) return 'qa-check-failure';
            return 'unknown';
          };
          const failedChecks = (report) => report ? Object.entries(report.checks || {}).filter(([, passed]) => !passed).map(([name]) => name).sort() : [];
          let verdict = '';
          if (baseStatus === 0 && candidateStatus !== 0) fail('Cow 17 candidate fails Moo QA while accepted base passes');
          if (baseReport && candidateReport) {
            const baseFailures = failedChecks(baseReport);
            const candidateFailures = failedChecks(candidateReport);
            const additional = candidateFailures.filter((name) => !baseFailures.includes(name));
            if (additional.length) fail(`Cow 17 adds Moo failures: ${additional.join(', ')}`);
            if ((candidateReport.pageErrors || []).length > (baseReport.pageErrors || []).length) fail('Cow 17 adds Moo page errors');
            if ((candidateReport.runtimeConsoleErrors || []).length > (baseReport.runtimeConsoleErrors || []).length) fail('Cow 17 adds Moo runtime console errors');
            verdict = candidateStatus === 0 ? 'candidate-passes-moo-qa' : 'candidate-matches-or-improves-accepted-moo-baseline';
          } else if (baseReport && !candidateReport) {
            fail('Cow 17 candidate failed before producing Moo report while accepted base produced one');
          } else if (!baseReport && candidateReport) {
            verdict = 'candidate-reaches-report-while-accepted-base-does-not';
          } else {
            const baseClass = failureClass(baseLog);
            const candidateClass = failureClass(candidateLog);
            if (baseClass !== candidateClass) fail(`Moo pre-report failure class differs: candidate=${candidateClass}, base=${baseClass}`);
            verdict = `candidate-matches-accepted-pre-report-${baseClass}`;
          }
          const parity = { version: 'SW_ART_009_FINAL_MOO_PARITY_V1', baseStatus, candidateStatus, baseReportPresent: Boolean(baseReport), candidateReportPresent: Boolean(candidateReport), baseFailedChecks: failedChecks(baseReport), candidateFailedChecks: failedChecks(candidateReport), baseFailureClass: baseReport ? null : failureClass(baseLog), candidateFailureClass: candidateReport ? null : failureClass(candidateLog), verdict };
          fs.writeFileSync('qa-artifacts/sw-art-009-final/moo-parity.json', `${JSON.stringify(parity, null, 2)}\n`);
          console.log(`Moo Level parity PASS: ${verdict}`);
          NODE

      - name: Run inherited destruction-feel browser QA
        shell: bash
        run: |
          set -euo pipefail
          for name in headless_shell chrome chromium; do pkill -TERM -x "$name" 2>/dev/null || true; done
          sleep 1
          python3 -m http.server 4173 --directory www > qa-artifacts/sw-art-009-final/feel-server.log 2>&1 &
          SERVER_PID=$!
          cleanup() { kill "$SERVER_PID" 2>/dev/null || true; for name in headless_shell chrome chromium; do pkill -TERM -x "$name" 2>/dev/null || true; done; }
          trap cleanup EXIT
          for attempt in $(seq 1 80); do
            if curl --silent --fail 'http://127.0.0.1:4173/' > /dev/null; then break; fi
            sleep 0.25
          done
          curl --silent --fail 'http://127.0.0.1:4173/' > /dev/null
          SEVERE_WEATHER_QA_URL='http://127.0.0.1:4173/' pnpm run qa:sw-feel-001

      - name: Capture same-runner accepted-base versus Cow 17 performance evidence
        shell: bash
        run: |
          set -euo pipefail
          for name in headless_shell chrome chromium; do pkill -TERM -x "$name" 2>/dev/null || true; done
          sleep 1
          mkdir -p qa-artifacts/sw-art-009-final/performance
          python3 -m http.server 4180 --directory accepted-base/www > qa-artifacts/sw-art-009-final/perf-base-server.log 2>&1 &
          BASE_PID=$!
          python3 -m http.server 4181 --directory www > qa-artifacts/sw-art-009-final/perf-candidate-server.log 2>&1 &
          CANDIDATE_PID=$!
          cleanup() { kill "$BASE_PID" "$CANDIDATE_PID" 2>/dev/null || true; for name in headless_shell chrome chromium; do pkill -TERM -x "$name" 2>/dev/null || true; done; }
          trap cleanup EXIT
          for port in 4180 4181; do
            for attempt in $(seq 1 80); do
              if curl --silent --fail "http://127.0.0.1:${port}/" > /dev/null; then break; fi
              sleep 0.25
            done
            curl --silent --fail "http://127.0.0.1:${port}/" > /dev/null
          done
          env SEVERE_WEATHER_BASE_URL='http://127.0.0.1:4180/' SEVERE_WEATHER_CANDIDATE_URL='http://127.0.0.1:4181/' SEVERE_WEATHER_PERF_DIR='qa-artifacts/sw-art-009-final/performance' pnpm run perf:phase6

      - name: Validate final evidence contracts
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            sw-art-009-static-report.json \
            qa-artifacts/sw-art-009-final/cow17/sw-art-009-cow17-runtime-report.json \
            qa-artifacts/sw-art-009-final/cow17/cow17-authored-gameplay.png \
            qa-artifacts/sw-art-009-final/cow17/cow17-authored-focused.png \
            qa-artifacts/sw-art-009-final/cow17/cow17-fallback-gameplay.png \
            qa-artifacts/sw-art-009-final/asset-pipeline-base/threejs-asset-pipeline-report.json \
            qa-artifacts/sw-art-009-final/asset-pipeline-candidate/threejs-asset-pipeline-report.json \
            qa-artifacts/sw-art-009-final/asset-pipeline-parity.json \
            qa-artifacts/sw-art-009-final/moo-parity.json \
            artifacts/feel-001-evidence/qa-report.json \
            qa-artifacts/sw-art-009-final/performance/baseline-report.json \
            qa-artifacts/sw-art-009-final/performance/candidate-report.json \
            qa-artifacts/sw-art-009-final/performance/comparison-report.json \
            www/build-info.json; do
            test -s "$file" || { echo "Missing required final evidence: $file" >&2; exit 1; }
          done
          sha256sum assets/production/characters/cow17-walking-v1.glb www/assets/production/characters/cow17-walking-v1.glb | tee sw-art-009-final-cow17-sha256.txt
          stat -c '%n %s bytes' assets/production/characters/cow17-walking-v1.glb www/assets/production/characters/cow17-walking-v1.glb | tee sw-art-009-final-cow17-size.txt

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sw-art-009-final-diagnostics-${{ github.run_number }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            sw-art-009-static-report.json
            sw-art-009-final-changed-files.txt
            www/build-info.json
            qa-artifacts/sw-art-009-final
            artifacts/feel-001-evidence

      - name: Upload final Cow 17 integration evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sw-art-009-cow17-final-${{ github.run_number }}
          retention-days: 30
          if-no-files-found: error
          path: |
            sw-art-009-static-report.json
            sw-art-009-final-changed-files.txt
            sw-art-009-final-cow17-sha256.txt
            sw-art-009-final-cow17-size.txt
            www/build-info.json
            qa-artifacts/sw-art-009-final
            artifacts/feel-001-evidence
