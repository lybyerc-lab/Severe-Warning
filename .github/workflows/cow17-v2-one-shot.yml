name: cow17-v2-one-shot

on:
  pull_request:
    branches: [qa]
    paths:
      - '.github/cow17-v2-pr-trigger.txt'

permissions:
  contents: write

jobs:
  build-cow:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: qa
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install exporter dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 trimesh==4.11.1 scipy==1.17.0
      - name: Generate cow-17 V2
        run: python .github/scripts/build-cow17-v2.py
      - name: Verify exact asset
        run: |
          test "$(stat -c%s assets/models/cow-17.glb)" = "73704"
          echo "bb4c3dfebcf132f2154ed3c47244033faddf4fde22270eb1416836b10b6ee89f  assets/models/cow-17.glb" | sha256sum -c -
          python - <<'PY'
          import json, struct
          p='assets/models/cow-17.glb'
          b=open(p,'rb').read()
          assert b[:4] == b'glTF'
          jl,jt=struct.unpack_from('<I4s',b,12)
          j=json.loads(b[20:20+jl].decode().rstrip(' \x00'))
          assert len(j['meshes']) == 1
          assert len(j['meshes'][0]['primitives']) == 1
          prim=j['meshes'][0]['primitives'][0]
          assert set(prim['attributes']) == {'POSITION','NORMAL','COLOR_0'}
          mat=j['materials'][prim['material']]['pbrMetallicRoughness']
          assert mat['metallicFactor'] == 0.0
          assert mat['roughnessFactor'] == 0.8
          pos=j['accessors'][prim['attributes']['POSITION']]
          assert pos['min'][1] == 0.0
          assert j.get('animations') is None
          assert j.get('images') is None
          assert j.get('textures') is None
          assert j.get('extensionsRequired') is None
          print('cow-17 V2 verified')
          PY
      - name: Remove one-shot helpers
        run: |
          rm -f .github/scripts/build-cow17-v2.py
          rm -f .github/workflows/cow17-v2-one-shot.yml
          rm -f .github/cow17-v2-trigger.txt
          rm -f .github/cow17-v2-pr-trigger.txt
      - name: Commit asset replacement
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A assets/models/cow-17.glb .github/scripts/build-cow17-v2.py .github/workflows/cow17-v2-one-shot.yml .github/cow17-v2-trigger.txt .github/cow17-v2-pr-trigger.txt
          git commit -m 'assets: replace cow-17 with game-scale V2'
          git push origin HEAD:qa
