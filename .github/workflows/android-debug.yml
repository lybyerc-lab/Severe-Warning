name: Build Android Debug APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/android-debug.yml'
      - 'MechanicsLab/SevereWeather_3D_Lab.html'
      - 'android/**'
      - 'assets/audio/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'scripts/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/android-debug.yml'
      - 'MechanicsLab/SevereWeather_3D_Lab.html'
      - 'android/**'
      - 'assets/audio/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'scripts/**'

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Install and verify FFmpeg
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version
          ffprobe -version

      - name: Install pinned JavaScript dependencies
        shell: bash
        run: |
          npm install --global pnpm@11.9.0
          pnpm install --frozen-lockfile

      - name: Apply deterministic v4.3.1 mobile-comfort patch
        run: npm run patch:v431

      - name: Apply deterministic v4.4.0 illustrated-storm patch
        run: npm run patch:v440

      - name: Apply deterministic v4.4.1 Gust Feedback patch
        run: npm run patch:v441

      - name: Apply deterministic v4.4.2 Pull Feedback patch
        run: npm run patch:v442

      - name: Apply deterministic v4.5.0 Storm Feel patch
        run: npm run patch:v450

      - name: Build and synchronize offline game assets
        run: npm run cap:sync

      - name: Verify packaged gameplay and audio identity
        shell: bash
        run: |
          grep -q 'v4.5.0' www/index.html
          grep -q 'STORM FEEL' www/index.html
          grep -q 'updateStormSoundscape' www/index.html
          grep -q 'playMaterialSound' www/index.html
          grep -q 'MAX_AUDIO_VOICES' www/index.html
          grep -q 'storm-feel-sprite.wav' www/index.html
          grep -q 'targetMaterialFamily' www/index.html
          grep -q 'triggerPullFeedback' www/index.html
          grep -q 'activePullEffects' www/index.html
          grep -q 'triggerGustFeedback' www/index.html
          grep -q 'activeGustEffects' www/index.html
          grep -q 'triggerGridZapCascade' www/index.html
          grep -q 'MeshToonMaterial' www/index.html
          grep -q 'rampageFeedbackLayer' www/index.html
          grep -q 'spawnRampageHudPopup' www/index.html
          grep -q 'MAXIMUM MAYHEM!' www/index.html
          grep -q 'music_drive_low' www/index.html
          grep -q 'music_drive_high' www/index.html
          grep -q 'music_rampage_stinger' www/index.html
          grep -q "options.bus === 'music'" www/index.html
          ! grep -q 'enemyVehicles' www/index.html
          ! grep -q 'Police/Fire/Guard resistance' www/index.html
          ! grep -q 'v4.4.2' www/index.html
          ! grep -q 'v4.4.1' www/index.html
          ! grep -q 'v4.4.0' www/index.html
          ! grep -q 'v4.3.1' www/index.html
          test -s www/audio/storm-feel-sprite.wav
          test -s www/audio/storm-feel-manifest.json
          test -s www/audio/LICENSE.md
          cmp -s www/index.html android/app/src/main/assets/public/index.html
          cmp -s www/audio/storm-feel-sprite.wav android/app/src/main/assets/public/audio/storm-feel-sprite.wav
          cmp -s www/audio/storm-feel-manifest.json android/app/src/main/assets/public/audio/storm-feel-manifest.json
          cmp -s www/audio/LICENSE.md android/app/src/main/assets/public/audio/LICENSE.md
          node --input-type=module -e "import fs from 'node:fs'; const manifest=JSON.parse(fs.readFileSync('www/audio/storm-feel-manifest.json','utf8')); const clips=manifest.clips || {}; const count=Object.keys(clips).length; if (count !== 44) throw new Error('Expected 44 generated audio clips, found ' + count); for (const name of ['music_drive_low','music_drive_high','music_rampage_stinger']) if (!clips[name]) throw new Error('Missing dynamic music clip ' + name); if (manifest.musicRevision !== 1) throw new Error('Dynamic music revision 1 was not packaged'); if (manifest.recordedEffectRevision !== 2) throw new Error('Recorded effect revision 2 was not packaged'); const sources=manifest.recordedSources || []; if (sources.length !== 15) throw new Error('Expected 15 pinned recorded sources, found ' + sources.length); for (const source of sources) { if (!/^[a-f0-9]{64}$/.test(source.sha256 || '')) throw new Error('Missing valid SHA-256 for recorded source ' + (source.name || 'unknown')); }"

      - name: Assemble debug APK
        shell: bash
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify, rename, and hash APK
        shell: bash
        run: |
          source_apk="android/app/build/outputs/apk/debug/app-debug.apk"
          named_apk="android/app/build/outputs/apk/debug/Severe-Weather-v4.5.0-Storm-Feel-debug.apk"
          test -f "$source_apk"
          cp "$source_apk" "$named_apk"
          sha256sum "$named_apk" > "${named_apk}.sha256"

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: severe-weather-v4.5.0-storm-feel-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/debug/Severe-Weather-v4.5.0-Storm-Feel-debug.apk
            android/app/build/outputs/apk/debug/Severe-Weather-v4.5.0-Storm-Feel-debug.apk.sha256
          if-no-files-found: error
          retention-days: 7
