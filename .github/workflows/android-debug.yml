name: Build Android Debug APK

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag, or commit to package
        required: true
        default: qa
        type: string
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/android-debug.yml'
      - 'MechanicsLab/**'
      - 'android/**'
      - 'assets/**'
      - 'scripts/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

concurrency:
  group: android-debug-mobile
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build mobile test APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out requested source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Install FFmpeg and pinned JavaScript dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          npm install --global pnpm@11.9.0
          pnpm install --frozen-lockfile

      - name: Restore verified QA audio cache
        id: audio-cache
        uses: actions/cache@v5
        with:
          path: assets/audio
          key: qa-audio-${{ hashFiles('scripts/generate-storm-audio.mjs', 'scripts/apply-recorded-storm-effects.mjs', 'scripts/append-rampage-music.mjs') }}

      - name: Generate verified audio on cache miss
        if: steps.audio-cache.outputs.cache-hit != 'true'
        run: npm run audio:generate

      - name: Apply accepted deterministic patch chain
        shell: bash
        run: |
          npm run patch:v431
          npm run patch:v440
          npm run patch:v441
          npm run patch:v442
          npm run patch:v450
          npm run patch:v500
          npm run patch:v510

      - name: Build, stamp, and synchronize offline game assets
        shell: bash
        run: |
          node scripts/build-web.mjs
          node scripts/stamp-qa-pages.mjs
          node node_modules/@capacitor/cli/bin/capacitor sync android

      - name: Verify packaged V5 candidate
        shell: bash
        run: |
          node scripts/verify-qa-package.mjs
          node scripts/verify-v500-campaign.mjs

      - name: Verify Android asset synchronization
        shell: bash
        run: |
          cmp -s www/index.html android/app/src/main/assets/public/index.html
          cmp -s www/audio/storm-feel-sprite.wav android/app/src/main/assets/public/audio/storm-feel-sprite.wav
          cmp -s www/audio/storm-feel-manifest.json android/app/src/main/assets/public/audio/storm-feel-manifest.json

      - name: Resolve package identity from package.json
        shell: bash
        run: |
          version_name="$(node -p "require('./package.json').version")"
          if [[ ! "$version_name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::package.json version must be semantic x.y.z, received: $version_name"
            exit 1
          fi
          IFS='.' read -r major minor patch <<< "$version_name"
          if (( minor > 9 || patch > 9 )); then
            echo "::error::The xyz versionCode scheme cannot encode $version_name; minor and patch must each stay below 10."
            exit 1
          fi
          application_id="$(node -p "require('./capacitor.config.json').appId")"

          echo "SEVERE_WEATHER_VERSION_NAME=$version_name" >> "$GITHUB_ENV"
          echo "SEVERE_WEATHER_VERSION_CODE=$((major * 100 + minor * 10 + patch))" >> "$GITHUB_ENV"
          echo "SEVERE_WEATHER_APPLICATION_ID=$application_id" >> "$GITHUB_ENV"

          echo "Application ID: $application_id"
          echo "Version name: $version_name"
          echo "Version code: $((major * 100 + minor * 10 + patch))"

      - name: Assemble debug APK
        shell: bash
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify, rename, and record APK
        id: package
        shell: bash
        run: |
          source_commit="$(git rev-parse HEAD)"
          source_apk="android/app/build/outputs/apk/debug/app-debug.apk"
          metadata="android/app/build/outputs/apk/debug/output-metadata.json"
          output_dir="dist/android-debug"
          test -s "$source_apk"
          test -s "$metadata"

          # Read the identity Gradle stamped into the APK and hold it against the
          # identity resolved from package.json. The manifest below then describes
          # the binary that was actually built instead of asserting a hardcoded
          # version that silently goes stale.
          actual_application_id="$(node -p "require('./$metadata').applicationId ?? ''")"
          actual_version_code="$(node -p "String(require('./$metadata').elements?.[0]?.versionCode ?? '')")"
          actual_version_name="$(node -p "String(require('./$metadata').elements?.[0]?.versionName ?? '')")"

          identity_ok=1
          if [[ "$actual_application_id" != "$SEVERE_WEATHER_APPLICATION_ID" ]]; then
            echo "::error::APK applicationId is '$actual_application_id', expected '$SEVERE_WEATHER_APPLICATION_ID'"
            identity_ok=0
          fi
          if [[ "$actual_version_code" != "$SEVERE_WEATHER_VERSION_CODE" ]]; then
            echo "::error::APK versionCode is '$actual_version_code', expected '$SEVERE_WEATHER_VERSION_CODE'"
            identity_ok=0
          fi
          if [[ "$actual_version_name" != "$SEVERE_WEATHER_VERSION_NAME" ]]; then
            echo "::error::APK versionName is '$actual_version_name', expected '$SEVERE_WEATHER_VERSION_NAME'"
            identity_ok=0
          fi
          if (( identity_ok == 0 )); then
            echo "::error::Packaged APK identity does not match package.json. Refusing to publish a mislabelled artifact."
            exit 1
          fi

          output_apk="$output_dir/Severe-Weather-v${actual_version_name}-Mobile-Test-${GITHUB_RUN_NUMBER}.apk"
          mkdir -p "$output_dir"
          cp "$source_apk" "$output_apk"
          sha256sum "$output_apk" | tee "$output_apk.sha256"

          cat > "$output_dir/package-manifest.json" <<EOF
          {
            "sourceRef": "${{ inputs.source_ref || github.head_ref || github.ref_name }}",
            "sourceCommit": "$source_commit",
            "workflowRun": $GITHUB_RUN_NUMBER,
            "applicationId": "$actual_application_id",
            "versionCode": $actual_version_code,
            "versionName": "$actual_version_name",
            "signingMode": "ephemeral-debug-key",
            "updateInPlaceExpected": false,
            "apkFile": "$(basename "$output_apk")",
            "apkSha256": "$(sha256sum "$output_apk" | awk '{print $1}')"
          }
          EOF

          echo "artifact_name=severe-weather-v${actual_version_name}-mobile-test-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Upload mobile test package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: dist/android-debug/
          if-no-files-found: error
          retention-days: 14
