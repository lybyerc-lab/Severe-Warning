name: Build Android Debug APK

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag, or commit to package
        required: true
        default: qa
        type: string

permissions:
  contents: read

concurrency:
  group: android-debug-mobile
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build mobile test APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out requested source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref }}

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Install FFmpeg and pinned JavaScript dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          npm install --global pnpm@11.9.0
          pnpm install --frozen-lockfile

      - name: Restore verified QA audio cache
        id: audio-cache
        uses: actions/cache@v5
        with:
          path: assets/audio
          key: qa-audio-${{ hashFiles('scripts/generate-storm-audio.mjs', 'scripts/apply-recorded-storm-effects.mjs', 'scripts/append-rampage-music.mjs') }}

      - name: Generate verified audio on cache miss
        if: steps.audio-cache.outputs.cache-hit != 'true'
        run: npm run audio:generate

      - name: Apply accepted deterministic patch chain
        shell: bash
        run: |
          npm run patch:v431
          npm run patch:v440
          npm run patch:v441
          npm run patch:v442
          npm run patch:v450
          npm run patch:v500

      - name: Build, stamp, and synchronize offline game assets
        shell: bash
        run: |
          node scripts/build-web.mjs
          node scripts/stamp-qa-pages.mjs
          node node_modules/@capacitor/cli/bin/capacitor sync android

      - name: Verify packaged V5 candidate
        shell: bash
        run: |
          node scripts/verify-qa-package.mjs
          node scripts/verify-v500-campaign.mjs

      - name: Verify Android asset synchronization
        shell: bash
        run: |
          cmp -s www/index.html android/app/src/main/assets/public/index.html
          cmp -s www/audio/storm-feel-sprite.wav android/app/src/main/assets/public/audio/storm-feel-sprite.wav
          cmp -s www/audio/storm-feel-manifest.json android/app/src/main/assets/public/audio/storm-feel-manifest.json

      - name: Assemble debug APK
        shell: bash
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify, rename, and record APK
        id: package
        shell: bash
        run: |
          source_apk="android/app/build/outputs/apk/debug/app-debug.apk"
          output_dir="dist/android-debug"
          output_apk="$output_dir/Severe-Weather-v5.0.0-Mobile-Test-${GITHUB_RUN_NUMBER}.apk"
          test -s "$source_apk"
          mkdir -p "$output_dir"
          cp "$source_apk" "$output_apk"
          sha256sum "$output_apk" | tee "$output_apk.sha256"

          cat > "$output_dir/package-manifest.json" <<EOF
          {
            "sourceRef": "${{ inputs.source_ref }}",
            "sourceCommit": "$GITHUB_SHA",
            "workflowRun": $GITHUB_RUN_NUMBER,
            "applicationId": "com.lybyerclab.severeweather",
            "versionCode": 500,
            "versionName": "5.0.0",
            "signingMode": "ephemeral-debug-key",
            "updateInPlaceExpected": false,
            "apkFile": "$(basename "$output_apk")",
            "apkSha256": "$(sha256sum "$output_apk" | awk '{print $1}')"
          }
          EOF

          echo "artifact_name=severe-weather-v5.0.0-mobile-test-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Upload mobile test package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: dist/android-debug/
          if-no-files-found: error
          retention-days: 14
