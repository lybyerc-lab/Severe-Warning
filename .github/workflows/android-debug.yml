name: Build Android Debug APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/android-debug.yml'
      - 'MechanicsLab/SevereWeather_3D_Lab.html'
      - 'android/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'scripts/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/android-debug.yml'
      - 'MechanicsLab/SevereWeather_3D_Lab.html'
      - 'android/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'scripts/**'

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Install pinned JavaScript dependencies
        shell: bash
        run: |
          npm install --global pnpm@11.9.0
          pnpm install --frozen-lockfile

      - name: Apply deterministic v4.3.1 gameplay-source patch
        run: npm run patch:v431

      - name: Build and synchronize offline game assets
        run: npm run cap:sync

      - name: Verify packaged gameplay identity
        shell: bash
        run: |
          grep -q 'v4.3.1' www/index.html
          grep -q 'MOBILE COMFORT' www/index.html
          ! grep -q 'enemyVehicles' www/index.html
          ! grep -q 'Police/Fire/Guard resistance' www/index.html
          cmp -s www/index.html android/app/src/main/assets/public/index.html

      - name: Assemble debug APK
        shell: bash
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify, rename, and hash APK
        shell: bash
        run: |
          source_apk="android/app/build/outputs/apk/debug/app-debug.apk"
          named_apk="android/app/build/outputs/apk/debug/Severe-Weather-v4.3.1-Mobile-Comfort-debug.apk"
          test -f "$source_apk"
          cp "$source_apk" "$named_apk"
          sha256sum "$named_apk" > "${named_apk}.sha256"

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: severe-weather-v4.3.1-mobile-comfort-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/debug/Severe-Weather-v4.3.1-Mobile-Comfort-debug.apk
            android/app/build/outputs/apk/debug/Severe-Weather-v4.3.1-Mobile-Comfort-debug.apk.sha256
          if-no-files-found: error
          retention-days: 7
