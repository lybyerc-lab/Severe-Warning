name: Three.js Production Slice

on:
  workflow_dispatch:
  pull_request:
    branches:
      - agent/v500-heartland-campaign
  push:
    branches:
      - agent/threejs-production-slice
    paths:
      - '.github/workflows/threejs-production-slice.yml'
      - 'MechanicsLab/**'
      - 'runtime/**'
      - 'assets/**'
      - 'scripts/**'
      - 'android/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'capacitor.config.json'

permissions:
  contents: read

concurrency:
  group: threejs-production-slice-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-package:
    name: Build, inspect, and package production slice
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Check out production slice branch
        uses: actions/checkout@v6

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          npm install --global pnpm@11.9.0
          pnpm install --frozen-lockfile

      - name: Verify new script syntax
        shell: bash
        run: |
          node --check scripts/apply-v510-production-slice.mjs
          node --check scripts/verify-v510-production-slice.mjs
          node --check scripts/qa-v510-production-slice.mjs
          node --check scripts/verify-qa-package.mjs
          node --check runtime/v510-foundation.js
          node --check runtime/v510-tornado.js
          node --check runtime/v510-world.js
          node --check runtime/v510-runtime.js

      - name: Generate verified audio
        run: npm run audio:generate

      - name: Apply accepted gameplay patch chain
        shell: bash
        run: |
          npm run patch:v431
          npm run patch:v440
          npm run patch:v441
          npm run patch:v442
          npm run patch:v450
          npm run patch:v500

      - name: Verify untouched V5 foundation
        run: npm run verify:v500

      - name: Apply and verify Three.js production slice
        shell: bash
        run: |
          npm run patch:v510
          npm run verify:v510

      - name: Build and verify offline web package
        shell: bash
        run: |
          npm run modern:build
          node scripts/build-web.mjs
          node scripts/stamp-qa-pages.mjs
          node scripts/verify-qa-package.mjs
          test -s www/runtime/v510-foundation.js
          test -s www/runtime/v510-tornado.js
          test -s www/runtime/v510-world.js
          test -s www/runtime/v510-runtime.js

      - name: Run deterministic production-slice browser QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-artifacts/v510-production-slice
          python3 -m http.server 4173 --directory www > qa-artifacts/v510-production-slice/server.log 2>&1 &
          SERVER_PID=$!
          cleanup() { kill "$SERVER_PID" 2>/dev/null || true; }
          trap cleanup EXIT

          for attempt in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            sleep 0.25
          done
          curl --silent --fail http://127.0.0.1:4173/ > /dev/null

          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          CHROME_BIN="$CHROME_BIN" npm run qa:v510

      - name: Synchronize Android assets
        shell: bash
        run: |
          node node_modules/@capacitor/cli/bin/capacitor sync android
          cmp -s www/index.html android/app/src/main/assets/public/index.html
          cmp -s www/runtime/v510-runtime.js android/app/src/main/assets/public/runtime/v510-runtime.js

      - name: Assemble debug APK
        shell: bash
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Package test deliverables
        id: package
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          output_dir="dist/v510-production-slice"
          mkdir -p "$output_dir"

          # Packaging identity comes from package.json and is checked against the
          # APK Gradle actually produced, so these evidence bundles cannot keep
          # advertising a version that nobody builds any more.
          base_version="$(node -p "require('./package.json').version")"
          if [[ ! "$base_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::package.json version must be semantic x.y.z, received: $base_version"
            exit 1
          fi
          IFS='.' read -r major minor patch <<< "$base_version"
          if (( minor > 9 || patch > 9 )); then
            echo "::error::The xyz versionCode scheme cannot encode $base_version; minor and patch must each stay below 10."
            exit 1
          fi
          version_code="$((major * 100 + minor * 10 + patch))"

          metadata="android/app/build/outputs/apk/debug/output-metadata.json"
          test -s "$metadata"
          actual_version_code="$(node -p "String(require('./$metadata').elements?.[0]?.versionCode ?? '')")"
          actual_version_name="$(node -p "String(require('./$metadata').elements?.[0]?.versionName ?? '')")"
          identity_ok=1
          if [[ "$actual_version_code" != "$version_code" ]]; then
            echo "::error::APK versionCode is '$actual_version_code', expected '$version_code'"
            identity_ok=0
          fi
          if [[ "$actual_version_name" != "$base_version" ]]; then
            echo "::error::APK versionName is '$actual_version_name', expected '$base_version'"
            identity_ok=0
          fi
          if (( identity_ok == 0 )); then
            echo "::error::Packaged APK identity does not match package.json. Refusing to record a mislabelled evidence bundle."
            exit 1
          fi

          source_apk="android/app/build/outputs/apk/debug/app-debug.apk"
          output_apk="$output_dir/Severe-Weather-v${base_version}-Production-Slice-${GITHUB_RUN_NUMBER}.apk"
          test -s "$source_apk"
          cp "$source_apk" "$output_apk"
          sha256sum "$output_apk" | tee "$output_apk.sha256"

          cp -R www "$output_dir/web-preview"
          cp -R qa-artifacts/v510-production-slice "$output_dir/qa-evidence"
          cat > "$output_dir/package-manifest.json" <<MANIFEST
          {
            "sourceBranch": "agent/threejs-production-slice",
            "sourceCommit": "$source_commit",
            "workflowRun": $GITHUB_RUN_NUMBER,
            "versionName": "$base_version",
            "versionCode": $version_code,
            "renderer": "Three.js",
            "apkFile": "$(basename "$output_apk")",
            "apkSha256": "$(sha256sum "$output_apk" | awk '{print $1}')"
          }
          MANIFEST
          echo "artifact_name=severe-weather-v${base_version}-production-slice-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Upload production slice bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.artifact_name || 'severe-weather-production-slice-diagnostics' }}
          path: |
            dist/v510-production-slice
            qa-artifacts/v510-production-slice
          if-no-files-found: warn
          retention-days: 14
