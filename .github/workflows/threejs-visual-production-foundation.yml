name: Three.js Visual Production Foundation

on:
  workflow_dispatch:
  pull_request:
    branches:
      - agent/threejs-asset-pipeline-foundation

permissions:
  contents: read

concurrency:
  group: threejs-visual-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-package:
    name: Build verify and package visual production foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out exact visual candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact source identity
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$actual" = "$expected"
          echo "Verified visual candidate source: $actual"

      - name: Check out sealed Stage 1 reference
        uses: actions/checkout@v6
        with:
          ref: f2060dff08ddb9df9f90ecd245940d8db86c7266
          path: stage1-base
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Install frozen dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          npm install --global pnpm@11.9.0
          pnpm install --frozen-lockfile
          pnpm --dir stage1-base install --frozen-lockfile

      - name: Verify process truth visual scripts and TypeScript
        shell: bash
        run: |
          set -euo pipefail
          pnpm run verify:process
          for file in \
            scripts/apply-threejs-visual-foundation.mjs \
            scripts/verify-threejs-visual-foundation.mjs \
            scripts/qa-threejs-visual-foundation.mjs \
            runtime/threejs-visual-foundation.js; do
            node --check "$file"
          done
          node -e "JSON.parse(require('fs').readFileSync('assets/production/asset-provenance.json','utf8'))"
          pnpm run verify:visual-foundation
          pnpm run modern:typecheck

      - name: Verify historical gameplay source remains untouched
        shell: bash
        run: |
          set -euo pipefail
          cmp -s \
            MechanicsLab/SevereWeather_3D_Lab.html \
            stage1-base/MechanicsLab/SevereWeather_3D_Lab.html
          grep -F '<title>Severe Weather 3D Lab v4.3.0 - Rampage Layer</title>' MechanicsLab/SevereWeather_3D_Lab.html
          if grep -F 'THREEJS_VISUAL_FOUNDATION_V1' MechanicsLab/SevereWeather_3D_Lab.html; then
            echo 'Generated visual-foundation output was committed over the historical source baseline.' >&2
            exit 1
          fi

      - name: Generate verified audio in Stage 1 and candidate
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir stage1-base run audio:generate
          pnpm run audio:generate

      - name: Build sealed Stage 1 reference
        shell: bash
        working-directory: stage1-base
        run: |
          set -euo pipefail
          pnpm run patch:v431
          pnpm run patch:v440
          pnpm run patch:v441
          pnpm run patch:v442
          pnpm run patch:v450
          pnpm run patch:v500
          pnpm run verify:v500
          pnpm run patch:v510
          pnpm run verify:v510
          pnpm run patch:phase2
          pnpm run verify:phase2
          pnpm run patch:phase3
          pnpm run verify:phase3
          pnpm run patch:phase4
          pnpm run verify:phase4
          pnpm run patch:phase5
          pnpm run verify:phase5
          pnpm run patch:phase6
          pnpm run verify:phase6
          pnpm run patch:city-fabric
          pnpm run verify:city-fabric
          pnpm run patch:presentation-identity
          pnpm run verify:presentation-identity
          pnpm run patch:asset-pipeline
          pnpm run verify:asset-pipeline
          pnpm run modern:build
          node scripts/build-web.mjs
          node scripts/stamp-qa-pages.mjs
          node scripts/verify-qa-package.mjs
          grep -F 'THREEJS_ASSET_PIPELINE_V1' www/index.html
          if grep -F 'THREEJS_VISUAL_FOUNDATION_V1' www/index.html; then
            echo 'Sealed Stage 1 reference unexpectedly contains visual foundation.' >&2
            exit 1
          fi

      - name: Build and verify visual production candidate
        shell: bash
        run: |
          set -euo pipefail
          pnpm run patch:v431
          pnpm run patch:v440
          pnpm run patch:v441
          pnpm run patch:v442
          pnpm run patch:v450
          pnpm run patch:v500
          pnpm run verify:v500
          pnpm run patch:v510
          pnpm run verify:v510
          pnpm run patch:phase2
          pnpm run verify:phase2
          pnpm run patch:phase3
          pnpm run verify:phase3
          pnpm run patch:phase4
          pnpm run verify:phase4
          pnpm run patch:phase5
          pnpm run verify:phase5
          pnpm run patch:phase6
          pnpm run verify:phase6
          pnpm run patch:city-fabric
          pnpm run verify:city-fabric
          pnpm run patch:presentation-identity
          pnpm run verify:presentation-identity
          pnpm run patch:asset-pipeline
          pnpm run verify:asset-pipeline
          pnpm run patch:visual-foundation
          pnpm run verify:visual-foundation
          pnpm run modern:build
          node scripts/build-web.mjs
          node scripts/stamp-qa-pages.mjs
          node scripts/verify-qa-package.mjs
          grep -F 'THREEJS_ASSET_PIPELINE_V1' www/index.html
          grep -F 'THREEJS_VISUAL_FOUNDATION_V1' www/index.html
          grep -F 'PRESENTATION_IDENTITY_MOO_BREW_V1' www/index.html
          test -s www/assets/production/asset-provenance.json
          test -s www/assets/production/structures/storefront-v1.json
          node - <<'NODE'
          const fs = require('fs');
          const info = JSON.parse(fs.readFileSync('www/build-info.json', 'utf8'));
          const provenance = JSON.parse(fs.readFileSync('www/assets/production/asset-provenance.json', 'utf8'));
          if (info.renderer !== 'Three.js r128') throw new Error(`Renderer changed: ${info.renderer}`);
          if (info.productionAssets?.storefront !== 'assets/production/structures/storefront-v1.json') throw new Error('Authored storefront path regressed.');
          if (provenance.version !== 'SW_ASSET_PROVENANCE_V1') throw new Error(`Asset provenance version changed: ${provenance.version}`);
          if (provenance.policy?.runtimeNetworkAssetsAllowed !== false) throw new Error('Runtime network asset policy is not sealed false.');
          NODE

      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium

      - name: Run inherited gameplay and visual browser QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-artifacts/threejs-visual-production
          python3 -m http.server 4173 --directory www > qa-artifacts/threejs-visual-production/head-server.log 2>&1 &
          HEAD_SERVER_PID=$!
          cleanup() {
            kill "$HEAD_SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 60); do
            if curl --silent --fail 'http://127.0.0.1:4173/' > /dev/null; then break; fi
            sleep 0.25
          done
          curl --silent --fail 'http://127.0.0.1:4173/' > /dev/null

          export SEVERE_WEATHER_QA_URL='http://127.0.0.1:4173/'
          env SEVERE_WEATHER_QA_DIR='qa-artifacts/threejs-visual-production/v510' pnpm run qa:v510
          env SEVERE_WEATHER_QA_DIR='qa-artifacts/threejs-visual-production/clocks' pnpm run qa:phase2
          env SEVERE_WEATHER_QA_DIR='qa-artifacts/threejs-visual-production/input-abilities' pnpm run qa:phase3
          env SEVERE_WEATHER_QA_DIR='qa-artifacts/threejs-visual-production/scoring-campaign' pnpm run qa:phase4
          env SEVERE_WEATHER_QA_DIR='qa-artifacts/threejs-visual-production/presentation-world' pnpm run qa:phase5
          env SEVERE_WEATHER_QA_DIR='qa-artifacts/threejs-visual-production/phase6' pnpm run qa:phase6
          env SEVERE_WEATHER_QA_DIR='qa-artifacts/threejs-visual-production/city' pnpm run qa:city-fabric
          env SEVERE_WEATHER_QA_DIR='qa-artifacts/threejs-visual-production/identity' pnpm run qa:presentation-identity
          env SEVERE_WEATHER_QA_DIR='qa-artifacts/threejs-visual-production/asset' pnpm run qa:asset-pipeline
          env SEVERE_WEATHER_QA_DIR='qa-artifacts/threejs-visual-production/visual' pnpm run qa:visual-foundation

      - name: Run same-runner Stage 1 versus visual performance evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4180 --directory stage1-base/www > qa-artifacts/threejs-visual-production/perf-base-server.log 2>&1 &
          BASE_SERVER_PID=$!
          python3 -m http.server 4181 --directory www > qa-artifacts/threejs-visual-production/perf-candidate-server.log 2>&1 &
          CANDIDATE_SERVER_PID=$!
          cleanup() {
            kill "$BASE_SERVER_PID" "$CANDIDATE_SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          for port in 4180 4181; do
            for attempt in $(seq 1 60); do
              if curl --silent --fail "http://127.0.0.1:${port}/" > /dev/null; then break; fi
              sleep 0.25
            done
            curl --silent --fail "http://127.0.0.1:${port}/" > /dev/null
          done
          env \
            SEVERE_WEATHER_BASE_URL='http://127.0.0.1:4180/' \
            SEVERE_WEATHER_CANDIDATE_URL='http://127.0.0.1:4181/' \
            SEVERE_WEATHER_PERF_DIR='qa-artifacts/threejs-visual-production/performance' \
            pnpm run perf:phase6

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: severe-weather-threejs-visual-production-diagnostics-${{ github.run_number }}
          path: qa-artifacts/threejs-visual-production
          if-no-files-found: warn
          retention-days: 14

      - name: Synchronize Android assets
        shell: bash
        run: |
          set -euo pipefail
          node node_modules/@capacitor/cli/bin/capacitor sync android
          cmp -s www/index.html android/app/src/main/assets/public/index.html
          cmp -s www/modern/modern-shell.js android/app/src/main/assets/public/modern/modern-shell.js
          cmp -s www/assets/production/asset-provenance.json android/app/src/main/assets/public/assets/production/asset-provenance.json
          cmp -s www/assets/production/structures/storefront-v1.json android/app/src/main/assets/public/assets/production/structures/storefront-v1.json

      - name: Assemble debug APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Package exact-source evidence
        id: package
        shell: bash
        run: |
          set -euo pipefail
          source_commit='${{ github.event.pull_request.head.sha || github.sha }}'
          output_dir='dist/threejs-visual-production'
          mkdir -p "$output_dir"

          source_apk='android/app/build/outputs/apk/debug/app-debug.apk'
          output_apk="$output_dir/Severe-Weather-v5.1.0-ThreeJS-Visual-Production-${GITHUB_RUN_NUMBER}.apk"
          test -s "$source_apk"
          cp "$source_apk" "$output_apk"
          sha256sum "$output_apk" | tee "$output_apk.sha256"

          test -s threejs-visual-foundation-static-report.json
          test -s qa-artifacts/threejs-visual-production/visual/threejs-visual-foundation-report.json
          test -s qa-artifacts/threejs-visual-production/visual/threejs-visual-hero-storefront.png
          test -s qa-artifacts/threejs-visual-production/visual/threejs-visual-hero-farm.png
          test -s qa-artifacts/threejs-visual-production/visual/threejs-visual-hero-storm.png
          test -s qa-artifacts/threejs-visual-production/asset/threejs-asset-pipeline-report.json
          test -s qa-artifacts/threejs-visual-production/performance/comparison-report.json

          cp -R www "$output_dir/web-preview"
          cp -R qa-artifacts/threejs-visual-production "$output_dir/qa-evidence"
          cp threejs-visual-foundation-static-report.json "$output_dir/"
          cp Docs/THREEJS_VISUAL_STYLE_BIBLE.md "$output_dir/"
          cp Docs/ASSET_INTAKE_AND_PROVENANCE.md "$output_dir/"
          cp assets/production/asset-provenance.json "$output_dir/"
          git diff --name-status f2060dff08ddb9df9f90ecd245940d8db86c7266...HEAD > "$output_dir/changed-module-ledger.txt"

          cat > "$output_dir/package-manifest.json" <<MANIFEST
          {
            "sourceBranch": "agent/threejs-visual-production-foundation",
            "sourceCommit": "$source_commit",
            "sealedStage1Reference": "f2060dff08ddb9df9f90ecd245940d8db86c7266",
            "frozenGameplayReference": "1f4292c05b3ff5c407d77d1f3eaa6493e43b9d3f",
            "workflowRunId": "${GITHUB_RUN_ID}",
            "workflowRunNumber": ${GITHUB_RUN_NUMBER},
            "versionName": "5.1.0",
            "renderer": "Three.js r128",
            "prototype": "threejs-visual-production-foundation",
            "pipelineBridge": "THREEJS_ASSET_PIPELINE_V1",
            "visualBridge": "THREEJS_VISUAL_FOUNDATION_V1",
            "assetProvenance": "SW_ASSET_PROVENANCE_V1",
            "apkType": "debug",
            "apkFile": "$(basename "$output_apk")",
            "apkSha256": "$(sha256sum "$output_apk" | awk '{print $1}')"
          }
          MANIFEST
          echo "$source_commit" > "$output_dir/SOURCE_COMMIT.txt"
          echo "$GITHUB_RUN_ID" > "$output_dir/WORKFLOW_RUN_ID.txt"
          echo "artifact_name=severe-weather-threejs-visual-production-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Upload visual production APK and evidence
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: dist/threejs-visual-production
          if-no-files-found: error
          retention-days: 14
