name: actor-batch-v3-one-shot

on:
  push:
    branches: [qa]
    paths:
      - '.github/sww-batch-v3-trigger.txt'

permissions:
  contents: write

jobs:
  install-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Reassemble and verify exact GLBs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/models
          for name in water-tower-wreck grain-silo-wreck hart-barn-v2 hart-farmhouse-v2 farm-windmill-v2; do
            src=.github/sww-batch-v3-src/${name}.gz.b64
            if [[ -f "$src" ]]; then
              cat "$src"
            else
              cat "$src".*
            fi | tr -d '\n' | base64 -d | gzip -dc > assets/models/${name}.glb
          done
          echo 'da3ec306c5d7ac0ada355e6fc34b2c53d25199369ce0a0f2063fe88976282d1a  assets/models/water-tower-wreck.glb' | sha256sum -c -
          echo '8ce528c3d9fea78a9d072b59a94d6c8b252c742f103ef51a4b8c512707a5ddd0  assets/models/grain-silo-wreck.glb' | sha256sum -c -
          echo '674aef6ecccdff936548c0a8fd333a36f68e56ca0d089b2101c8fc74df0a4797  assets/models/hart-barn-v2.glb' | sha256sum -c -
          echo '66ad14580cc1ae6552a81040268bc99df3fd03e6a31982723fb1a65c3ebbecd7  assets/models/hart-farmhouse-v2.glb' | sha256sum -c -
          echo 'c24d8426ade899b85ee80f547b730544196556d88e4db606999acf7d8db19090  assets/models/farm-windmill-v2.glb' | sha256sum -c -
      - name: Remove transfer machinery and commit assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/sww-batch-v3-src
          rm -f .github/sww-batch-v3-trigger.txt
          rm -f .github/workflows/actor-batch-v3-one-shot.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A assets/models .github/sww-batch-v3-src .github/sww-batch-v3-trigger.txt .github/workflows/actor-batch-v3-one-shot.yml
          git commit -m 'assets: add landmark wrecks and Hart Farm V2 actors'
          git push origin HEAD:qa
