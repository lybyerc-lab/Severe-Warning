name: Three.js Hero Slice 6 World Identity and Storm Silhouette

on:
  workflow_dispatch:
    inputs:
      package_android:
        description: Build an Android APK for a deliberate device checkpoint
        required: false
        type: boolean
        default: false
  pull_request:
    branches:
      - agent/threejs-hero-slice5-rainbow-cow-level
    paths-ignore:
      - 'Docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - 'AGENTS.md'
      - 'CURRENT_STATUS.md'

permissions:
  contents: read

concurrency:
  group: threejs-hero-slice6-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
  SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
  SLICE5_REFERENCE: f42f12b3e4e6b38d49f6bcc0b129b4e335f13ecf
  SLICE5_CACHE_KEY: severe-weather-slice5-reference-f42f12b3e4e6b38d49f6bcc0b129b4e335f13ecf-v1

jobs:
  prepare-slice5-reference:
    name: Prepare or restore sealed Hero Slice 5 reference
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check out exact Hero Slice 5 reference
        uses: actions/checkout@v6
        with:
          ref: f42f12b3e4e6b38d49f6bcc0b129b4e335f13ecf
          path: slice5-base
          fetch-depth: 1

      - name: Check out contract tools
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate-tools
          fetch-depth: 1

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Restore sealed immutable reference
        id: reference-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            slice5-base/www
            slice5-base/.sealed-slice5-reference.json
          key: severe-weather-slice5-reference-f42f12b3e4e6b38d49f6bcc0b129b4e335f13ecf-v1

      - name: Build immutable reference on cache miss
        if: steps.reference-cache.outputs.cache-hit != 'true'
        shell: bash
        working-directory: slice5-base
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          npm install --global pnpm@11.9.0
          pnpm install --frozen-lockfile
          node scripts/vendor-threejs-hero-slice4-assets.mjs
          pnpm run audio:generate
          pnpm run patch:v431 && pnpm run patch:v440 && pnpm run patch:v441 && pnpm run patch:v442
          pnpm run patch:v450 && pnpm run patch:v500 && pnpm run verify:v500 && pnpm run patch:v510 && pnpm run verify:v510
          pnpm run patch:phase2 && pnpm run verify:phase2 && pnpm run patch:phase3 && pnpm run verify:phase3
          pnpm run patch:phase4 && pnpm run verify:phase4 && pnpm run patch:phase5 && pnpm run verify:phase5
          pnpm run patch:phase6 && pnpm run verify:phase6 && pnpm run patch:city-fabric && pnpm run verify:city-fabric
          pnpm run patch:presentation-identity && pnpm run verify:presentation-identity
          pnpm run patch:asset-pipeline && pnpm run verify:asset-pipeline && pnpm run patch:visual-foundation && pnpm run verify:visual-foundation
          node scripts/apply-threejs-hero-slice4.mjs && node scripts/verify-threejs-hero-slice4.mjs
          node scripts/apply-threejs-hero-slice5.mjs && node scripts/verify-threejs-hero-slice5.mjs
          pnpm run modern:build && node scripts/build-web.mjs && node scripts/stamp-qa-pages.mjs && node scripts/verify-qa-package.mjs
          grep -F 'THREEJS_VISUAL_HERO_SLICE5_V1' www/index.html
          grep -F 'THREEJS_VISUAL_HERO_SLICE5_POLISH_V1' www/index.html
          ! grep -F 'THREEJS_VISUAL_HERO_SLICE6_V1' www/index.html

      - name: Seal or verify immutable reference identity
        shell: bash
        run: |
          set -euo pipefail
          if [ '${{ steps.reference-cache.outputs.cache-hit }}' != 'true' ]; then
            node candidate-tools/scripts/qa-candidate-contract.mjs create \
              --root slice5-base --manifest .sealed-slice5-reference.json \
              --source-commit "$SLICE5_REFERENCE" --source-branch sealed/slice5-reference \
              --renderer 'Three.js r128' --acceptance sealed-immutable-reference --web-root www \
              --require-marker 'www/index.html::THREEJS_VISUAL_HERO_SLICE5_V1' \
              --require-marker 'www/index.html::THREEJS_VISUAL_HERO_SLICE5_POLISH_V1' \
              --require-file 'www/build-info.json'
          fi
          node candidate-tools/scripts/qa-candidate-contract.mjs validate \
            --root slice5-base --manifest .sealed-slice5-reference.json --expected-source "$SLICE5_REFERENCE"

      - name: Save sealed immutable reference after validation
        if: steps.reference-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            slice5-base/www
            slice5-base/.sealed-slice5-reference.json
          key: severe-weather-slice5-reference-f42f12b3e4e6b38d49f6bcc0b129b4e335f13ecf-v1

  build-candidate:
    name: Build and seal exact Hero Slice 6 candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    outputs:
      artifact-name: severe-weather-threejs-hero-slice6-build-${{ github.run_number }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Check out exact Hero Slice 6 candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Check out historical reference source
        uses: actions/checkout@v6
        with:
          ref: f42f12b3e4e6b38d49f6bcc0b129b4e335f13ecf
          path: slice5-source
          fetch-depth: 1

      - name: Verify exact source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          echo "Verified Hero Slice 6 source: $SOURCE_COMMIT"

      - name: Set up Node.js 22 and frozen dependencies
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          npm install --global pnpm@11.9.0
          pnpm install --frozen-lockfile

      - name: Verify source and historical gameplay protection
        shell: bash
        run: |
          set -euo pipefail
          pnpm run verify:process
          for file in runtime/threejs-visual-hero-slice6.js scripts/apply-threejs-hero-slice6.mjs scripts/verify-threejs-hero-slice6.mjs scripts/qa-threejs-hero-slice6.mjs; do node --check "$file"; done
          node scripts/verify-threejs-hero-slice6.mjs
          pnpm run verify:visual-foundation
          pnpm run modern:typecheck
          cmp -s MechanicsLab/SevereWeather_3D_Lab.html slice5-source/MechanicsLab/SevereWeather_3D_Lab.html
          ! grep -F 'THREEJS_VISUAL_HERO_SLICE6_V1' MechanicsLab/SevereWeather_3D_Lab.html

      - name: Build and verify Hero Slice 6 candidate once
        shell: bash
        env:
          GITHUB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          node scripts/vendor-threejs-hero-slice4-assets.mjs
          pnpm run audio:generate
          pnpm run patch:v431 && pnpm run patch:v440 && pnpm run patch:v441 && pnpm run patch:v442
          pnpm run patch:v450 && pnpm run patch:v500 && pnpm run verify:v500 && pnpm run patch:v510 && pnpm run verify:v510
          pnpm run patch:phase2 && pnpm run verify:phase2 && pnpm run patch:phase3 && pnpm run verify:phase3
          pnpm run patch:phase4 && pnpm run verify:phase4 && pnpm run patch:phase5 && pnpm run verify:phase5
          pnpm run patch:phase6 && pnpm run verify:phase6 && pnpm run patch:city-fabric && pnpm run verify:city-fabric
          pnpm run patch:presentation-identity && pnpm run verify:presentation-identity
          pnpm run patch:asset-pipeline && pnpm run verify:asset-pipeline && pnpm run patch:visual-foundation && pnpm run verify:visual-foundation
          node scripts/apply-threejs-hero-slice4.mjs && node scripts/verify-threejs-hero-slice4.mjs
          node scripts/apply-threejs-hero-slice5.mjs && node scripts/verify-threejs-hero-slice5.mjs
          node scripts/apply-threejs-hero-slice6.mjs && node scripts/verify-threejs-hero-slice6.mjs
          pnpm run modern:build && node scripts/build-web.mjs && node scripts/stamp-qa-pages.mjs && node scripts/verify-qa-package.mjs
          grep -F 'THREEJS_VISUAL_HERO_SLICE4_V1' www/index.html
          grep -F 'THREEJS_VISUAL_HERO_SLICE5_V1' www/index.html
          grep -F 'THREEJS_VISUAL_HERO_SLICE5_POLISH_V1' www/index.html
          grep -F 'THREEJS_VISUAL_HERO_SLICE6_V1' www/index.html

      - name: Seal candidate build artifact before browser fan-out
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/threejs-hero-slice6-build
          cp -R www dist/threejs-hero-slice6-build/web-preview
          cp threejs-hero-slice6-static-report.json dist/threejs-hero-slice6-build/
          node scripts/qa-candidate-contract.mjs create \
            --root dist/threejs-hero-slice6-build --manifest qa-candidate-build.json \
            --source-commit "$SOURCE_COMMIT" --source-branch "$SOURCE_BRANCH" --workflow-run-id "$GITHUB_RUN_ID" \
            --renderer 'Three.js r128' --acceptance browser-candidate-not-owner-visual-accepted-not-physical-android-accepted --web-root web-preview \
            --require-file threejs-hero-slice6-static-report.json \
            --require-marker 'web-preview/index.html::THREEJS_VISUAL_HERO_SLICE4_V1' \
            --require-marker 'web-preview/index.html::THREEJS_VISUAL_HERO_SLICE5_V1' \
            --require-marker 'web-preview/index.html::THREEJS_VISUAL_HERO_SLICE6_V1'

      - name: Upload sealed candidate build
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: severe-weather-threejs-hero-slice6-build-${{ github.run_number }}
          path: dist/threejs-hero-slice6-build
          if-no-files-found: error
          retention-days: 30

  core-browser-qa:
    name: Core gameplay browser QA against sealed candidate
    needs: build-candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install QA dependencies and Chromium
        run: npm install --global pnpm@11.9.0 && pnpm install --frozen-lockfile && npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v7
        with:
          name: ${{ needs.build-candidate.outputs.artifact-name }}
          path: candidate
      - name: Verify downloaded candidate identity
        run: node scripts/qa-candidate-contract.mjs validate --root candidate --manifest qa-candidate-build.json --expected-source "$SOURCE_COMMIT"
      - name: Run inherited gameplay QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-artifacts/threejs-hero-slice6
          python3 -m http.server 4173 --directory candidate/web-preview > qa-artifacts/threejs-hero-slice6/core-server.log 2>&1 &
          SERVER_PID=$!; trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do curl --silent --fail http://127.0.0.1:4173/ > /dev/null && break; sleep 0.25; done
          export SEVERE_WEATHER_QA_URL='http://127.0.0.1:4173/'
          env SEVERE_WEATHER_QA_DIR='qa-artifacts/threejs-hero-slice6/v510' pnpm run qa:v510
          env SEVERE_WEATHER_QA_DIR='qa-artifacts/threejs-hero-slice6/clocks' pnpm run qa:phase2
          env SEVERE_WEATHER_QA_DIR='qa-artifacts/threejs-hero-slice6/input-abilities' pnpm run qa:phase3
          env SEVERE_WEATHER_QA_DIR='qa-artifacts/threejs-hero-slice6/scoring-campaign' pnpm run qa:phase4
      - uses: actions/upload-artifact@v7
        with:
          name: severe-weather-threejs-hero-slice6-core-qa-${{ github.run_number }}
          path: qa-artifacts/threejs-hero-slice6
          if-no-files-found: error
          retention-days: 30

  presentation-browser-qa:
    name: Presentation browser QA against sealed candidate
    needs: build-candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install QA dependencies and Chromium
        run: npm install --global pnpm@11.9.0 && pnpm install --frozen-lockfile && npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v7
        with:
          name: ${{ needs.build-candidate.outputs.artifact-name }}
          path: candidate
      - name: Verify downloaded candidate identity
        run: node scripts/qa-candidate-contract.mjs validate --root candidate --manifest qa-candidate-build.json --expected-source "$SOURCE_COMMIT"
      - name: Run presentation and visual QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-artifacts/threejs-hero-slice6
          python3 -m http.server 4174 --directory candidate/web-preview > qa-artifacts/threejs-hero-slice6/presentation-server.log 2>&1 &
          SERVER_PID=$!; trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do curl --silent --fail http://127.0.0.1:4174/ > /dev/null && break; sleep 0.25; done
          export SEVERE_WEATHER_QA_URL='http://127.0.0.1:4174/'
          env SEVERE_WEATHER_QA_DIR='qa-artifacts/threejs-hero-slice6/presentation-world' pnpm run qa:phase5
          env SEVERE_WEATHER_QA_DIR='qa-artifacts/threejs-hero-slice6/phase6' pnpm run qa:phase6
          env SEVERE_WEATHER_QA_DIR='qa-artifacts/threejs-hero-slice6/city' pnpm run qa:city-fabric
          env SEVERE_WEATHER_QA_DIR='qa-artifacts/threejs-hero-slice6/identity' pnpm run qa:presentation-identity
          env SEVERE_WEATHER_QA_DIR='qa-artifacts/threejs-hero-slice6/asset' pnpm run qa:asset-pipeline
          env SEVERE_WEATHER_QA_DIR='qa-artifacts/threejs-hero-slice6/visual-run5' pnpm run qa:visual-foundation
          env SEVERE_WEATHER_QA_DIR='qa-artifacts/threejs-hero-slice6/visual-slice4' node scripts/qa-threejs-hero-slice4.mjs
          env SEVERE_WEATHER_QA_DIR='qa-artifacts/threejs-hero-slice6/visual-slice5' node scripts/qa-threejs-hero-slice5.mjs
          env SEVERE_WEATHER_QA_DIR='qa-artifacts/threejs-hero-slice6/visual-slice6' node scripts/qa-threejs-hero-slice6.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: severe-weather-threejs-hero-slice6-presentation-qa-${{ github.run_number }}
          path: qa-artifacts/threejs-hero-slice6
          if-no-files-found: error
          retention-days: 30

  same-runner-performance:
    name: Same-runner Slice 5 versus Slice 6 performance evidence
    needs: [prepare-slice5-reference, build-candidate]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v6
        with:
          ref: f42f12b3e4e6b38d49f6bcc0b129b4e335f13ecf
          path: slice5-base
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install performance dependencies and Chromium
        run: npm install --global pnpm@11.9.0 && pnpm install --frozen-lockfile && npx playwright install --with-deps chromium
      - uses: actions/cache/restore@v5
        with:
          path: |
            slice5-base/www
            slice5-base/.sealed-slice5-reference.json
          key: severe-weather-slice5-reference-f42f12b3e4e6b38d49f6bcc0b129b4e335f13ecf-v1
          fail-on-cache-miss: true
      - uses: actions/download-artifact@v7
        with:
          name: ${{ needs.build-candidate.outputs.artifact-name }}
          path: candidate
      - name: Verify sealed baseline and candidate identities
        shell: bash
        run: |
          set -euo pipefail
          node scripts/qa-candidate-contract.mjs validate --root slice5-base --manifest .sealed-slice5-reference.json --expected-source "$SLICE5_REFERENCE"
          node scripts/qa-candidate-contract.mjs validate --root candidate --manifest qa-candidate-build.json --expected-source "$SOURCE_COMMIT"
      - name: Run controlled same-runner comparison
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-artifacts/threejs-hero-slice6/performance
          python3 -m http.server 4180 --directory slice5-base/www > qa-artifacts/threejs-hero-slice6/performance/base-server.log 2>&1 & BASE_SERVER_PID=$!
          python3 -m http.server 4181 --directory candidate/web-preview > qa-artifacts/threejs-hero-slice6/performance/candidate-server.log 2>&1 & CANDIDATE_SERVER_PID=$!
          trap 'kill "$BASE_SERVER_PID" "$CANDIDATE_SERVER_PID" 2>/dev/null || true' EXIT
          for port in 4180 4181; do for attempt in $(seq 1 60); do curl --silent --fail "http://127.0.0.1:${port}/" > /dev/null && break; sleep 0.25; done; done
          env SEVERE_WEATHER_BASE_URL='http://127.0.0.1:4180/' SEVERE_WEATHER_CANDIDATE_URL='http://127.0.0.1:4181/' SEVERE_WEATHER_PERF_DIR='qa-artifacts/threejs-hero-slice6/performance' pnpm run perf:phase6
      - uses: actions/upload-artifact@v7
        with:
          name: severe-weather-threejs-hero-slice6-performance-${{ github.run_number }}
          path: qa-artifacts/threejs-hero-slice6
          if-no-files-found: error
          retention-days: 30

  package-evidence:
    name: Package exact-source evidence after all blocking QA
    needs: [build-candidate, core-browser-qa, presentation-browser-qa, same-runner-performance]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@v7
        with:
          name: ${{ needs.build-candidate.outputs.artifact-name }}
          path: candidate
      - uses: actions/download-artifact@v7
        with:
          pattern: severe-weather-threejs-hero-slice6-*-qa-${{ github.run_number }}
          path: assembled
          merge-multiple: true
      - uses: actions/download-artifact@v7
        with:
          name: severe-weather-threejs-hero-slice6-performance-${{ github.run_number }}
          path: assembled
          merge-multiple: true
      - name: Assemble and validate final publisher contract
        shell: bash
        run: |
          set -euo pipefail
          output_dir='dist/threejs-hero-slice6'
          mkdir -p "$output_dir"
          cp -R candidate/web-preview "$output_dir/web-preview"
          cp -R assembled "$output_dir/qa-evidence"
          cp candidate/threejs-hero-slice6-static-report.json "$output_dir/"
          printf '%s\n' "$SOURCE_COMMIT" > "$output_dir/SOURCE_COMMIT.txt"
          printf '%s\n' "$GITHUB_RUN_ID" > "$output_dir/WORKFLOW_RUN_ID.txt"
          node scripts/qa-candidate-contract.mjs create \
            --root "$output_dir" --manifest package-manifest.json \
            --source-commit "$SOURCE_COMMIT" --source-branch "$SOURCE_BRANCH" --workflow-run-id "$GITHUB_RUN_ID" \
            --renderer 'Three.js r128' --acceptance browser-candidate-not-owner-visual-accepted-not-physical-android-accepted --web-root web-preview \
            --require-file SOURCE_COMMIT.txt --require-file WORKFLOW_RUN_ID.txt \
            --require-marker 'web-preview/index.html::THREEJS_VISUAL_HERO_SLICE6_V1' \
            --require-evidence 'qa-evidence/visual-slice6/threejs-hero-slice6-default-storm.png' \
            --require-evidence 'qa-evidence/visual-slice6/threejs-hero-slice6-main-street.png' \
            --require-evidence 'qa-evidence/visual-slice6/threejs-hero-slice6-farm-edge.png' \
            --require-report 'qa-evidence/v510/report.json' \
            --require-report 'qa-evidence/clocks/clock-report.json' \
            --require-report 'qa-evidence/input-abilities/input-ability-report.json' \
            --require-report 'qa-evidence/scoring-campaign/scoring-campaign-report.json' \
            --require-report 'qa-evidence/presentation-world/presentation-world-report.json' \
            --require-report 'qa-evidence/phase6/phase6-qa-report.json' \
            --require-report 'qa-evidence/city/city-fabric-report.json' \
            --require-report 'qa-evidence/identity/presentation-identity-report.json' \
            --require-report 'qa-evidence/asset/threejs-asset-pipeline-report.json' \
            --require-report 'qa-evidence/visual-run5/threejs-visual-foundation-report.json' \
            --require-report 'qa-evidence/visual-slice4/threejs-hero-slice4-report.json' \
            --require-report 'qa-evidence/visual-slice5/threejs-hero-slice5-report.json' \
            --require-report 'qa-evidence/visual-slice6/threejs-hero-slice6-report.json' \
            --require-report 'qa-evidence/performance/comparison-report.json'
          node scripts/qa-candidate-contract.mjs validate --root "$output_dir" --manifest package-manifest.json --expected-source "$SOURCE_COMMIT"
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: severe-weather-threejs-hero-slice6-diagnostics-${{ github.run_number }}
          path: assembled
          if-no-files-found: warn
          retention-days: 14
      - name: Upload final evidence package
        uses: actions/upload-artifact@v7
        with:
          name: severe-weather-threejs-hero-slice6-web-${{ github.run_number }}
          path: dist/threejs-hero-slice6
          if-no-files-found: error
          retention-days: 30

  android-device-checkpoint:
    name: Optional Android device checkpoint package
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.package_android }}
    needs: package-evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: android/**/*.gradle*
      - run: npm install --global pnpm@11.9.0 && pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v7
        with:
          name: severe-weather-threejs-hero-slice6-web-${{ github.run_number }}
          path: final-package
      - name: Verify final browser candidate before Android sync
        run: node scripts/qa-candidate-contract.mjs validate --root final-package --manifest package-manifest.json --expected-source "$SOURCE_COMMIT"
      - name: Synchronize exact sealed web candidate and assemble APK
        shell: bash
        run: |
          set -euo pipefail
          rm -rf www
          cp -R final-package/web-preview www
          node node_modules/@capacitor/cli/bin/capacitor sync android
          cmp -s www/index.html android/app/src/main/assets/public/index.html
          chmod +x android/gradlew
          (cd android && ./gradlew assembleDebug --no-daemon --stacktrace)
      - uses: actions/upload-artifact@v7
        with:
          name: severe-weather-threejs-hero-slice6-device-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
