name: Modernization Phase 1 Shell

on:
  workflow_dispatch:
  push:
    branches:
      - agent/modernization-phase-1-shell
    paths:
      - '.github/workflows/modernization-phase-1.yml'
      - 'src/**'
      - 'scripts/build-web.mjs'
      - 'scripts/qa-v510-production-slice.mjs'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
  pull_request:
    branches:
      - agent/project-context-modernization

permissions:
  contents: write

concurrency:
  group: modernization-phase-1-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-package:
    name: Build, inspect, and package modern shell
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out modernization branch
        uses: actions/checkout@v6

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Install build dependencies and resolve modernization lock
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          npm install --global pnpm@11.9.0
          pnpm install --no-frozen-lockfile

      - name: Commit resolved modernization lock
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- pnpm-lock.yaml; then
            echo 'pnpm-lock.yaml already matches package.json'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m 'Lock modernization toolchain'
          git push origin HEAD:agent/modernization-phase-1-shell

      - name: Verify script syntax and strict TypeScript
        shell: bash
        run: |
          node --check scripts/apply-v510-production-slice.mjs
          node --check scripts/verify-v510-production-slice.mjs
          node --check scripts/qa-v510-production-slice.mjs
          node --check scripts/verify-qa-package.mjs
          npm run modern:typecheck

      - name: Generate verified audio
        run: npm run audio:generate

      - name: Apply accepted gameplay patch chain
        shell: bash
        run: |
          npm run patch:v431
          npm run patch:v440
          npm run patch:v441
          npm run patch:v442
          npm run patch:v450
          npm run patch:v500

      - name: Verify untouched V5 foundation
        run: npm run verify:v500

      - name: Apply and verify Three.js production slice
        shell: bash
        run: |
          npm run patch:v510
          npm run verify:v510

      - name: Build Vite shell and offline web package
        shell: bash
        run: |
          npm run modern:build
          node scripts/build-web.mjs
          node scripts/stamp-qa-pages.mjs
          node scripts/verify-qa-package.mjs
          test -s www/modern/modern-shell.js
          grep -F 'modern/modern-shell.js' www/index.html
          grep -F 'modern-shell-v1' www/build-info.json

      - name: Run deterministic desktop and mobile QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-artifacts/modernization-phase-1
          python3 -m http.server 4173 --directory www > qa-artifacts/modernization-phase-1/server.log 2>&1 &
          SERVER_PID=$!
          cleanup() { kill "$SERVER_PID" 2>/dev/null || true; }
          trap cleanup EXIT

          for attempt in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            sleep 0.25
          done
          curl --silent --fail http://127.0.0.1:4173/ > /dev/null

          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          CHROME_BIN="$CHROME_BIN" SEVERE_WEATHER_QA_DIR="qa-artifacts/modernization-phase-1" npm run qa:v510

      - name: Synchronize Android assets
        shell: bash
        run: |
          node node_modules/@capacitor/cli/bin/capacitor sync android
          cmp -s www/index.html android/app/src/main/assets/public/index.html
          cmp -s www/modern/modern-shell.js android/app/src/main/assets/public/modern/modern-shell.js

      - name: Assemble debug APK
        shell: bash
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Package phase deliverables
        id: package
        shell: bash
        run: |
          set -euo pipefail
          source_commit="${{ github.event.pull_request.head.sha || github.sha }}"
          output_dir="dist/modernization-phase-1"
          mkdir -p "$output_dir"

          source_apk="android/app/build/outputs/apk/debug/app-debug.apk"
          output_apk="$output_dir/Severe-Weather-v5.1.0-Modern-Shell-${GITHUB_RUN_NUMBER}.apk"
          test -s "$source_apk"
          cp "$source_apk" "$output_apk"
          sha256sum "$output_apk" | tee "$output_apk.sha256"

          cp -R www "$output_dir/web-preview"
          cp -R qa-artifacts/modernization-phase-1 "$output_dir/qa-evidence"
          cp pnpm-lock.yaml "$output_dir/pnpm-lock.resolved.yaml"
          cat > "$output_dir/package-manifest.json" <<MANIFEST
          {
            "sourceBranch": "agent/modernization-phase-1-shell",
            "sourceCommit": "$source_commit",
            "workflowRun": $GITHUB_RUN_NUMBER,
            "versionName": "5.1.0",
            "versionCode": 510,
            "renderer": "Three.js r128",
            "architecture": "modern-shell-v1",
            "apkFile": "$(basename "$output_apk")",
            "apkSha256": "$(sha256sum "$output_apk" | awk '{print $1}')"
          }
          MANIFEST
          echo "artifact_name=severe-weather-modernization-phase-1-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Upload modern shell bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.artifact_name || 'severe-weather-modernization-phase-1-diagnostics' }}
          path: |
            dist/modernization-phase-1
            qa-artifacts/modernization-phase-1
          if-no-files-found: warn
          retention-days: 14
