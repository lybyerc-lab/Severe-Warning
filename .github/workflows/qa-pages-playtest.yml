name: QA Pages Playtest

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact commit SHA or ref to publish as the QA playtest
        required: true
        default: 97aa6ae792ed5fb201c0fd35d748a4dfff971e61
  push:
    branches:
      - main
    paths:
      - .github/workflows/qa-pages-playtest.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: qa-pages-playtest
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout exact playtest source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || '97aa6ae792ed5fb201c0fd35d748a4dfff971e61' }}
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build modern shell
        run: pnpm run modern:build

      - name: Generate deterministic storm audio
        run: node scripts/generate-storm-audio.mjs

      - name: Assemble exact RPG-002 playtest source
        shell: bash
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/severe-weather-qa-playtest.html"
          cp MechanicsLab/SevereWeather_3D_Lab.html "$candidate"
          export SEVERE_WEATHER_SOURCE_PATH="$candidate"
          for script in \
            apply-v431-source-patch.mjs \
            apply-v440-source-patch.mjs \
            apply-v441-source-patch.mjs \
            apply-v442-source-patch.mjs \
            fix-v450-parser.mjs \
            apply-v450-source-patch.mjs \
            apply-v450-rampage-music-patch.mjs \
            apply-qa-corrections-patch.mjs \
            apply-audio-mix-followup-patch.mjs \
            apply-ui-polish-followup-patch.mjs \
            apply-score-continuity-fix.mjs \
            apply-qa4-deterministic-lab-patch.mjs \
            apply-qa4-mobile-input-fix.mjs \
            apply-qa4-run-lock-fix.mjs \
            apply-qa4-pause-forensics.mjs \
            apply-pause-overlay-hit-test-fix.mjs \
            apply-pause-overlay-hard-hide.mjs \
            apply-qa4-popup-assertion-fix.mjs \
            apply-v500-campaign-patch.mjs \
            apply-v500-realtime-clock-fix.mjs \
            apply-v500-world-tour-patch.mjs \
            apply-v500-mobile-layout-fix.mjs \
            apply-v500-cow-signature-patch.mjs \
            apply-v510-production-slice.mjs \
            apply-sw-game-002-moo-level.mjs \
            apply-sw-ui-001-newspaper-presentation.mjs \
            apply-sw-score-001-persistent-scorekeeper.mjs \
            apply-sw-rpg-001-moolah-storm-triangle.mjs \
            apply-sw-rpg-002-slingshot.mjs
          do
            node "scripts/$script"
          done
          node scripts/build-web.mjs
          printf '%s\n' "{\"sourceRef\":\"${{ inputs.source_ref || '97aa6ae792ed5fb201c0fd35d748a4dfff971e61' }}\",\"purpose\":\"owner-playtest\",\"authority\":\"QA-only; not Integration or production acceptance\"}" > www/playtest-info.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: www

      - name: Deploy QA Pages
        id: deployment
        uses: actions/deploy-pages@v4
