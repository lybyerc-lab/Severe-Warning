name: SW-ART-009 Cow 17 Performance Metrics

on:
  push:
    branches:
      - agent/sw-art-009-cow17-runtime-integration
    paths:
      - tools/art/live-requests/cow17-performance-metrics-v1.json

permissions:
  contents: read

concurrency:
  group: sw-art-009-cow17-performance-metrics
  cancel-in-progress: true

jobs:
  metrics:
    name: Measure Cow 17 runtime performance without advisory screenshots
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove exact base asset and one-shot launch
        shell: bash
        run: |
          set -euo pipefail
          base='de2e62835e79567b4bbfc079a372ce2af4ee0879'
          test "$(git merge-base "$base" HEAD)" = "$base"
          test "${GITHUB_RUN_ATTEMPT}" = '1'
          request='tools/art/live-requests/cow17-performance-metrics-v1.json'
          test -s "$request"
          test "$(git diff-tree --root --no-commit-id --name-only -r "$GITHUB_SHA" -- "$request")" = "$request"
          node - <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const bytes = fs.readFileSync('assets/production/characters/cow17-walking-v1.glb');
          const sha = crypto.createHash('sha256').update(bytes).digest('hex');
          if (sha !== 'd5bb4e47a12fde652808a53fdcb3dfddf71b944f2efb6641bf18ce8ac5c82a93') throw new Error(`Cow 17 SHA drift: ${sha}`);
          if (bytes.length !== 14412828) throw new Error(`Cow 17 size drift: ${bytes.length}`);
          NODE

      - name: Checkout accepted canonical
        uses: actions/checkout@v4
        with:
          ref: de2e62835e79567b4bbfc079a372ce2af4ee0879
          path: accepted-base
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frozen dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --global pnpm@11.9.0
          pnpm install --frozen-lockfile
          pnpm --dir accepted-base install --frozen-lockfile

      - name: Prepare deterministic local assets
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo timeout 120s apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
            sudo timeout 120s apt-get install --yes --no-install-recommends ffmpeg
          fi
          timeout 180s pnpm run audio:generate
          timeout 60s node scripts/vendor-threejs-hero-slice4-assets.mjs
          (
            cd accepted-base
            timeout 180s pnpm run audio:generate
            timeout 60s node scripts/vendor-threejs-hero-slice4-assets.mjs
          )

      - name: Assemble exact accepted Stage 2B source on both sides
        shell: bash
        run: |
          set -euo pipefail
          initial_scripts=(
            apply-v431-source-patch.mjs apply-v440-source-patch.mjs apply-v441-source-patch.mjs apply-v442-source-patch.mjs
            fix-v450-parser.mjs apply-v450-source-patch.mjs apply-v450-rampage-music-patch.mjs apply-qa-corrections-patch.mjs
            apply-audio-mix-followup-patch.mjs apply-ui-polish-followup-patch.mjs apply-score-continuity-fix.mjs
            apply-qa4-deterministic-lab-patch.mjs apply-qa4-mobile-input-fix.mjs apply-qa4-run-lock-fix.mjs apply-qa4-pause-forensics.mjs
            apply-pause-overlay-hit-test-fix.mjs apply-pause-overlay-hard-hide.mjs apply-qa4-popup-assertion-fix.mjs apply-qa4-rampage-popup-fix.mjs
            apply-v500-campaign-patch.mjs apply-v500-realtime-clock-fix.mjs apply-v500-world-tour-patch.mjs apply-v500-mobile-layout-fix.mjs apply-v500-cow-signature-patch.mjs
            apply-v510-production-slice.mjs apply-modernization-phase2-clocks.mjs apply-phase2-player-forensics-guard.mjs
            apply-modernization-phase3-input-abilities.mjs apply-modernization-phase4-scoring-campaign.mjs apply-modernization-phase5-presentation-world.mjs apply-modernization-phase6-performance.mjs
            apply-city-fabric-destruction.mjs apply-presentation-identity-moo-brew.mjs apply-threejs-asset-pipeline.mjs apply-threejs-visual-foundation.mjs
            apply-threejs-hero-slice4.mjs apply-threejs-hero-slice5.mjs apply-threejs-hero-slice6.mjs apply-sw-game-002-moo-level.mjs
            apply-sw-ui-001-newspaper-presentation.mjs apply-sw-score-001-persistent-scorekeeper.mjs apply-sw-rpg-001-moolah-storm-triangle.mjs
            apply-sw-rpg-002-slingshot.mjs apply-sw-level-001-storm-site-framework.mjs apply-sw-ui-002-landscape-unleash.mjs apply-sw-quality-001-owner-playtest-rescue.mjs
          )
          overlay_scripts=(
            apply-sw-quality-002-visual-rescue.mjs apply-sw-quality-002-storm-frame-bridge.mjs apply-sw-ui-003-run-shell-identity.mjs apply-sw-ui-004-gameplay-product-identity.mjs
            apply-sw-world-007-secondary-storm-forms.mjs apply-sw-world-007-atmospheric-correction.mjs apply-sw-world-007-visibility-lock.mjs apply-sw-world-007-secondary-exclusive.mjs
            apply-sw-feel-001-destruction-consequence.mjs apply-sw-feel-001-structural-anatomy.mjs apply-sw-feel-001-structural-priority.mjs apply-sw-ui-005-field-controls.mjs
          )
          assemble_stack() {
            local root="$1" output="$2"
            cp "$root/MechanicsLab/SevereWeather_3D_Lab.html" "$output"
            (
              cd "$root"
              export SEVERE_WEATHER_SOURCE_PATH="$output"
              for script in "${initial_scripts[@]}"; do node "scripts/$script"; done
              for script in "${overlay_scripts[@]}"; do node "scripts/$script"; done
            )
          }
          candidate_source="$RUNNER_TEMP/sw-art-009-metrics-candidate.html"
          base_source="$RUNNER_TEMP/sw-art-009-metrics-base.html"
          assemble_stack '.' "$candidate_source"
          assemble_stack 'accepted-base' "$base_source"
          test -s "$candidate_source"
          test -s "$base_source"
          echo "SEVERE_WEATHER_SOURCE_PATH=$candidate_source" >> "$GITHUB_ENV"
          echo "SW_ART_009_BASE_SOURCE_PATH=$base_source" >> "$GITHUB_ENV"

      - name: Build accepted base and Cow 17 candidate
        shell: bash
        run: |
          set -euo pipefail
          (
            cd accepted-base
            SEVERE_WEATHER_SOURCE_PATH="$SW_ART_009_BASE_SOURCE_PATH" pnpm run build
          )
          pnpm run build
          test -s accepted-base/www/index.html
          test -s www/index.html
          test ! -e accepted-base/www/assets/production/characters/cow17-walking-v1.glb
          cmp -s assets/production/characters/cow17-walking-v1.glb www/assets/production/characters/cow17-walking-v1.glb

      - name: Install Playwright Chromium
        shell: bash
        run: npx playwright install chromium

      - name: Prepare metrics-only copy of canonical performance observer
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/measure-phase6-performance.mjs scripts/.sw-art-009-measure-performance.mjs
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/.sw-art-009-measure-performance.mjs')
          text = p.read_text()
          old = "  await page.screenshot({ path: path.join(outputDir, `${label}.png`), fullPage: true, timeout: 15000 });\n"
          new = "  console.log(`[SW:ART009:PERF] Advisory screenshot omitted after metrics capture: ${label}`);\n"
          if text.count(old) != 1:
              raise SystemExit('Expected canonical screenshot call exactly once.')
          text = text.replace(old, new, 1)
          p.write_text(text)
          PY
          node --check scripts/.sw-art-009-measure-performance.mjs
          grep -F '[SW:ART009:PERF] Advisory screenshot omitted after metrics capture' scripts/.sw-art-009-measure-performance.mjs

      - name: Capture same-runner Cow 17 performance metrics
        shell: bash
        run: |
          set -euo pipefail
          for name in headless_shell chrome chromium; do pkill -TERM -x "$name" 2>/dev/null || true; done
          mkdir -p qa-artifacts/sw-art-009-performance-metrics
          python3 -m http.server 4180 --directory accepted-base/www > qa-artifacts/sw-art-009-performance-metrics/base-server.log 2>&1 &
          BASE_PID=$!
          python3 -m http.server 4181 --directory www > qa-artifacts/sw-art-009-performance-metrics/candidate-server.log 2>&1 &
          CANDIDATE_PID=$!
          cleanup() { kill "$BASE_PID" "$CANDIDATE_PID" 2>/dev/null || true; for name in headless_shell chrome chromium; do pkill -TERM -x "$name" 2>/dev/null || true; done; rm -f scripts/.sw-art-009-measure-performance.mjs; }
          trap cleanup EXIT
          for port in 4180 4181; do
            for attempt in $(seq 1 80); do
              if curl --silent --fail "http://127.0.0.1:${port}/" > /dev/null; then break; fi
              sleep 0.25
            done
            curl --silent --fail "http://127.0.0.1:${port}/" > /dev/null
          done
          env \
            SEVERE_WEATHER_BASE_URL='http://127.0.0.1:4180/' \
            SEVERE_WEATHER_CANDIDATE_URL='http://127.0.0.1:4181/' \
            SEVERE_WEATHER_PERF_DIR='qa-artifacts/sw-art-009-performance-metrics' \
            node scripts/.sw-art-009-measure-performance.mjs

      - name: Validate performance evidence
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            qa-artifacts/sw-art-009-performance-metrics/baseline-report.json \
            qa-artifacts/sw-art-009-performance-metrics/candidate-report.json \
            qa-artifacts/sw-art-009-performance-metrics/comparison-report.json \
            qa-artifacts/sw-art-009-performance-metrics/phase6-performance-report.md; do
            test -s "$file" || { echo "Missing performance evidence: $file" >&2; exit 1; }
          done
          node - <<'NODE'
          const fs = require('fs');
          const comparison = JSON.parse(fs.readFileSync('qa-artifacts/sw-art-009-performance-metrics/comparison-report.json', 'utf8'));
          if (comparison.passed !== true) throw new Error('Performance comparison did not pass canonical integration gate.');
          if ((comparison.errors?.baseline || []).length || (comparison.errors?.candidate || []).length) throw new Error(`Performance browser errors: ${JSON.stringify(comparison.errors)}`);
          const integration = comparison.candidateIntegration;
          if (!integration || integration.productionUpdateSamples <= 0 || integration.productionDustBurstCalls <= 0 || integration.pooledDustSpawned <= 0) throw new Error('Candidate performance run did not prove production integration.');
          console.log(JSON.stringify(comparison, null, 2));
          NODE

      - name: Upload Cow 17 performance metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sw-art-009-performance-metrics-${{ github.run_number }}
          retention-days: 30
          if-no-files-found: error
          path: qa-artifacts/sw-art-009-performance-metrics
