name: SW-INT-003 Clean Ubuntu A/B Closure Harness

on:
  push:
    branches:
      - 'ci/sw-int-003-ubuntu-ab-harness'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sw-int-003-ubuntu-ab-harness
  cancel-in-progress: true

jobs:
  job-source-a:
    name: Source A (ce1e47c) Baseline Isolation
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Source A (ce1e47c)
        uses: actions/checkout@v4
        with:
          ref: ce1e47c858cdbca5039fb7ad7ad2545f4537c238

      - name: Verify SHA and Git Status
        run: |
          echo "=== SOURCE A SHA VERIFICATION ==="
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = "ce1e47c858cdbca5039fb7ad7ad2545f4537c238"
          git status --short

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install System and Node Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg xvfb
          npm install --global pnpm@11.9.0
          pnpm install --frozen-lockfile || pnpm install
          npx playwright install --with-deps chromium

      - name: Prepare Generated Audio Assets and Modern Bundle
        run: |
          echo "=== PREPARE GENERATED ASSETS AND BUNDLE (A) ==="
          pnpm run audio:generate
          pnpm run modern:build

      - name: Raw-Source Static Verifications
        run: |
          echo "=== RAW-SOURCE STATIC VERIFICATION (A) ==="
          node scripts/verify-implementation-truth.mjs
          node scripts/verify-sw-game-002.mjs
          node scripts/verify-sw-score-001-persistent-scorekeeper.mjs
          node scripts/verify-sw-rpg-001-moolah-storm-triangle.mjs

      - name: Isolated Scorekeeper Browser QA Execution
        run: |
          echo "=== ISOLATED SCOREKEEPER BROWSER QA (A) ==="
          mkdir -p ../scorekeeper-worktree
          cp -r . ../scorekeeper-worktree
          cd ../scorekeeper-worktree
          pnpm run audio:generate
          xvfb-run --auto-servernum node scripts/qa-sw-score-001-persistent-scorekeeper.mjs || true
          cd ../Severe-Warning
          mkdir -p qa-artifacts/sw-score-001
          cp -r ../scorekeeper-worktree/qa-artifacts/sw-score-001/* qa-artifacts/sw-score-001/ || true

      - name: Evaluate Source A Scorekeeper Report Matrix
        run: |
          echo "=== EVALUATING SOURCE A SCOREKEEPER REPORT MATRIX ==="
          node -e "
          const fs = require('fs');
          const assert = require('assert/strict');
          const report = JSON.parse(fs.readFileSync('qa-artifacts/sw-score-001/report.json', 'utf8'));
          console.log(JSON.stringify(report, null, 2));
          const checks = report.checks || {};
          assert.equal(checks.firstRunCreatesDurableSiteModeRecord, true, 'firstRunCreatesDurableSiteModeRecord');
          assert.equal(checks.lowerRunDoesNotReplacePersonalBest, true, 'lowerRunDoesNotReplacePersonalBest');
          assert.equal(checks.higherRunCreatesPbWithPreviousAndMargin, true, 'higherRunCreatesPbWithPreviousAndMargin');
          assert.equal(checks.recordsSurviveReloadRestart, true, 'recordsSurviveReloadRestart');
          assert.equal(checks.scoringVersionIsExplicitAndPartitioned, true, 'scoringVersionIsExplicitAndPartitioned');
          assert.equal(checks.siteAndVariantBucketsDoNotContaminate, true, 'siteAndVariantBucketsDoNotContaminate');
          assert.equal(checks.mooRecordsRemainDistinct, true, 'mooRecordsRemainDistinct');
          assert.equal(checks.newspaperIsLegibleAndMotivating, true, 'newspaperIsLegibleAndMotivating');
          assert.equal(checks.replayAndWeatherMapActionsWork, true, 'replayAndWeatherMapActionsWork');
          assert.equal(checks.futureMetadataIsOnlyReserved, true, 'futureMetadataIsOnlyReserved');
          assert.equal(checks.noPageErrors, true, 'noPageErrors');
          assert.equal(checks.noRuntimeConsoleErrors, true, 'noRuntimeConsoleErrors');
          assert.deepEqual(report.pageErrors, [], 'pageErrors');
          assert.deepEqual(report.runtimeConsoleErrors, [], 'runtimeConsoleErrors');
          console.log('Source A Scorekeeper Matrix Evaluator: PASS');
          "

      - name: Isolated RPG-001 Browser QA
        run: |
          echo "=== ISOLATED RPG-001 BROWSER QA (A) ==="
          mkdir -p ../rpg-worktree
          cp -r . ../rpg-worktree
          cd ../rpg-worktree
          pnpm run audio:generate
          xvfb-run --auto-servernum node scripts/qa-sw-rpg-001-moolah-storm-triangle.mjs
          cd ../Severe-Warning
          mkdir -p qa-artifacts/sw-rpg-001
          cp -r ../rpg-worktree/qa-artifacts/sw-rpg-001/* qa-artifacts/sw-rpg-001/ || true

      - name: Isolated GAME-002 Browser QA Execution
        env:
          CI: "true"
        run: |
          echo "=== ISOLATED GAME-002 BROWSER QA (A) ==="
          mkdir -p ../game002-worktree
          cp -r . ../game002-worktree
          cd ../game002-worktree
          pnpm run patch:v431
          pnpm run patch:v440
          pnpm run patch:v441
          pnpm run patch:v442
          pnpm run patch:v450
          pnpm run patch:v500
          pnpm run patch:v510
          pnpm run patch:phase2
          pnpm run patch:phase3
          pnpm run patch:phase4
          pnpm run patch:phase5
          pnpm run patch:phase6
          pnpm run patch:city-fabric
          pnpm run patch:presentation-identity
          pnpm run patch:asset-pipeline
          pnpm run patch:visual-foundation
          node scripts/apply-sw-game-002-moo-level.mjs
          pnpm run patch:sw-ui-001
          pnpm run patch:sw-score-001
          pnpm run patch:sw-rpg-001
          pnpm run modern:build
          node scripts/build-web.mjs
          node scripts/serve-www.mjs &
          SERVER_PID=$!
          sleep 3
          xvfb-run --auto-servernum node scripts/qa-sw-game-002.mjs || true
          kill $SERVER_PID || true
          cd ../Severe-Warning
          mkdir -p qa-artifacts/sw-game-002
          cp -r ../game002-worktree/qa-artifacts/sw-game-002/* qa-artifacts/sw-game-002/

      - name: Evaluate Source A GAME-002 Report Matrix
        run: |
          echo "=== EVALUATING SOURCE A GAME-002 REPORT MATRIX ==="
          node -e "
          const fs = require('fs');
          const assert = require('assert/strict');
          const report = JSON.parse(fs.readFileSync('qa-artifacts/sw-game-002/report.json', 'utf8'));
          console.log(JSON.stringify(report, null, 2));
          const checks = report.checks || {};
          assert.equal(checks.executorIntegration, true, 'executorIntegration');
          assert.equal(checks.hartFarmActivated, true, 'hartFarmActivated');
          assert.equal(checks.encounterFailureRearms, false, 'encounterFailureRearms');
          assert.equal(checks.encounterUnlocked, false, 'encounterUnlocked');
          assert.equal(checks.persistence, true, 'persistence');
          assert.equal(checks.lockedToUnlockedAccess, true, 'lockedToUnlockedAccess');
          assert.equal(checks.dedicatedMooRun, true, 'dedicatedMooRun');
          assert.equal(checks.objectiveSignals, true, 'objectiveSignals');
          assert.equal(checks.cowSafety, true, 'cowSafety');
          assert.equal(checks.normalCampaignRegression, true, 'normalCampaignRegression');
          assert.equal(checks.noPageErrors, true, 'noPageErrors');
          assert.equal(checks.noRuntimeConsoleErrors, true, 'noRuntimeConsoleErrors');
          assert.deepEqual(report.pageErrors, [], 'pageErrors');
          assert.deepEqual(report.runtimeConsoleErrors, [], 'runtimeConsoleErrors');
          assert.deepEqual(report.assetTransportErrors, [], 'assetTransportErrors');
          console.log('Source A GAME-002 Matrix Evaluator: PASS');
          "

      - name: Upload Source A QA Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-artifacts-source-a
          path: qa-artifacts/
          if-no-files-found: warn
          retention-days: 14

