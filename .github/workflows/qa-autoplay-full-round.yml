name: QA Automated Full Round

# Trigger refresh: 2026-08-01 full-round playtest
on:
  workflow_dispatch:
  push:
    branches:
      - qa
    paths:
      - '.github/workflows/qa-autoplay-full-round.yml'

permissions:
  contents: write

concurrency:
  group: qa-autoplay-full-round
  cancel-in-progress: true

jobs:
  play-full-round:
    name: Play full QA round
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out exact QA branch
        uses: actions/checkout@v6
        with:
          ref: qa

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install pinned project dependencies
        shell: bash
        run: |
          npm install --global pnpm@11.9.0
          pnpm install --frozen-lockfile

      - name: Install Playwright browser harness
        shell: bash
        run: |
          pnpm exec playwright install --with-deps chromium

      - name: Restore verified QA audio cache
        id: audio-cache
        uses: actions/cache@v5
        with:
          path: assets/audio
          key: qa-autoplay-audio-${{ hashFiles('scripts/generate-storm-audio.mjs', 'scripts/apply-recorded-storm-effects.mjs', 'scripts/append-rampage-music.mjs') }}

      - name: Install FFmpeg on cache miss
        if: steps.audio-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg

      - name: Generate verified audio on cache miss
        if: steps.audio-cache.outputs.cache-hit != 'true'
        run: npm run audio:generate

      - name: Build exact patched QA game
        shell: bash
        run: |
          node --check scripts/apply-qa-corrections-patch.mjs
          node --check scripts/apply-audio-mix-followup-patch.mjs
          node --check scripts/qa-play-full-round.mjs
          node --check scripts/apply-v500-campaign-patch.mjs
          node --check scripts/verify-v500-campaign.mjs
          npm run patch:v431
          npm run patch:v440
          npm run patch:v441
          npm run patch:v442
          npm run patch:v450
          npm run patch:v500
          npm run verify:v500
          node scripts/build-web.mjs
          node scripts/stamp-qa-pages.mjs

      - name: Start local QA web server
        shell: bash
        run: |
          python3 -m http.server 4173 --directory www > /tmp/qa-autoplay-server.log 2>&1 &
          echo $! > /tmp/qa-autoplay-server.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/qa-autoplay-server.log
          exit 1

      - name: Play complete normal-audio round
        env:
          QA_PLAY_URL: http://127.0.0.1:4173/
          QA_PLAY_OUTPUT: Docs
        run: node scripts/qa-play-full-round.mjs

      - name: Verify report exists
        shell: bash
        run: |
          test -s Docs/QA_AUTOPLAY_REPORT.json
          test -s Docs/QA_AUTOPLAY_REPORT.md
          test -s Docs/QA_AUTOPLAY_SCREENSHOT.png
          node --input-type=module -e "import fs from 'node:fs'; const report=JSON.parse(fs.readFileSync('Docs/QA_AUTOPLAY_REPORT.json','utf8')); if (!report.snapshots?.length) throw new Error('No play snapshots'); console.log(JSON.stringify(report.checks, null, 2));"

      - name: Commit playtest evidence to QA branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Docs/QA_AUTOPLAY_REPORT.json Docs/QA_AUTOPLAY_REPORT.md Docs/QA_AUTOPLAY_SCREENSHOT.png
          if git diff --cached --quiet; then
            echo 'No report changes to commit.'
            exit 0
          fi
          git commit -m 'Record automated full-round QA playtest'
          git push origin HEAD:qa

      - name: Upload playtest evidence
        uses: actions/upload-artifact@v7
        with:
          name: severe-weather-qa-autoplay-${{ github.run_number }}
          path: |
            Docs/QA_AUTOPLAY_REPORT.json
            Docs/QA_AUTOPLAY_REPORT.md
            Docs/QA_AUTOPLAY_SCREENSHOT.png
          if-no-files-found: error
          retention-days: 14
