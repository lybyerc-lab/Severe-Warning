name: QA Automated Full Round

# Trigger refresh: 2026-08-01 full-round playtest
on:
  workflow_dispatch:
  push:
    branches:
      - qa
    paths:
      - '.github/workflows/qa-autoplay-full-round.yml'
      - 'MechanicsLab/**'
      - 'assets/**'
      - 'scripts/**'
      - 'src/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - 'vite.prelude.config.ts'
      - 'FILE_INVENTORY.txt'

permissions:
  contents: write

concurrency:
  group: qa-autoplay-full-round
  cancel-in-progress: true

jobs:
  play-full-round:
    name: Play full QA round
    runs-on: ubuntu-24.04
    # 30 was never tested against a visual gate that actually runs. Measured on
    # this runner: the play round is ~3.5 min, the world-tour sweep ~1 min, and
    # ONE attempt of the visual comparison is ~20 min (18 software-rendered
    # captures of a 2110-object scene); the gate runs two attempts for its
    # agreement rule. Until now the gate had always died early -- first because
    # the play round failed before reaching it, then because a baseline that
    # could not boot made it abort in ~5 min -- so its real cost had never been
    # paid. The first run that got that far was killed mid-second-attempt, which
    # also lost the world-tour sweep and the evidence commit that follow it.
    # Most commits now skip the comparison outright (see the render-input check
    # in scripts/visual-regression-gate.mjs); this budget is for the ones that
    # genuinely render.
    #
    # Raised from 60 when the 'hero-skinned' scenario was added. Captures scale
    # with viewports x scenarios x 3 (base-a, base-b, candidate): 18 an attempt
    # before, 21 now, which at the ~1.1 min a capture measured here takes one
    # attempt from ~20 to ~23 minutes and two from ~40 to ~47. Against the old
    # 60 that left roughly 7 minutes for the build, the play round and the sweep,
    # which together run ~6. A run of this workflow has already been lost once to
    # a budget set before the gate's real cost was known; 75 stops that being how
    # we find out a second time.
    timeout-minutes: 75

    steps:
      - name: Check out exact QA branch
        uses: actions/checkout@v6
        with:
          ref: qa
          # The visual regression gate rebuilds an earlier commit to compare
          # against, so the shallow default checkout is not enough history.
          fetch-depth: 50

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install pinned project dependencies
        shell: bash
        run: |
          npm install --global pnpm@11.9.0
          pnpm install --frozen-lockfile

      - name: Install Playwright browser harness
        shell: bash
        run: |
          pnpm exec playwright install --with-deps chromium

      - name: Restore verified QA audio cache
        id: audio-cache
        uses: actions/cache@v5
        with:
          path: assets/audio
          key: qa-autoplay-audio-${{ hashFiles('scripts/generate-storm-audio.mjs', 'scripts/apply-recorded-storm-effects.mjs', 'scripts/append-rampage-music.mjs') }}

      - name: Install FFmpeg on cache miss
        if: steps.audio-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg

      - name: Generate verified audio on cache miss
        if: steps.audio-cache.outputs.cache-hit != 'true'
        run: npm run audio:generate

      - name: Build exact patched QA game
        shell: bash
        run: |
          node --check scripts/qa-play-full-round.mjs
          node --check scripts/qa-v500-world-tour.mjs
          node --check scripts/verify-v500-campaign.mjs
          npm run verify:v500
          npm run verify:economy
          npm run verify:results
          npm run verify:orientation
          npm run verify:art
          npm run modern:typecheck
          npm test
          npm run modern:build
          node scripts/build-web.mjs
          node scripts/stamp-qa-pages.mjs

      # [SW:QA:SEE_THROUGH_GATE] The asset validator parses GLB headers and
      # counts vertices; it has never looked at a model. Three shipped with
      # holes you could see straight through -- industrial-warehouse-curved,
      # farm-windmill and tractor -- and every material property on them was
      # innocent, so nothing upstream had a way to notice. This renders each
      # packaged model from eight angles with and without backfaces and fails
      # if any pixel lights up only when backfaces draw.
      #
      # It runs here rather than in `pnpm build` on purpose: it needs a browser,
      # and this is the workflow that already installs one. Putting it in the
      # build would make every local and Android build depend on Chromium.
      #
      # It reads www/models, so it has to follow the build step above, and it
      # runs before the play round so a holed model fails in one minute rather
      # than twenty-five. Measured at 56.6 s for 128 models.
      - name: Gate on models you can see through
        env:
          # No CHROME_BIN: falls back to the Chromium `playwright install` put
          # in place, same as the visual gate below.
          SW_SEE_THROUGH_PORT: 4321
        run: node scripts/check-model-see-through.mjs

      - name: Start local QA web server
        shell: bash
        run: |
          python3 -m http.server 4173 --directory www > /tmp/qa-autoplay-server.log 2>&1 &
          echo $! > /tmp/qa-autoplay-server.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/qa-autoplay-server.log
          exit 1

      - name: Play complete normal-audio round
        env:
          QA_PLAY_URL: http://127.0.0.1:4173/
          QA_PLAY_OUTPUT: Docs
        run: node scripts/qa-play-full-round.mjs

      # [SW:QA:VISUAL_REGRESSION_GATE] Every verify-*.mjs check in this repo
      # asserts a string is present in the source; none of them can see. Roads on
      # causeways, a sand checkerboard, black metals, and cars buried in asphalt
      # all shipped with those checks green. This one renders the build and looks.
      - name: Gate on visual regression against the previous build
        env:
          # No CHROME_BIN: the compare harness falls back to the Chromium that
          # `playwright install` put in place a few steps up.
          SEVERE_WEATHER_VISUAL_DIR: qa-artifacts/visual-regression
        run: node scripts/visual-regression-gate.mjs

      - name: Sweep all four authored Heartland worlds
        env:
          QA_PLAY_URL: http://127.0.0.1:4173/
          QA_PLAY_OUTPUT: Docs
        run: node scripts/qa-v500-world-tour.mjs

      - name: Verify report exists
        shell: bash
        run: |
          test -s Docs/QA_AUTOPLAY_REPORT.json
          test -s Docs/QA_AUTOPLAY_REPORT.md
          test -s Docs/QA_AUTOPLAY_SCREENSHOT.png
          test -s Docs/QA_V500_WORLD_TOUR_REPORT.json
          test -s Docs/QA_V500_WORLD_TOUR_REPORT.md
          test -s Docs/QA_V500_WORLD_TOUR_SCREENSHOT.png
          node --input-type=module -e "import fs from 'node:fs'; const report=JSON.parse(fs.readFileSync('Docs/QA_AUTOPLAY_REPORT.json','utf8')); if (!report.snapshots?.length) throw new Error('No play snapshots'); console.log(JSON.stringify(report.checks, null, 2));"
          node --input-type=module -e "import fs from 'node:fs'; const report=JSON.parse(fs.readFileSync('Docs/QA_V500_WORLD_TOUR_REPORT.json','utf8')); if (report.states?.length !== 4) throw new Error('Four-stop sweep incomplete'); console.log(JSON.stringify(report.checks, null, 2));"

      # [SW:QA:EVIDENCE_PUSH] Land the evidence on a branch that moves underneath us.
      #
      # This step used to be `git commit && git push origin HEAD:qa` against the
      # SHA the job checked out. This job takes up to forty minutes, so any push
      # to qa while it runs leaves that push non-fast-forward, and run #172 went
      # red on exactly that -- every test passed, including a 33-minute visual
      # gate, and the job failed on bookkeeping. A red run that means "somebody
      # else pushed" is worse than no run: it trains everyone to ignore the badge.
      #
      # So the evidence is rebuilt on top of whatever qa is NOW, on each attempt.
      # The six files are pure build output, regenerated from scratch every run,
      # which is what makes reset-and-replay safe here and would not be safe for
      # a step that produced anything hand-written.
      #
      # A losing race is retried and, if it keeps losing, downgraded to a warning
      # rather than a failure -- the run's job is to test the build, and the same
      # files go up as a workflow artifact in the next step either way. Any OTHER
      # push failure (auth, branch protection) still fails the job loudly, because
      # those are real and must not hide behind a benign-looking retry.
      - name: Commit playtest evidence to QA branch
        shell: bash
        run: |
          set -uo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          EVIDENCE=(
            Docs/QA_AUTOPLAY_REPORT.json
            Docs/QA_AUTOPLAY_REPORT.md
            Docs/QA_AUTOPLAY_SCREENSHOT.png
            Docs/QA_V500_WORLD_TOUR_REPORT.json
            Docs/QA_V500_WORLD_TOUR_REPORT.md
            Docs/QA_V500_WORLD_TOUR_SCREENSHOT.png
          )

          STASH="${RUNNER_TEMP:-/tmp}/qa-evidence"
          rm -rf "$STASH"
          mkdir -p "$STASH/Docs"
          for file in "${EVIDENCE[@]}"; do
            [ -f "$file" ] && cp "$file" "$STASH/$file"
          done

          # A lost race is told apart from a real failure BY STATE, not by reading
          # git's wording. The first version of this matched the stderr against
          # 'non-fast-forward|fetch first|[rejected]', and a test that pushed a
          # competing commit between the fetch and the push produced
          # "cannot lock ref ... [remote rejected]" instead -- so a textbook race
          # was classified as a real failure and failed the job, which is the
          # exact bug this step exists to fix. Asking whether the branch moved
          # cannot be wrong-footed by a message this script does not predict.
          for attempt in 1 2 3 4; do
            git fetch --quiet origin qa || { echo "::warning::could not fetch origin/qa on attempt $attempt"; sleep $((attempt * 5)); continue; }
            BASE=$(git rev-parse FETCH_HEAD)
            git reset --hard --quiet "$BASE"

            for file in "${EVIDENCE[@]}"; do
              [ -f "$STASH/$file" ] && cp "$STASH/$file" "$file"
            done
            git add "${EVIDENCE[@]}"

            if git diff --cached --quiet; then
              echo "No report changes to commit (qa already has this evidence)."
              exit 0
            fi

            git commit --quiet -m 'Record automated full-round QA playtest'
            if git push origin HEAD:qa; then
              echo "Evidence pushed on attempt $attempt: $(git rev-parse --short HEAD)"
              exit 0
            fi

            if ! git fetch --quiet origin qa; then
              echo "::warning::push failed and origin is unreachable; retrying (attempt $attempt)"
              sleep $((attempt * 5))
              continue
            fi
            if [ "$(git rev-parse FETCH_HEAD)" = "$BASE" ]; then
              echo "::error::push to qa failed and qa has NOT moved, so this is not a race -- check credentials and branch protection"
              exit 1
            fi
            echo "qa moved under us ($(git rev-parse --short "$BASE") -> $(git rev-parse --short FETCH_HEAD)); rebuilding the evidence commit on the new tip (attempt $attempt)."
            sleep $((attempt * 5))
          done

          echo "::warning::qa moved under this job on every attempt, so the playtest evidence was not committed. The same report is attached to this run as an artifact."
          exit 0

      - name: Upload playtest evidence
        uses: actions/upload-artifact@v7
        with:
          name: severe-weather-qa-autoplay-${{ github.run_number }}
          path: |
            qa-artifacts/visual-regression
            Docs/QA_AUTOPLAY_REPORT.json
            Docs/QA_AUTOPLAY_REPORT.md
            Docs/QA_AUTOPLAY_SCREENSHOT.png
            Docs/QA_V500_WORLD_TOUR_REPORT.json
            Docs/QA_V500_WORLD_TOUR_REPORT.md
            Docs/QA_V500_WORLD_TOUR_SCREENSHOT.png
          if-no-files-found: error
          retention-days: 14
