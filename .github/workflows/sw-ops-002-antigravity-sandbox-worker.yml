name: SW-OPS-002 Antigravity Simple Worker

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches:
      - agent/sw-ops-001-antigravity-bridge
    paths:
      - 'tools/antigravity/sw-antigravity-sandbox-worker.mjs'
      - 'tools/antigravity/tasks/sw-ops-002-smoke.json'
      - 'tools/antigravity/tasks/task-slot.json'
      - 'scripts/verify-sw-ops-002-antigravity-worker.mjs'
      - '.github/workflows/sw-ops-002-antigravity-sandbox-worker.yml'

permissions:
  contents: read

jobs:
  static-and-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout candidate without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax-check worker
        run: node --check tools/antigravity/sw-antigravity-sandbox-worker.mjs

      - name: Verify simple worker contract
        run: node scripts/verify-sw-ops-002-antigravity-worker.mjs

      - name: Dry-run fixed smoke without API key
        env:
          GEMINI_API_KEY: ''
        run: >-
          node tools/antigravity/sw-antigravity-sandbox-worker.mjs execute
          --task tools/antigravity/tasks/sw-ops-002-smoke.json
          --output-dir evidence/sw-ops-002-dry
          --dry-run

      - name: Dry-run current task slot without API key
        env:
          GEMINI_API_KEY: ''
        run: >-
          node tools/antigravity/sw-antigravity-sandbox-worker.mjs execute
          --task tools/antigravity/tasks/task-slot.json
          --output-dir evidence/sw-ag-task-slot-dry
          --dry-run

      - name: Validate dry-run contracts
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const smoke = JSON.parse(fs.readFileSync('evidence/sw-ops-002-dry/request.json', 'utf8'));
          const slot = JSON.parse(fs.readFileSync('evidence/sw-ag-task-slot-dry/request.json', 'utf8'));
          const base = '10ccd2723b8fa6b925f47629491a9e51e6388500';
          const file = 'tools/antigravity/fixtures/sw-ops-002-smoke.txt';
          if (smoke.patchBaseSha !== base) throw new Error('wrong smoke patch base');
          if (JSON.stringify(smoke.allowedPaths) !== JSON.stringify([file])) throw new Error('smoke allowlist widened');
          if (smoke.tokenBudget > 8000 || smoke.maxPatchBytes > 10000) throw new Error('smoke budget widened');
          if (smoke.maxContinuationAttempts !== 0) throw new Error('smoke continuation widened');
          if (smoke.sandboxTrust !== 'untrusted') throw new Error('smoke sandbox became authoritative');
          if (slot.sandboxTrust !== 'untrusted') throw new Error('task slot sandbox became authoritative');
          if (slot.returnChannel !== 'allowlisted-files-to-host-derived-patch') throw new Error('wrong task slot return channel');
          if (slot.githubWriteAuthority !== false) throw new Error('task slot GitHub write authority widened');
          if (!Array.isArray(slot.allowedPaths) || !slot.allowedPaths.length) throw new Error('task slot allowlist missing');
          if (!['repository', 'focused-inline'].includes(slot.sourceMode ?? 'repository')) throw new Error('task slot source mode invalid');
          if (!Number.isInteger(slot.maxContinuationAttempts) || slot.maxContinuationAttempts < 0 || slot.maxContinuationAttempts > 1) throw new Error('task slot continuation attempts invalid');
          if (!Number.isInteger(slot.continuationTokenBudget) || slot.continuationTokenBudget < 2000 || slot.continuationTokenBudget > 50000) throw new Error('task slot continuation budget invalid');
          if ((slot.sourceMode ?? 'repository') === 'focused-inline') {
            if (slot.sourceManifest?.networkMode !== 'disabled') throw new Error('focused task network not disabled');
            const expected = slot.allowedPaths.length + (slot.contextPaths?.length || 0);
            if (slot.sourceManifest?.mountedBaseFiles?.length !== expected) throw new Error('focused source manifest incomplete');
          }
          NODE

  live-task-slot:
    if: >-
      github.run_attempt == 1 &&
      ((github.event_name == 'pull_request' &&
        contains(github.event.pull_request.labels.*.name, 'antigravity-sandbox-smoke') &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.head.ref == 'agent/sw-ops-002-antigravity-sandbox-worker') ||
       (github.event_name == 'workflow_dispatch' &&
        github.ref_name == 'agent/sw-ops-002-antigravity-sandbox-worker'))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout candidate without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Require one-shot Gemini secret
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          test "$RUN_ATTEMPT" = "1"
          test -n "$GEMINI_API_KEY"

      - name: Ask Antigravity to run current task slot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: >-
          node tools/antigravity/sw-antigravity-sandbox-worker.mjs execute
          --task tools/antigravity/tasks/task-slot.json
          --output-dir evidence/sw-ag-task-slot

      - name: Validate candidate patch envelope
        run: |
          test -s evidence/sw-ag-task-slot/result.json
          test -s evidence/sw-ag-task-slot/worker.patch
          node - <<'NODE'
          const fs = require('fs');
          const task = JSON.parse(fs.readFileSync('tools/antigravity/tasks/task-slot.json', 'utf8'));
          const result = JSON.parse(fs.readFileSync('evidence/sw-ag-task-slot/result.json', 'utf8'));
          const patch = fs.readFileSync('evidence/sw-ag-task-slot/worker.patch', 'utf8');
          const continuationLimit = task.maxContinuationAttempts ?? 0;
          const continuationTokenBudget = task.continuationTokenBudget ?? task.tokenBudget;
          if (result.status !== 'quarantined-patch-ready') throw new Error('patch not ready');
          if (result.taskId !== task.taskId) throw new Error('wrong task result');
          if (result.patchBaseSha !== task.exactBaseSha) throw new Error('wrong patch base');
          if (!result.rootInteractionId || !result.interactionId || !result.environmentId) throw new Error('missing interaction evidence');
          if (result.interactionStatus !== 'completed') throw new Error('Antigravity interaction did not complete');
          if (result.sourceMode !== (task.sourceMode ?? 'repository')) throw new Error('wrong task source mode');
          if (!Number.isInteger(result.continuationCount) || result.continuationCount < 0 || result.continuationCount > continuationLimit) throw new Error('continuation count escaped task limit');
          if (result.continuationLimit !== continuationLimit) throw new Error('wrong continuation limit');
          if (result.continuationTokenBudget !== continuationTokenBudget) throw new Error('wrong continuation token budget');
          if (!Array.isArray(result.interactionIds) || result.interactionIds.length !== result.continuationCount + 1) throw new Error('invalid interaction chain');
          if (!Array.isArray(result.interactionChain) || result.interactionChain.length !== result.interactionIds.length) throw new Error('missing interaction chain evidence');
          if (result.rootInteractionId !== result.interactionIds[0]) throw new Error('wrong root interaction');
          if (result.interactionId !== result.interactionIds[result.interactionIds.length - 1]) throw new Error('wrong final interaction');
          if (result.sandboxTrust !== 'untrusted') throw new Error('sandbox became authoritative');
          if (!Array.isArray(result.changedFiles) || !result.changedFiles.length) throw new Error('task returned no changed files');
          for (const file of result.changedFiles) {
            if (!task.allowedPaths.includes(file)) throw new Error(`patch escaped allowlist: ${file}`);
          }
          if (/^deleted file mode /m.test(patch) || /^\+\+\+ \/dev\/null$/m.test(patch)) throw new Error('candidate patch deletes an allowlisted file');
          if (result.patchBytes <= 0 || result.patchBytes > task.maxPatchBytes) throw new Error('patch size invalid');
          if (result.githubWriteAuthority !== false) throw new Error('GitHub write authority widened');
          NODE

      - name: Prove candidate on task base
        run: |
          BASE_SHA=$(node -e "const x=require('./tools/antigravity/tasks/task-slot.json');process.stdout.write(x.exactBaseSha)")
          DIR="$RUNNER_TEMP/sw-ag-task-slot-candidate"
          git worktree add --detach "$DIR" "$BASE_SHA"
          git -C "$DIR" apply --check "$GITHUB_WORKSPACE/evidence/sw-ag-task-slot/worker.patch"
          git -C "$DIR" apply "$GITHUB_WORKSPACE/evidence/sw-ag-task-slot/worker.patch"
          git -C "$DIR" diff --check

      - name: Upload task evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sw-antigravity-task-slot-evidence
          path: |
            evidence/sw-ag-task-slot/
            tools/antigravity/tasks/task-slot.json
          if-no-files-found: warn
