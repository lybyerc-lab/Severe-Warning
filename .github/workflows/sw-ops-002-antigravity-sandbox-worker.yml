name: SW-OPS-002 Antigravity Simple Worker

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches:
      - agent/sw-ops-001-antigravity-bridge
    paths:
      - 'tools/antigravity/sw-antigravity-sandbox-worker.mjs'
      - 'tools/antigravity/tasks/sw-ops-002-smoke.json'
      - 'scripts/verify-sw-ops-002-antigravity-worker.mjs'
      - '.github/workflows/sw-ops-002-antigravity-sandbox-worker.yml'

permissions:
  contents: read

jobs:
  static-and-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout candidate without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax-check worker
        run: node --check tools/antigravity/sw-antigravity-sandbox-worker.mjs

      - name: Verify simple worker contract
        run: node scripts/verify-sw-ops-002-antigravity-worker.mjs

      - name: Dry-run initial request without API key
        env:
          GEMINI_API_KEY: ''
        run: >-
          node tools/antigravity/sw-antigravity-sandbox-worker.mjs execute
          --task tools/antigravity/tasks/sw-ops-002-smoke.json
          --output-dir evidence/sw-ops-002-dry
          --dry-run

      - name: Dry-run continuation without API key
        env:
          GEMINI_API_KEY: ''
        run: >-
          node tools/antigravity/sw-antigravity-sandbox-worker.mjs continue
          --task tools/antigravity/tasks/sw-ops-002-smoke.json
          --interaction test_interaction_id
          --environment test_environment_id
          --input "Change only the allowlisted fixture"
          --output-dir evidence/sw-ops-002-dry-continue
          --dry-run

      - name: Validate dry-run contract
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const first = JSON.parse(fs.readFileSync('evidence/sw-ops-002-dry/request.json', 'utf8'));
          const next = JSON.parse(fs.readFileSync('evidence/sw-ops-002-dry-continue/request.json', 'utf8'));
          const base = '10ccd2723b8fa6b925f47629491a9e51e6388500';
          const file = 'tools/antigravity/fixtures/sw-ops-002-smoke.txt';
          if (first.patchBaseSha !== base) throw new Error('wrong patch base');
          if (JSON.stringify(first.allowedPaths) !== JSON.stringify([file])) throw new Error('allowlist widened');
          if (first.tokenBudget > 8000 || first.maxPatchBytes > 10000) throw new Error('budget widened');
          if (first.sandboxTrust !== 'untrusted') throw new Error('sandbox became authoritative');
          if (first.returnChannel !== 'allowlisted-files-to-host-derived-patch') throw new Error('wrong return channel');
          if (first.githubWriteAuthority !== false) throw new Error('GitHub write authority widened');
          if (next.mode !== 'continue' || next.environmentId !== 'test_environment_id') throw new Error('continuation contract broken');
          NODE

  live-sandbox-smoke:
    if: >-
      contains(github.event.pull_request.labels.*.name, 'antigravity-sandbox-smoke') &&
      github.run_attempt == 1 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/sw-ops-002-antigravity-sandbox-worker'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout candidate without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Require one-shot Gemini secret
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          test "$RUN_ATTEMPT" = "1"
          test -n "$GEMINI_API_KEY"

      - name: Ask Antigravity for bounded edit
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: >-
          node tools/antigravity/sw-antigravity-sandbox-worker.mjs execute
          --task tools/antigravity/tasks/sw-ops-002-smoke.json
          --output-dir evidence/sw-ops-002-live

      - name: Validate candidate patch envelope
        run: |
          test -s evidence/sw-ops-002-live/result.json
          test -s evidence/sw-ops-002-live/worker.patch
          node - <<'NODE'
          const fs = require('fs');
          const result = JSON.parse(fs.readFileSync('evidence/sw-ops-002-live/result.json', 'utf8'));
          const base = '10ccd2723b8fa6b925f47629491a9e51e6388500';
          const file = 'tools/antigravity/fixtures/sw-ops-002-smoke.txt';
          if (result.status !== 'quarantined-patch-ready') throw new Error('patch not ready');
          if (result.patchBaseSha !== base) throw new Error('wrong patch base');
          if (!result.interactionId || !result.environmentId) throw new Error('missing continuation IDs');
          if (result.sandboxTrust !== 'untrusted') throw new Error('sandbox became authoritative');
          if (JSON.stringify(result.changedFiles) !== JSON.stringify([file])) throw new Error('patch escaped allowlist');
          if (result.patchBytes <= 0 || result.patchBytes > 10000) throw new Error('patch size invalid');
          if (result.githubWriteAuthority !== false) throw new Error('GitHub write authority widened');
          NODE

      - name: Prove candidate on frozen base
        run: |
          BASE_SHA='10ccd2723b8fa6b925f47629491a9e51e6388500'
          DIR="$RUNNER_TEMP/sw-ops-002-initial"
          git worktree add --detach "$DIR" "$BASE_SHA"
          git -C "$DIR" apply --check "$GITHUB_WORKSPACE/evidence/sw-ops-002-live/worker.patch"
          git -C "$DIR" apply "$GITHUB_WORKSPACE/evidence/sw-ops-002-live/worker.patch"
          git -C "$DIR" diff --check
          test "$(cat "$DIR/tools/antigravity/fixtures/sw-ops-002-smoke.txt")" = $'SW-OPS-002 sandbox worker reached\nGitHub writes remain Director-controlled'

      - name: Send one Director correction
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          INTERACTION_ID=$(node -e "const x=require('./evidence/sw-ops-002-live/result.json');process.stdout.write(x.interactionId)")
          ENVIRONMENT_ID=$(node -e "const x=require('./evidence/sw-ops-002-live/result.json');process.stdout.write(x.environmentId)")
          node tools/antigravity/sw-antigravity-sandbox-worker.mjs continue \
            --task tools/antigravity/tasks/sw-ops-002-smoke.json \
            --interaction "$INTERACTION_ID" \
            --environment "$ENVIRONMENT_ID" \
            --input "Keep the first line unchanged. Change only the second line to exactly 'Director controls every GitHub write'. Make no other intentional edit, run the lightweight checks, and stop." \
            --output-dir evidence/sw-ops-002-revised

      - name: Validate revised patch
        run: |
          node - <<'NODE'
          const first = require('./evidence/sw-ops-002-live/result.json');
          const next = require('./evidence/sw-ops-002-revised/result.json');
          const file = 'tools/antigravity/fixtures/sw-ops-002-smoke.txt';
          if (next.environmentId !== first.environmentId) throw new Error('correction did not reuse sandbox');
          if (!next.interactionId || next.interactionId === first.interactionId) throw new Error('correction interaction missing');
          if (JSON.stringify(next.changedFiles) !== JSON.stringify([file])) throw new Error('revised patch escaped allowlist');
          NODE

      - name: Prove revised patch on frozen base
        run: |
          BASE_SHA='10ccd2723b8fa6b925f47629491a9e51e6388500'
          DIR="$RUNNER_TEMP/sw-ops-002-revised"
          git worktree add --detach "$DIR" "$BASE_SHA"
          git -C "$DIR" apply --check "$GITHUB_WORKSPACE/evidence/sw-ops-002-revised/worker.patch"
          git -C "$DIR" apply "$GITHUB_WORKSPACE/evidence/sw-ops-002-revised/worker.patch"
          git -C "$DIR" diff --check
          test "$(cat "$DIR/tools/antigravity/fixtures/sw-ops-002-smoke.txt")" = $'SW-OPS-002 sandbox worker reached\nDirector controls every GitHub write'

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sw-ops-002-simple-worker-evidence
          path: |
            evidence/sw-ops-002-live/
            evidence/sw-ops-002-revised/
          if-no-files-found: warn
