name: SW-ART-002 Google Live Reference

on:
  push:
    branches:
      - agent/sw-art-002-google-live-reference
    paths:
      - tools/google-ai/live-requests/**

permissions:
  contents: read

concurrency:
  group: sw-art-002-google-live-reference
  cancel-in-progress: false

jobs:
  generate-reference:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact request source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify request and secret contract
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$GEMINI_API_KEY" || { echo 'GEMINI_API_KEY repository secret is missing or empty.' >&2; exit 1; }
          request='tools/google-ai/live-requests/cow17-reference-v1.json'
          test -f "$request"
          node - <<'NODE'
          const fs = require('fs');
          const request = JSON.parse(fs.readFileSync('tools/google-ai/live-requests/cow17-reference-v1.json', 'utf8'));
          const expected = {
            version: 'SW_ART_LIVE_REQUEST_V1',
            id: 'cow17-reference-v1',
            command: 'image',
            brief: 'cow17',
            model: 'gemini-3.1-flash-image',
            output: 'art-source/generated/google-ai/cow17/cow17-reference-v1.png'
          };
          for (const [key, value] of Object.entries(expected)) {
            if (request[key] !== value) throw new Error(`Unexpected ${key}: ${request[key]}`);
          }
          if (request.productionAuthority !== 'reference only') throw new Error('Live request must remain reference only.');
          console.log('SW-ART-002 request contract PASS');
          NODE

      - name: Preserve Google art tooling contract
        run: node scripts/verify-sw-art-001-google-ai-pipeline.mjs

      - name: Generate Cow 17 reference sheet
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p art-source/generated/google-ai/cow17
          node tools/google-ai/sw-google-art.mjs image \
            --brief cow17 \
            --model gemini-3.1-flash-image \
            --output art-source/generated/google-ai/cow17/cow17-reference-v1.png
          test -s art-source/generated/google-ai/cow17/cow17-reference-v1.png
          test -s art-source/generated/google-ai/cow17/cow17-reference-v1.png.json

      - name: Record non-secret generation receipt
        shell: bash
        run: |
          set -euo pipefail
          cat > sw-art-002-receipt.json <<EOF
          {
            "version": "SW_ART_002_RECEIPT_V1",
            "source_sha": "${GITHUB_SHA}",
            "request": "cow17-reference-v1",
            "brief": "cow17",
            "model": "gemini-3.1-flash-image",
            "productionAuthority": "reference only",
            "googleDriveTarget": "Severe Weather Warning/02_AI Art Source/Google Generations/01_Character References"
          }
          EOF

      - name: Upload generated reference evidence
        uses: actions/upload-artifact@v4
        with:
          name: sw-art-002-cow17-reference-v1
          retention-days: 30
          if-no-files-found: error
          path: |
            art-source/generated/google-ai/cow17/cow17-reference-v1.png
            art-source/generated/google-ai/cow17/cow17-reference-v1.png.json
            sw-art-002-receipt.json
