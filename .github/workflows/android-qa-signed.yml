name: Build Signed Android QA APK

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag, or commit to package
        required: true
        default: qa
        type: string
  push:
    branches:
      - qa
    paths:
      - '.github/workflows/android-qa-signed.yml'
      - 'MechanicsLab/**'
      - 'android/**'
      - 'assets/**'
      - 'scripts/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

concurrency:
  group: android-qa-signed
  cancel-in-progress: false

jobs:
  build-signed-qa-apk:
    name: Build signed QA APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    env:
      SEVERE_WEATHER_APPLICATION_ID: com.lybyerclab.severeweather.qa
      SEVERE_WEATHER_QA_KEYSTORE_PATH: ${{ github.workspace }}/.qa-signing/severe-weather-qa.jks
      SEVERE_WEATHER_QA_KEYSTORE_PASSWORD: ${{ secrets.SEVERE_WEATHER_QA_KEYSTORE_PASSWORD }}
      SEVERE_WEATHER_QA_KEY_ALIAS: ${{ secrets.SEVERE_WEATHER_QA_KEY_ALIAS }}
      SEVERE_WEATHER_QA_KEY_PASSWORD: ${{ secrets.SEVERE_WEATHER_QA_KEY_PASSWORD }}

    steps:
      - name: Check out requested source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Resolve source and package identity
        shell: bash
        run: |
          source_commit="$(git rev-parse HEAD)"
          version_code="$((500000 + GITHUB_RUN_NUMBER))"
          version_name="5.0.0-qa.${GITHUB_RUN_NUMBER}"
          source_ref="${{ inputs.source_ref || github.ref_name }}"
          echo "SEVERE_WEATHER_SOURCE_COMMIT=$source_commit" >> "$GITHUB_ENV"
          echo "SEVERE_WEATHER_SOURCE_REF=$source_ref" >> "$GITHUB_ENV"
          echo "SEVERE_WEATHER_VERSION_CODE=$version_code" >> "$GITHUB_ENV"
          echo "SEVERE_WEATHER_VERSION_NAME=$version_name" >> "$GITHUB_ENV"
          echo "Source commit: $source_commit"
          echo "Application ID: $SEVERE_WEATHER_APPLICATION_ID"
          echo "Version code: $version_code"
          echo "Version name: $version_name"

      - name: Verify signing secrets are configured
        shell: bash
        env:
          QA_KEYSTORE_BASE64: ${{ secrets.SEVERE_WEATHER_QA_KEYSTORE_BASE64 }}
        run: |
          missing=0
          for name in QA_KEYSTORE_BASE64 SEVERE_WEATHER_QA_KEYSTORE_PASSWORD SEVERE_WEATHER_QA_KEY_ALIAS SEVERE_WEATHER_QA_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required repository secret: $name" >&2
              missing=1
            fi
          done
          exit "$missing"

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Install FFmpeg and pinned JavaScript dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          npm install --global pnpm@11.9.0
          pnpm install --frozen-lockfile

      - name: Restore verified QA audio cache
        id: audio-cache
        uses: actions/cache@v5
        with:
          path: assets/audio
          key: qa-audio-${{ hashFiles('scripts/generate-storm-audio.mjs', 'scripts/apply-recorded-storm-effects.mjs', 'scripts/append-rampage-music.mjs') }}

      - name: Generate verified audio on cache miss
        if: steps.audio-cache.outputs.cache-hit != 'true'
        run: npm run audio:generate

      - name: Apply accepted deterministic patch chain
        shell: bash
        run: |
          npm run patch:v431
          npm run patch:v440
          npm run patch:v441
          npm run patch:v442
          npm run patch:v450
          npm run patch:v500

      - name: Build, stamp, and synchronize offline Android assets
        shell: bash
        run: |
          node scripts/build-web.mjs
          GITHUB_SHA="$SEVERE_WEATHER_SOURCE_COMMIT" node scripts/stamp-qa-pages.mjs
          node scripts/verify-qa-package.mjs
          node scripts/verify-v500-campaign.mjs
          node node_modules/@capacitor/cli/bin/capacitor sync android
          cmp -s www/index.html android/app/src/main/assets/public/index.html
          cmp -s www/audio/storm-feel-sprite.wav android/app/src/main/assets/public/audio/storm-feel-sprite.wav
          cmp -s www/audio/storm-feel-manifest.json android/app/src/main/assets/public/audio/storm-feel-manifest.json

      - name: Restore persistent QA signing key
        shell: bash
        env:
          QA_KEYSTORE_BASE64: ${{ secrets.SEVERE_WEATHER_QA_KEYSTORE_BASE64 }}
        run: |
          mkdir -p .qa-signing
          chmod 700 .qa-signing
          printf '%s' "$QA_KEYSTORE_BASE64" | base64 --decode > "$SEVERE_WEATHER_QA_KEYSTORE_PATH"
          chmod 600 "$SEVERE_WEATHER_QA_KEYSTORE_PATH"
          keytool -list \
            -keystore "$SEVERE_WEATHER_QA_KEYSTORE_PATH" \
            -storepass "$SEVERE_WEATHER_QA_KEYSTORE_PASSWORD" \
            -alias "$SEVERE_WEATHER_QA_KEY_ALIAS" >/dev/null

      - name: Assemble signed QA release APK
        shell: bash
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify identity, signer, and checksum
        id: package
        shell: bash
        run: |
          source_apk="android/app/build/outputs/apk/release/app-release.apk"
          output_dir="dist/android-qa"
          output_apk="$output_dir/Severe-Weather-v5.0.0-QA-${GITHUB_RUN_NUMBER}.apk"
          metadata="android/app/build/outputs/apk/release/output-metadata.json"

          test -s "$source_apk"
          test -s "$metadata"
          mkdir -p "$output_dir"
          cp "$source_apk" "$output_apk"

          apksigner_bin="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner_bin"
          "$apksigner_bin" verify --verbose --print-certs "$output_apk" | tee "$output_dir/apksigner-report.txt"

          actual_application_id="$(node --input-type=module -e "import fs from 'node:fs'; const m=JSON.parse(fs.readFileSync('$metadata','utf8')); process.stdout.write(m.applicationId || '')")"
          actual_version_code="$(node --input-type=module -e "import fs from 'node:fs'; const m=JSON.parse(fs.readFileSync('$metadata','utf8')); process.stdout.write(String(m.elements?.[0]?.versionCode ?? ''))")"
          actual_version_name="$(node --input-type=module -e "import fs from 'node:fs'; const m=JSON.parse(fs.readFileSync('$metadata','utf8')); process.stdout.write(String(m.elements?.[0]?.versionName ?? ''))")"

          [[ "$actual_application_id" == "$SEVERE_WEATHER_APPLICATION_ID" ]]
          [[ "$actual_version_code" == "$SEVERE_WEATHER_VERSION_CODE" ]]
          [[ "$actual_version_name" == "$SEVERE_WEATHER_VERSION_NAME" ]]

          sha256sum "$output_apk" | tee "$output_apk.sha256"
          cert_sha256="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$output_dir/apksigner-report.txt" | head -n 1)"
          test -n "$cert_sha256"

          cat > "$output_dir/package-manifest.json" <<EOF
          {
            "sourceRef": "$SEVERE_WEATHER_SOURCE_REF",
            "sourceCommit": "$SEVERE_WEATHER_SOURCE_COMMIT",
            "workflowRun": $GITHUB_RUN_NUMBER,
            "applicationId": "$actual_application_id",
            "versionCode": $actual_version_code,
            "versionName": "$actual_version_name",
            "signerCertificateSha256": "$cert_sha256",
            "apkFile": "$(basename "$output_apk")",
            "apkSha256": "$(sha256sum "$output_apk" | awk '{print $1}')"
          }
          EOF

          echo "apk_path=$output_apk" >> "$GITHUB_OUTPUT"
          echo "artifact_name=severe-weather-v5.0.0-qa-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Upload signed QA package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: dist/android-qa/
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -rf .qa-signing
