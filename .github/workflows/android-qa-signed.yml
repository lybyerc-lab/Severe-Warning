name: Build Signed Android QA APK

# Every qa push produces a higher version code so installed QA builds can update in place.

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag, or commit to package
        required: true
        default: qa
        type: string
  push:
    branches:
      - qa
    paths:
      - '.github/workflows/android-qa-signed.yml'
      - 'MechanicsLab/**'
      - 'android/**'
      - 'assets/**'
      - 'scripts/**'
      - 'src/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - 'vite.prelude.config.ts'
      - 'FILE_INVENTORY.txt'

permissions:
  contents: read

concurrency:
  group: android-qa-signed
  cancel-in-progress: false

jobs:
  build-signed-qa-apk:
    name: Build signed QA APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    env:
      SEVERE_WEATHER_APPLICATION_ID: com.lybyerclab.severeweather.qa
      SEVERE_WEATHER_QA_KEYSTORE_PATH: ${{ github.workspace }}/.qa-signing/severe-weather-qa.jks
      SEVERE_WEATHER_QA_KEYSTORE_PASSWORD: ${{ secrets.SEVERE_WEATHER_QA_KEYSTORE_PASSWORD }}
      SEVERE_WEATHER_QA_KEY_ALIAS: ${{ secrets.SEVERE_WEATHER_QA_KEY_ALIAS }}
      SEVERE_WEATHER_QA_KEY_PASSWORD: ${{ secrets.SEVERE_WEATHER_QA_KEY_PASSWORD }}

    steps:
      - name: Check out requested source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Resolve source and package identity
        shell: bash
        run: |
          source_commit="$(git rev-parse HEAD)"
          base_version="$(node -p "require('./package.json').version")"
          if [[ ! "$base_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::package.json version must be semantic x.y.z, received: $base_version"
            exit 1
          fi
          IFS='.' read -r major minor patch <<< "$base_version"
          if (( minor > 9 || patch > 9 )); then
            echo "::error::The xyz versionCode scheme cannot encode $base_version; minor and patch must each stay below 10."
            exit 1
          fi
          if (( GITHUB_RUN_NUMBER > 999 )); then
            echo "::error::Run number $GITHUB_RUN_NUMBER no longer fits the QA versionCode scheme; widen the multiplier before packaging again."
            exit 1
          fi

          # QA builds keep their own per-run identity so an installed QA APK can
          # update in place, but the base version now comes from package.json
          # instead of a literal that silently goes stale.
          version_code="$(( (major * 100 + minor * 10 + patch) * 1000 + GITHUB_RUN_NUMBER ))"
          version_name="${base_version}-qa.${GITHUB_RUN_NUMBER}"
          source_ref="${{ inputs.source_ref || github.ref_name }}"
          echo "SEVERE_WEATHER_BASE_VERSION=$base_version" >> "$GITHUB_ENV"
          echo "SEVERE_WEATHER_SOURCE_COMMIT=$source_commit" >> "$GITHUB_ENV"
          echo "SEVERE_WEATHER_SOURCE_REF=$source_ref" >> "$GITHUB_ENV"
          echo "SEVERE_WEATHER_VERSION_CODE=$version_code" >> "$GITHUB_ENV"
          echo "SEVERE_WEATHER_VERSION_NAME=$version_name" >> "$GITHUB_ENV"
          echo "Source commit: $source_commit"
          echo "Application ID: $SEVERE_WEATHER_APPLICATION_ID"
          echo "Version code: $version_code"
          echo "Version name: $version_name"

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Install FFmpeg and pinned JavaScript dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          npm install --global pnpm@11.9.0
          pnpm install --frozen-lockfile

      - name: Restore verified QA audio cache
        id: audio-cache
        uses: actions/cache@v5
        with:
          path: assets/audio
          key: qa-audio-${{ hashFiles('scripts/generate-storm-audio.mjs', 'scripts/apply-recorded-storm-effects.mjs', 'scripts/append-rampage-music.mjs') }}

      - name: Generate verified audio on cache miss
        if: steps.audio-cache.outputs.cache-hit != 'true'
        run: npm run audio:generate

      - name: Build, stamp, and synchronize offline Android assets
        shell: bash
        run: |
          npm run modern:typecheck
          npm test
          npm run modern:build
          node scripts/build-web.mjs
          GITHUB_SHA="$SEVERE_WEATHER_SOURCE_COMMIT" node scripts/stamp-qa-pages.mjs
          node scripts/verify-qa-package.mjs
          node scripts/verify-v500-campaign.mjs
          node scripts/verify-v510-production-slice.mjs
          node scripts/verify-app-art.mjs
          npm run verify:phase2
          npm run verify:phase3
          npm run verify:phase4
          npm run verify:phase5
          node node_modules/@capacitor/cli/bin/capacitor sync android
          sync_failed=0
          while IFS= read -r -d '' asset; do
            rel="${asset#www/}"
            packaged="android/app/src/main/assets/public/$rel"
            if [ ! -f "$packaged" ]; then
              echo "::error::asset missing from APK payload: $rel"
              sync_failed=1
            elif ! cmp -s "$asset" "$packaged"; then
              echo "::error::asset differs from its www/ source in the APK: $rel"
              sync_failed=1
            fi
          done < <(find www -type f -print0)
          if [ "$sync_failed" -ne 0 ]; then
            echo "::error::Capacitor sync did not reproduce www/ faithfully; refusing to package."
            exit 1
          fi
          echo "asset sync verified: $(find www -type f | wc -l) file(s)"

      - name: Setup QA signing key
        shell: bash
        env:
          QA_KEYSTORE_BASE64: ${{ secrets.SEVERE_WEATHER_QA_KEYSTORE_BASE64 }}
          QA_KEYSTORE_PASS: ${{ secrets.SEVERE_WEATHER_QA_KEYSTORE_PASSWORD }}
          QA_KEY_ALIAS: ${{ secrets.SEVERE_WEATHER_QA_KEY_ALIAS }}
          QA_KEY_PASS: ${{ secrets.SEVERE_WEATHER_QA_KEY_PASSWORD }}
        run: |
          mkdir -p .qa-signing
          chmod 700 .qa-signing
          if [[ -n "$QA_KEYSTORE_BASE64" && -n "$QA_KEYSTORE_PASS" ]]; then
            echo "Using repository configured QA signing keystore..."
            printf '%s' "$QA_KEYSTORE_BASE64" | base64 --decode > "$SEVERE_WEATHER_QA_KEYSTORE_PATH"
          else
            echo "Provisioning automated QA build signing key..."
            keytool -genkeypair -v \
              -keystore "$SEVERE_WEATHER_QA_KEYSTORE_PATH" \
              -storepass "severeweatherqa" \
              -alias "severe-weather-qa" \
              -keypass "severeweatherqa" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=SevereWeatherQA, OU=QA, O=LybyerLab, L=Lincoln, ST=Nebraska, C=US"
            echo "SEVERE_WEATHER_QA_KEYSTORE_PASSWORD=severeweatherqa" >> "$GITHUB_ENV"
            echo "SEVERE_WEATHER_QA_KEY_ALIAS=severe-weather-qa" >> "$GITHUB_ENV"
            echo "SEVERE_WEATHER_QA_KEY_PASSWORD=severeweatherqa" >> "$GITHUB_ENV"
          fi
          chmod 600 "$SEVERE_WEATHER_QA_KEYSTORE_PATH"

      - name: Assemble signed QA release APK
        shell: bash
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify identity, signer, and checksum
        id: package
        shell: bash
        run: |
          source_apk="android/app/build/outputs/apk/release/app-release.apk"
          output_dir="dist/android-qa"
          output_apk="$output_dir/Severe-Weather-v${SEVERE_WEATHER_BASE_VERSION}-QA-${GITHUB_RUN_NUMBER}.apk"
          metadata="android/app/build/outputs/apk/release/output-metadata.json"

          test -s "$source_apk"
          test -s "$metadata"
          mkdir -p "$output_dir"
          cp "$source_apk" "$output_apk"

          apksigner_bin="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner_bin"
          "$apksigner_bin" verify --verbose --print-certs "$output_apk" | tee "$output_dir/apksigner-report.txt"

          actual_application_id="$(node --input-type=module -e "import fs from 'node:fs'; const m=JSON.parse(fs.readFileSync('$metadata','utf8')); process.stdout.write(m.applicationId || '')")"
          actual_version_code="$(node --input-type=module -e "import fs from 'node:fs'; const m=JSON.parse(fs.readFileSync('$metadata','utf8')); process.stdout.write(String(m.elements?.[0]?.versionCode ?? ''))")"
          actual_version_name="$(node --input-type=module -e "import fs from 'node:fs'; const m=JSON.parse(fs.readFileSync('$metadata','utf8')); process.stdout.write(String(m.elements?.[0]?.versionName ?? ''))")"

          identity_ok=1
          if [[ "$actual_application_id" != "$SEVERE_WEATHER_APPLICATION_ID" ]]; then
            echo "::error::APK applicationId is '$actual_application_id', expected '$SEVERE_WEATHER_APPLICATION_ID'"
            identity_ok=0
          fi
          if [[ "$actual_version_code" != "$SEVERE_WEATHER_VERSION_CODE" ]]; then
            echo "::error::APK versionCode is '$actual_version_code', expected '$SEVERE_WEATHER_VERSION_CODE'"
            identity_ok=0
          fi
          if [[ "$actual_version_name" != "$SEVERE_WEATHER_VERSION_NAME" ]]; then
            echo "::error::APK versionName is '$actual_version_name', expected '$SEVERE_WEATHER_VERSION_NAME'"
            identity_ok=0
          fi
          if (( identity_ok == 0 )); then
            echo "::error::Signed QA APK identity does not match package.json. Refusing to publish a mislabelled artifact."
            exit 1
          fi

          sha256sum "$output_apk" | tee "$output_apk.sha256"
          cert_sha256="$(awk -F': ' '/certificate SHA-256 digest:/ { print $NF; exit }' "$output_dir/apksigner-report.txt")"
          test -n "$cert_sha256"

          cat > "$output_dir/package-manifest.json" <<EOF
          {
            "sourceRef": "$SEVERE_WEATHER_SOURCE_REF",
            "sourceCommit": "$SEVERE_WEATHER_SOURCE_COMMIT",
            "workflowRun": $GITHUB_RUN_NUMBER,
            "applicationId": "$actual_application_id",
            "versionCode": $actual_version_code,
            "versionName": "$actual_version_name",
            "signerCertificateSha256": "$cert_sha256",
            "apkFile": "$(basename "$output_apk")",
            "apkSha256": "$(sha256sum "$output_apk" | awk '{print $1}')"
          }
          EOF

          echo "apk_path=$output_apk" >> "$GITHUB_OUTPUT"
          echo "artifact_name=severe-weather-v${SEVERE_WEATHER_BASE_VERSION}-qa-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Upload signed QA package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: dist/android-qa/
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -rf .qa-signing
