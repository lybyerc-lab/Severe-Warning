<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#030712">
    <title>Severe Weather Warning — Offline</title>
    <style>
      :root { color-scheme: dark; background: #030712; font-family: system-ui, sans-serif; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: radial-gradient(circle at 50% 18%, #1e3a5f 0%, #030712 58%); color: #e2e8f0; }
      main { width: min(34rem, calc(100% - 3rem)); text-align: center; }
      h1 { margin: 0; font-size: clamp(1.7rem, 6vw, 3rem); letter-spacing: .02em; }
      p { color: #bae6fd; line-height: 1.55; }
    </style>
  </head>
  <body>
    <main>
      <h1>Severe Weather Warning</h1>
      <p>You are offline. Reconnect to load the latest storm warning.</p>
    </main>
  </body>
</html>
