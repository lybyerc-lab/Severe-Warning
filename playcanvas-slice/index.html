<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111923" />
    <title>Severe Weather Warning | PlayCanvas Playable Slice</title>
  </head>
  <body>
    <main id="app" aria-label="Severe Weather PlayCanvas playable production slice">
      <section class="slice-hud" aria-label="Playable slice status">
        <p class="slice-kicker">PLAYCANVAS PLAYABLE SLICE</p>
        <div class="slice-title-row">
          <div>
            <h1>Prairie Junction</h1>
            <p>Accepted gameplay authority + PlayCanvas presentation</p>
          </div>
          <button id="reset-run" class="reset-button" type="button">Reset</button>
        </div>
        <div class="score-strip">
          <div><span>TIME</span><strong id="hud-time">3:00</strong></div>
          <div><span>SCORE</span><strong id="hud-score">0</strong></div>
          <div><span>COMBO</span><strong id="hud-combo">1.00x</strong></div>
        </div>
        <p id="hud-target" class="target-line">Connecting accepted gameplay executor…</p>
      </section>

      <section class="ability-dock" aria-label="Storm abilities">
        <button type="button" class="ability-button" data-ability="primary">
          <span class="ability-key">1</span><strong>Pull</strong><small id="cooldown-primary">READY</small>
        </button>
        <button type="button" class="ability-button" data-ability="secondary">
          <span class="ability-key">2</span><strong>Gust</strong><small id="cooldown-secondary">READY</small>
        </button>
        <button type="button" class="ability-button" data-ability="tertiary">
          <span class="ability-key">3</span><strong>Zap</strong><small id="cooldown-tertiary">READY</small>
        </button>
      </section>

      <section class="joystick" id="joystick" aria-label="Touch tornado movement">
        <div class="joystick-ring"><div class="joystick-knob" id="joystick-knob"></div></div>
      </section>

      <div id="slice-status" role="status" aria-live="polite">Loading PlayCanvas renderer…</div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
